// ---------- Auction Draft mode (Zimmer) ----------
// Core UX: someone nominates a player -> search for them -> see everything
// needed to decide a bid, in one card. Manual search is the mechanism for now
// (see ASSUMED_BUDGET/ASSUMED_ROSTER note above for the other manual-tracking
// assumption this depends on).

function expectedBidRange(player){
  if(!ZHIST || !player.seanPosRank || player.pos==='NA') return null;
  const tier = tierLabelForRank(player.pos, player.seanPosRank - 1);
  const row = (ZHIST.tier_spreads||[]).find(t=>t.position===player.pos && t.tier===tier);
  return row ? {...row, tier} : null;
}

// Mission Control Target Bid -- STATIC base only (WAR x calibrated $/WAR rate).
// This is deliberately just the foundation: base = projected WAR x the
// blended (Zimmer history + ESPN) rate for this player's WAR band/position,
// from bid_calibration.json. Live adjustments (scarcity, roster fit, budget
// clamp, opponent pressure) are a separate future layer -- NOT included yet.
// K/DEF are excluded from calibration entirely (always min-bid), so this
// returns null for those positions by design, not by data gap.
function bandForWar(war){
  if(!BIDCAL) return null;
  for(const b of BIDCAL.war_bands){
    if(war>=b.min_war && war<b.max_war) return b.label;
  }
  return null;
}
function blendedRateFor(position, band){
  if(!BIDCAL || !band) return null;
  const rows = BIDCAL.dollar_per_war[position] || BIDCAL.dollar_per_war['GLOBAL'];
  if(!rows) return null;
  let row = rows.find(r=>r.band===band);
  if((!row || row.blended_rate==null) && position!=='GLOBAL'){
    const globalRows = BIDCAL.dollar_per_war['GLOBAL'];
    row = globalRows && globalRows.find(r=>r.band===band);
  }
  return row ? row.blended_rate : null;
}
function computeMissionControlBid(player){
  if(!BIDCAL) return null;
  if(!(BIDCAL.positions_included||[]).includes(player.pos)) return null; // K/DEF excluded by design
  const war = player.projectedWar;
  if(war==null) return null;
  const band = bandForWar(war);
  const rate = blendedRateFor(player.pos, band);
  if(rate==null) return null;
  const bid = war>0 ? Math.max(1, Math.round(war*rate)) : 1; // floor at $1, matches real auction minimums
  return {bid, band, rate};
}

// Adjusted WAR (v1 roster-fit discount): raw projected WAR discounted by how
// much of MY starting need at that position is already filled. Your 1st RB is
// worth full WAR; each additional one toward/past your starting slots is worth
// progressively less to YOU, even if raw WAR is identical. This is the first
// piece of the "live adjustments" layer -- roster-aware, recalculated from your
// own drafted picks. (Scarcity/opponent adjustments remain future work.)
// Only meaningful for the league you're actively drafting; for the standalone
// Players tab across leagues it uses the active league's roster context.
// BUGS FIXED (three, all of which pinned the factor at 1.00 for Kepners/Miami,
// so Adj WAR always displayed identical to Raw WAR no matter what I drafted):
//   1. It counted `zimmerDraft.picks` -- the AUCTION log. Snake leagues log to
//      `snakeDraft.picks`, so my picks were invisible here. It also read
//      `p.position`, which snake picks don't have (they use `p.pos`).
//   2. It measured capacity against `ASSUMED_ROSTER` -- Zimmer's hardcoded
//      placeholder roster -- instead of the active league's real `rosterSlots`.
//   3. It ignored keepers entirely, so a kept RB didn't count against RB need.
const ADJ_WAR_POSITIONS = ['QB','RB','WR','TE'];
function rosterFillFactor(pos, counts, roster){
  const myCount = counts[pos] || 0;
  // starting capacity for this position incl. flex share for RB/WR/TE
  const starters = roster.filter(s=>s===pos).length;
  const flex = FLEX_ELIGIBLE.includes(pos) ? roster.filter(s=>s==='FLEX').length : 0;
  const capacity = Math.max(1, starters + flex);
  // full value until starters filled, then decay toward a depth floor (0.35)
  if(myCount < capacity) return 1 - 0.15*myCount/capacity;  // mild taper within capacity
  const over = myCount - capacity + 1;
  return Math.max(0.35, 0.85 * Math.pow(0.6, over));         // steeper decay past capacity
}
// Computed ONCE per board render, not per player: rosterFillFactor has to walk
// my keepers through findBigBoardPlayer (a linear name scan), and doing that
// inside a ~300-row map was 300x more work than needed for an answer that's
// identical for every player at a given position.
function rosterFillFactors(){
  const lg = DATA.leagues[activeLeague];
  const roster = (lg && lg.rosterSlots && lg.rosterSlots.length) ? lg.rosterSlots : ASSUMED_ROSTER;
  const {counts} = myPositionCounts(lg);
  const out = {};
  ADJ_WAR_POSITIONS.forEach(pos=>{ out[pos] = rosterFillFactor(pos, counts, roster); });
  return out;
}
// League-specific WAR. `projectedWar` is only the 12-team baseline; a shallower
// league leaves better players on waivers, so the same player is worth less
// above replacement there (Ja'Marr Chase: +95.9 Kepners vs +74.9 Miami).
function warOf(p){
  const w = p && p.warByLeague ? p.warByLeague[activeLeague] : null;
  return w!=null ? w : (p ? p.projectedWar : null);
}
// Market drift / TruRank for the active league. Like warOf, this is
// league-specific -- the price half is identical everywhere (consensus ADP is
// league-agnostic) but the talent half is ranked against each league's own
// replacement level, so a slot can read differently in Kepners than Miami.
// Returns null when the 2025 Big Board tab wasn't available at build time.
function driftOf(p){
  const d = p && p.marketDrift ? p.marketDrift[activeLeague] : null;
  return (d && d.tru != null) ? d : null;
}
// Guarded against a null DATA: ptColumns() can be reached before/if the
// bigboard fetch resolves, and an uncaught throw there takes the whole page
// down rather than degrading to an empty board.
function hasDriftData(){
  return !!((DATA && DATA.players) || []).some(p=>driftOf(p));
}
function mktCell(r){
  const d = driftOf(r);
  if(!d) return `<span class="pt-mkt mkt-none">—</span>`;
  const sign = d.tru>0?'+':'';
  const teams = ((DATA.leagues[activeLeague]||{}).teams||[]).length || 12;
  const rounds = (Math.abs(d.tru)/teams).toFixed(1);
  const parts = [
    `${d.slot}: ${sign}${d.tru} picks vs the same slot last year (${rounds} rd)`,
    `price ${d.price>0?'+':''}${d.price}` + (d.talent!=null?` · talent ${d.talent>0?'+':''}${d.talent}`:' · talent n/a'),
    d.sample==='price-only'?'no 2025 production match — price only':'',
  ].filter(Boolean).join('\n');
  return `<span class="pt-mkt mkt-${d.band}" title="${parts.replace(/"/g,'&quot;')}">${sign}${Math.round(d.tru)}</span>`;
}
function computeAdjustedWar(player, factors){
  const war = warOf(player);
  if(war==null) return null;
  const f = factors || rosterFillFactors();
  // roster fit only applies to positions we track a roster for; K/DEF etc pass through
  const factor = ADJ_WAR_POSITIONS.includes(player.pos) ? (f[player.pos] ?? 1) : 1;
  return Math.round(war * factor * 10) / 10;
}

// ---- shared player-table engine (standalone tab + in-cockpit toggle) ----
// Rank -> "round.pick" label for snake leagues (e.g. overall #14 in a 12-team
// league = round 2, pick 2 = "2.02"). Used for Yahoo Rank / Target Rank columns.
function rankToRoundPick(rank, teams){
  if(rank==null || !teams) return null;
  const r = Math.floor((rank-1)/teams)+1;
  const p = ((rank-1)%teams)+1;
  return `${r}.${String(p).padStart(2,'0')}`;
}

// Column definitions per league flavor. Auction (Zimmer) shows dollar columns;
// snake (Kepners/Miami) shows rank/round columns instead, per Sean's spec.
// Each column: key (for sort), label, num (right-align/numeric sort), and
// render(r, ctx) producing the cell's inner HTML.
const PT_COL_COMMON_LEFT = [
  {key:'name', label:'Player', num:false, render:r=>{
    const rookieBadge = isRookie(r)?`<span class="rookie-badge" title="${(r.notes||'').replace(/"/g,'&quot;')}">R</span>`:'';
    if(r._drafted && r._suggested){
      return `<span class="name-suggested-keeper" title="Predicted keeper -- not yet confirmed in the Google Sheet">${r.name}</span>${rookieBadge}`;
    }
    return `${r.name}${rookieBadge}`;
  }},
  {key:'team', label:'Team', num:false, render:r=>r.proTeamEspn||r.team||'—'},
  // Sean's own positional rank rides along INSIDE the Pos cell rather than
  // taking a column of its own. The snake/Zimmer boards are the binding
  // constraint: they're the middle panel of a 3-panel cockpit (~39% of a
  // 1400px cap ≈ 550px) already carrying 10 columns at 10px, so an 11th
  // would force horizontal scrolling in exactly the view that's used most
  // during a live draft. The sub-line costs zero width and no extra row
  // height -- the Yahoo Rk / Target Rk cells in the same row already render
  // a `.pt-sub` line, so the rows are that tall regardless.
  // Sort key is `seanPosRank`, not `pos`: alphabetical position sorting is
  // already covered better by the All Pos filter dropdown, so the click is
  // worth more spent on Sean's ranking. Ranks are per-position, so sorting
  // globally interleaves positions (every #1, then every #2) -- pair it with
  // the position filter to read one board at a time.
  {key:'seanPosRank', label:'Pos · Rk', num:true, render:r=>
    `<span class="pos-chip" style="${posTierStyle(r)}" title="${r.tier&&!isBlankVal(r.tier)?r.tier:'no tier assigned'}">${r.pos}</span><span class="pt-sub" title="Sean's ${r.pos} rank">${r.seanPosRank!=null?'#'+r.seanPosRank:'—'}</span>`},
  {key:'byeWeek', label:'Bye', num:true, render:r=>r.byeWeek||'—'},
  // Shows the sub-tier too ("WR2.2"), since the board draws ~3 distinct tiers
  // inside a single group and collapsing to "WR2" hides that.
  {key:'tier', label:'Tier', num:false, render:r=>{
    const t = parseTier(r.tier);
    if(!t) return '—';
    return `<span title="${r.tier}">${t.pos}${t.group}${t.sub>1?'.'+t.sub:''}</span>`;
  }},
];
const PT_COL_WAR = [
  {key:'projectedWar', label:'Raw WAR', num:true, render:r=>warCell(r.projectedWar)},
  {key:'adjWar', label:'Adj WAR', num:true, render:r=>warCell(r.adjWar)},
];
const PT_COL_STATUS = [
  {key:'status', label:'Status', num:false, render:r=>statusCell(r)},
];
// TruRank sits immediately right of the consensus-rank column it modifies:
// "this is the market price, and this is how that price compares to what the
// same positional slot cost last year." Sorts on the drift value, so "show me
// every bargain still on the board" is one click.
const PT_COL_MKT = [
  {key:'mktDrift', label:'MKT', num:true, render:r=>mktCell(r)},
];
const PT_COLUMNS_AUCTION = [
  ...PT_COL_COMMON_LEFT,
  {key:'avgRank', label:'Plat Rk', num:true, render:r=>r.avgRank??'—'},
  ...PT_COL_MKT,
  {key:'espnRecommendedBid', label:'ESPN $', num:true, render:r=>r.espnRecommendedBid!=null?'$'+Math.round(r.espnRecommendedBid):'—'},
  {key:'missionBid', label:'Target $', num:true, render:r=>r.missionBid!=null?'$'+r.missionBid:'—'},
  ...PT_COL_WAR, ...PT_COL_STATUS,
];
const PT_COLUMNS_SNAKE = [
  ...PT_COL_COMMON_LEFT,
  {key:'avgRank', label:'Yahoo Rk', num:true, render:(r,ctx)=>r.avgRank!=null?`${r.avgRank}<span class="pt-sub">${rankToRoundPick(r.avgRank,ctx.teams)}</span>`:'—'},
  ...PT_COL_MKT,
  {key:'seanRankOverall', label:'Target Rk', num:true, render:(r,ctx)=>r.seanRankOverall!=null?`${r.seanRankOverall}<span class="pt-sub">${rankToRoundPick(r.seanRankOverall,ctx.teams)}</span>`:'—'},
  ...PT_COL_WAR, ...PT_COL_STATUS,
];

function isRookie(p){
  if(!p.notes || !/rookie/i.test(p.notes)) return false;
  // A 4-digit year immediately before "Rookie" means THAT draft class (e.g.
  // "2025 Rookie R1.6" = drafted 2025, NOT a 2026 rookie anymore). No year
  // prefix means 2026 by convention (the year gets added retroactively once
  // a player ages out of rookie status).
  const yearMatch = p.notes.match(/(\d{4})\s*rookie/i);
  return yearMatch ? yearMatch[1] === '2026' : true;
}
function warCell(v){
  if(v==null) return '—';
  const cls = v>0?'pt-war-pos':'pt-war-neg';
  return `<span class="${cls}">${v>0?'+':''}${v}</span>`;
}
function statusCell(r){
  if(r._drafted && r._suggested){
    return `<span class="pt-suggested">${r._mine?'★ likely mine':'likely kept'}${r._keeperRound?' (R'+r._keeperRound+')':''}</span>`;
  }
  return r._drafted
    ? `<span class="pt-taken">${r._mine?'★ mine':'taken'}${r._cost?' $'+r._cost:''}${r._pickLabel?' @'+r._pickLabel:''}${r._keeperRound?' (R'+r._keeperRound+')':''}</span>`
    : `<span class="pt-avail">available</span>`;
}
function ptColumns(){
  const cols = isAuctionLeague() ? PT_COLUMNS_AUCTION : PT_COLUMNS_SNAKE;
  // No 2025 Big Board tab at build time means no drift for anyone. Drop the
  // column rather than showing a dead strip of em-dashes -- the snake board is
  // the middle panel of a 3-panel cockpit and every column costs real width.
  return hasDriftData() ? cols : cols.filter(c=>c.key!=='mktDrift');
}

function ptDraftedMap(){
  // which Big Board players are drafted, from the current league's logged picks.
  const map = {};
  if(isAuctionLeague()){
    zimmerDraft.picks.forEach(pick=>{
      const bp = findBigBoardPlayer(pick.name);
      if(bp) map[bp.id] = {cost:pick.cost, isMine:!!pick.isMine, suggested:false};
    });
  } else {
    // Snake leagues have no live pick log, but keepers ARE known ahead of the draft -- both confirmed (Google Sheet, real) and
    // suggested (predicted from last year's roster, see KEPS). Mark both as
    // unavailable so the board reflects reality: these players are already
    // spoken for before the draft even starts. Real always wins over
    // suggested for the same player, same priority as the Prep tab.
    const lg = DATA.leagues[activeLeague];
    if(lg && lg.teams){
      lg.teams.forEach(t=>{
        (t.liveKeepers||[]).forEach(k=>{
          const bp = findBigBoardPlayer(k.player);
          if(bp) map[bp.id] = {cost:null, isMine:!!t.isMe, suggested:false, round:k.round};
        });
      });
      // BUG FIXED: this only ran for `activeLeague==='kepners'`, so Miami's
      // predicted AND confirmed keepers (miami_suggested_keepers.json) never
      // greyed out on the board at all -- Rashee Rice, Brock Bowers, etc.
      // still showed "available" even though they're locked keepers. Every
      // league with a suggestions file works the same way here; a `confirmed`
      // entry (a manager's real pick, reported directly since Miami has no
      // live sheet sync) renders solid like a real keeper, an unconfirmed
      // prediction renders amber, same distinction the Prep tab already draws.
      const SUG = KEEPER_SUGGESTIONS[activeLeague];
      if(SUG && SUG.by_manager){
        lg.teams.forEach(t=>{
          (SUG.by_manager[t.manager]||[]).forEach(k=>{
            const bp = findBigBoardPlayer(k.player);
            // Only mark as suggested if not ALREADY real for this exact player
            // (a different manager's real keeper on the same player id would
            // be a data anomaly, not something to paper over -- but our own
            // suggestion should never override our own real entry).
            if(bp && !map[bp.id]) map[bp.id] = {cost:null, isMine:!!t.isMe, suggested:!k.confirmed, round:k.round};
          });
        });
      }
    }
    // Live-logged picks applied LAST so they win over keeper/suggested
    // entries -- a pick actually seen in the draft room is the most current
    // fact available, and should never be overridden by a prediction.
    snakeDraft.picks.forEach(pick=>{
      if(!pick.playerId) return;  // unmatched name; already flagged in the log
      map[pick.playerId] = {cost:null, isMine:!!pick.isMine, suggested:false, pickLabel:pick.label};
    });
  }
  return map;
}

// Positions a league can actually roster, derived from its rosterSlots. Used
// to keep undraftable positions off the board -- e.g. Zimmer dropped its
// kicker for 2026 and Miami never had one, so kickers are pure noise there.
// Returns null (meaning "don't filter") if a league has no roster config yet,
// so a missing Team sheet can never blank out the whole board.
const FLEX_ELIGIBLE = ['RB','WR','TE'];

// ---------- Position colours + tier-depth shading ----------
// Base hue per position (Sean's picks). DEF/K are deliberately near-zero
// saturation so they read as neutral/black rather than competing with the
// skill positions for attention.
const POS_COLOR = {
  QB:  {h:212, s:72},   // blue
  WR:  {h:45,  s:88},   // yellow
  RB:  {h:140, s:52},   // green
  TE:  {h:24,  s:85},   // orange
  DEF: {h:220, s:6},    // near-black
  K:   {h:220, s:6},
};

// Tier strings look like "WR2 - 2 - Lower Floor": position group, then a
// SUB-tier inside that group, then a label. The sub-tier matters -- the board
// has ~3 distinct tiers inside WR2 alone -- so shading on the group alone
// would flatten real distinctions Sean drew by hand.
// Returns {group, sub, label} or null for "#N/A"/blank/unparseable.
function parseTier(tier){
  if(!tier || tier==='0' || isBlankVal(tier)) return null;
  const s = String(tier).trim();
  // "WR2 - 2 - Lower Floor"  |  "TE2"  (no sub-tier)
  const m = s.match(/^([A-Za-z]+)(\d+)\s*(?:-\s*(\d+))?\s*(?:-\s*(.*))?$/);
  if(!m) return null;
  return {
    pos: m[1].toUpperCase(),
    group: parseInt(m[2], 10),
    sub: m[3] ? parseInt(m[3], 10) : 1,
    label: (m[4]||'').trim(),
  };
}

// Ordered list of distinct tiers per position, best-first, so shade depth can
// be assigned by RANK rather than by raw group number. Ranking by index keeps
// the ramp evenly spread no matter how many tiers a position actually has
// (QB has 6, WR has 12) -- using group number directly would make WR's ramp
// wash out while QB's barely moved.
let _tierOrderCache = null;
function tierOrderIndex(p){
  if(!_tierOrderCache){
    const byPos = {};
    DATA.players.forEach(pl=>{
      const t = parseTier(pl.tier);
      if(!t) return;
      (byPos[pl.pos] = byPos[pl.pos] || new Set()).add(`${t.group}.${String(t.sub).padStart(2,'0')}`);
    });
    _tierOrderCache = {};
    Object.entries(byPos).forEach(([pos, set])=>{
      const sorted = [...set].sort((a,b)=>parseFloat(a)-parseFloat(b));
      _tierOrderCache[pos] = sorted;
    });
  }
  const t = parseTier(p.tier);
  if(!t) return null;
  const list = _tierOrderCache[p.pos];
  if(!list) return null;
  const key = `${t.group}.${String(t.sub).padStart(2,'0')}`;
  const idx = list.indexOf(key);
  return idx < 0 ? null : {idx, total: list.length, tier: t};
}

// Background/foreground for a position cell: position hue, lightness ramped
// by tier depth (darkest = best tier).
function posTierStyle(p){
  const c = POS_COLOR[p.pos];
  if(!c) return '';
  const oi = tierOrderIndex(p);
  // Unranked/#N/A tiers get the lightest, most washed-out treatment rather
  // than a mid-tone that could be mistaken for a real tier.
  const frac = oi ? (oi.total > 1 ? oi.idx/(oi.total-1) : 0) : 1;
  const light = 26 + frac*46;                 // 26% (best) -> 72% (worst)
  const sat = oi ? c.s : Math.max(4, c.s*0.25);
  const fg = light > 52 ? '#0a0e14' : '#e8eef2';
  return `background:hsl(${c.h} ${sat}% ${light}%);color:${fg};`;
}
function leagueRosterablePositions(lg){
  const slots = (lg && lg.rosterSlots) || [];
  if(!slots.length) return null;
  const set = new Set();
  slots.forEach(s=>{
    if(s==='BEN' || s==='IR') return;
    if(s==='FLEX'){ FLEX_ELIGIBLE.forEach(p=>set.add(p)); return; }
    set.add(s);
  });
  return set;
}

function ptRows(){
  const drafted = ptDraftedMap();
  const fillFactors = rosterFillFactors();   // once per render, not per row
  let rows = DATA.players.filter(p=>p.pos && p.pos!=='NA').map(p=>{
    const mc = computeMissionControlBid(p);
    const d = drafted[p.id];
    return {
      ...p,
      projectedWar: warOf(p),
      // flattened so the MKT column can sort on it like any other numeric key
      mktDrift: (driftOf(p) || {}).tru ?? null,
      missionBid: mc ? mc.bid : null,
      adjWar: computeAdjustedWar(p, fillFactors),
      _drafted: !!d, _mine: d ? d.isMine : false, _cost: d ? d.cost : null,
      _suggested: d ? !!d.suggested : false, _keeperRound: d ? d.round : null,
      _pickLabel: d ? d.pickLabel : null,
      status: d ? (d.isMine?'mine':'taken') : 'avail',
    };
  });

  // filters
  // Drop positions this league can't roster (e.g. kickers in Zimmer/Miami,
  // which have no K slot) -- they're undraftable there, so they'd be noise.
  const rosterable = leagueRosterablePositions(DATA.leagues[activeLeague]);
  if(rosterable) rows = rows.filter(r=>rosterable.has(r.pos));
  const q = playerTable.query.trim().toLowerCase();
  if(q) rows = rows.filter(r=>r.name.toLowerCase().includes(q));
  if(playerTable.posFilter!=='ALL') rows = rows.filter(r=>r.pos===playerTable.posFilter);
  if(playerTable.availFilter==='AVAIL') rows = rows.filter(r=>!r._drafted);
  if(playerTable.availFilter==='TAKEN') rows = rows.filter(r=>r._drafted);

  // sort
  const k = playerTable.sortKey, dir = playerTable.sortDir==='asc'?1:-1;
  // BUG FIXED: "blank" only caught null/'' -- but some numeric fields (Yahoo
  // Rk in particular) hold the literal string "#N/A", an Excel formula-error
  // value that leaked through convert_bigboard.py unconverted to a real
  // null. That string is neither null nor '', so it fell through to a STRING
  // comparison against the numeric ranks, and "#" sorts before any digit --
  // so #N/A rows bubbled to the TOP on ascending sort instead of the bottom,
  // regardless of direction, exactly the opposite of every other blank value.
  // Uses the shared isBlankVal() helper -- same rule the recommendation
  // engine applies, so a value can't count as "blank" in one place and a real
  // number in another.
  rows.sort((a,b)=>{
    let av=a[k], bv=b[k];
    // blanks always sort last regardless of direction
    const an=isBlankVal(av), bn=isBlankVal(bv);
    if(an&&bn) return 0;
    if(an) return 1;
    if(bn) return -1;
    if(typeof av==='number' && typeof bv==='number') return (av-bv)*dir;
    return String(av).localeCompare(String(bv))*dir;
  });
  return rows;
}

function renderPlayerTable(container, opts){
  opts = opts || {};
  const cols = ptColumns();
  const teams = (DATA.leagues[activeLeague] && DATA.leagues[activeLeague].teams) ? DATA.leagues[activeLeague].teams.length : 12;
  const ctx = {teams};
  const groupByTier = !!opts.groupByTier;
  const selectable = !!opts.selectable;

  let rows = ptRows();

  // Offer only positions this league actually rosters, so the dropdown can't
  // select a filter that returns zero rows (e.g. K in Zimmer/Miami).
  // (Computed here as well as in ptRows -- separate scopes.)
  const rosterable = leagueRosterablePositions(DATA.leagues[activeLeague]);
  const ALL_POSITIONS = ['QB','RB','WR','TE','K','DEF'];
  const positions = ['ALL', ...ALL_POSITIONS.filter(p=>!rosterable || rosterable.has(p))];
  // If the active filter isn't valid for this league (switched leagues while
  // filtered), fall back to ALL rather than silently showing an empty board.
  if(!positions.includes(playerTable.posFilter)) playerTable.posFilter = 'ALL';
  const controls = `
    <div class="pt-controls">
      <input type="text" class="pt-search" placeholder="Search player..." value="${playerTable.query}">
      <select class="pt-pos">
        ${positions.map(p=>`<option value="${p}" ${playerTable.posFilter===p?'selected':''}>${p==='ALL'?'All Pos':p}</option>`).join('')}
      </select>
      <select class="pt-avail">
        <option value="ALL" ${playerTable.availFilter==='ALL'?'selected':''}>All</option>
        <option value="AVAIL" ${playerTable.availFilter==='AVAIL'?'selected':''}>Available</option>
        <option value="TAKEN" ${playerTable.availFilter==='TAKEN'?'selected':''}>Drafted</option>
      </select>
      <button class="clear">CLEAR</button>
    </div>
    <div class="pt-count">${rows.length} players${!isAuctionLeague()?' · keepers shown as unavailable; log picks below to keep the board live':''}
      <span class="pt-warsrc">· WAR calculated based on 2026 ESPN Projections</span></div>`;

  const header = cols.map(c=>{
    const arrow = playerTable.sortKey===c.key ? `<span class="arrow">${playerTable.sortDir==='asc'?'▲':'▼'}</span>` : '';
    return `<th data-key="${c.key}" class="${c.num?'pt-num':''}">${c.label} ${arrow}</th>`;
  }).join('');

  const rowHtml = (r)=>{
    const sel = selectable && r.id===zimmerDraft.selectedPlayerId ? 'selected' : '';
    const cells = cols.map(c=>`<td class="${c.num?'pt-num':''} ${c.key==='name'?'pt-name':''}">${c.render(r,ctx)}</td>`).join('');
    return `<tr data-pid="${r.id}" class="${r._drafted?'drafted':''} ${r._mine?'mine':''} ${sel} ${selectable?'pt-selectable':''}">${cells}</tr>`;
  };

  let body;
  if(groupByTier){
    // group rows by their position tier (the label prefix, e.g. "RB1"),
    // preserving the current sort order within each group. Tier order follows
    // first appearance in the sorted rows so it respects the active sort.
    const groups = new Map();
    rows.forEach(r=>{
      const t = (r.tier && r.tier!=='0') ? r.tier.split(' - ')[0] : 'Unranked';
      if(!groups.has(t)) groups.set(t, []);
      groups.get(t).push(r);
    });
    body = [...groups.entries()].map(([tier, grp])=>{
      const tierRow = `<tr class="pt-tier-head"><td colspan="${cols.length}">${tier} <span class="pt-tier-n">${grp.length}</span></td></tr>`;
      return tierRow + grp.map(rowHtml).join('');
    }).join('');
  } else {
    body = rows.map(rowHtml).join('');
  }

  // Preserve search-input focus/cursor across the innerHTML replace below --
  // without this, retyping into the box loses focus every keystroke (the
  // input DOM node gets destroyed and recreated), so only one character
  // registers before you have to click back in.
  const prevSearch = container.querySelector('.pt-search');
  const searchHadFocus = prevSearch && document.activeElement === prevSearch;
  const prevSelStart = searchHadFocus ? prevSearch.selectionStart : null;
  const prevSelEnd = searchHadFocus ? prevSearch.selectionEnd : null;

  container.innerHTML = `${controls}
    <div class="ptable-wrap">
      <table class="ptable"><thead><tr>${header}</tr></thead><tbody>${body}</tbody></table>
    </div>`;

  // wire controls
  const search = container.querySelector('.pt-search');
  let searchDebounce = null;
  search.oninput = (e)=>{
    playerTable.query = e.target.value;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(()=> opts.rerender(), 120);
  };
  if(searchHadFocus){
    search.focus();
    search.setSelectionRange(prevSelStart, prevSelEnd);
  }
  container.querySelector('.pt-pos').onchange = (e)=>{ playerTable.posFilter=e.target.value; opts.rerender(); };
  container.querySelector('.pt-avail').onchange = (e)=>{ playerTable.availFilter=e.target.value; opts.rerender(); };
  container.querySelector('.clear').onclick = ()=>{
    playerTable.query=''; playerTable.posFilter='ALL'; playerTable.availFilter='ALL'; opts.rerender();
  };
  container.querySelectorAll('th[data-key]').forEach(th=>{
    th.onclick = ()=>{
      const key=th.dataset.key;
      if(playerTable.sortKey===key){ playerTable.sortDir = playerTable.sortDir==='asc'?'desc':'asc'; }
      else { playerTable.sortKey=key; playerTable.sortDir = ['name','team','pos','tier','status'].includes(key)?'asc':'desc'; }
      opts.rerender();
    };
  });
  if(selectable){
    container.querySelectorAll('tr[data-pid]').forEach(tr=>{
      tr.onclick = ()=>{
        zimmerDraft.selectedPlayerId = tr.dataset.pid;
        if(opts.onSelect) opts.onSelect(tr.dataset.pid);
      };
    });
  }
}

// ---- Market drift / TruRank visualisation ---------------------------------
// Two panels, because TruRank is a composite and a single line hides that:
//   1. CURVE  - drift by positional slot. On "ALL" it plots TruRank per
//      position; pick a single position and it decomposes into the price move,
//      the WAR correction, and the resulting TruRank, with the gap between the
//      price line and the TruRank line shaded -- that shaded gap IS the WAR
//      half doing its work, which is otherwise invisible.
//   2. VALUE MAP - every slot plotted as price drift (x) against talent drift
//      (y). The diagonal is TruRank = 0. Anything up-and-right of it is a real
//      edge; the lower-right quadrant is the trap the metric exists to catch --
//      slots that look cheap only because the tier got worse.
const DRIFT_CURVE_COLORS = {QB:'#ffb703', RB:'#00d9ff', WR:'#3ddc84', TE:'#c88cff'};
let driftPos = 'ALL';

function driftMeta(){
  const m = (DATA && DATA.meta && DATA.meta.marketDriftBands) ? DATA.meta.marketDriftBands[activeLeague] : null;
  return m || null;
}
function driftSeries(){
  const out = {};
  ((DATA && DATA.players) || []).forEach(p=>{
    const d = driftOf(p);
    if(!d || !d.slot || !DRIFT_CURVE_COLORS[p.pos]) return;
    const n = parseInt(String(d.slot).replace(/^[A-Z]+/,''),10);
    if(!isFinite(n)) return;
    (out[p.pos] = out[p.pos] || []).push({n, name:p.name, tru:d.tru, price:d.price, talent:d.talent, band:d.band});
  });
  Object.values(out).forEach(l=>l.sort((a,b)=>a.n-b.n));
  return out;
}

function driftCurveSvg(series){
  const W=680, H=240, PADL=40, PADR=12, PADT=12, PADB=28;
  const shown = driftPos==='ALL' ? series : (series[driftPos] ? {[driftPos]:series[driftPos]} : {});
  const pts = Object.values(shown).flat();
  if(!pts.length) return '<div class="empty-note">No drift data for this position.</div>';
  const maxN = Math.max(...pts.map(p=>p.n));
  const vals = driftPos==='ALL' ? pts.map(p=>p.tru)
    : pts.flatMap(p=>[p.tru, p.price, p.talent].filter(v=>v!=null));
  const absMax = Math.max(6, ...vals.map(Math.abs));
  const x = n => PADL + (n-1)/Math.max(1,maxN-1) * (W-PADL-PADR);
  const y = v => PADT + (absMax - v)/(2*absMax) * (H-PADT-PADB);
  const path = (list, key) => list.filter(p=>p[key]!=null)
    .map((p,i)=>`${i?'L':'M'}${x(p.n).toFixed(1)},${y(p[key]).toFixed(1)}`).join(' ');

  const grid = [absMax, absMax/2, 0, -absMax/2, -absMax].map(v=>`
    <line x1="${PADL}" y1="${y(v).toFixed(1)}" x2="${W-PADR}" y2="${y(v).toFixed(1)}"
      stroke="${v===0?'#2a3542':'#1a222c'}" stroke-width="${v===0?1.2:1}"/>
    <text x="${PADL-5}" y="${(y(v)+3).toFixed(1)}" fill="#7d8b99" font-size="8.5" text-anchor="end">${v>0?'+':''}${Math.round(v)}</text>`).join('');
  const xlab = [1, Math.round(maxN/4), Math.round(maxN/2), Math.round(3*maxN/4), maxN]
    .filter((v,i,a)=>a.indexOf(v)===i && v>=1)
    .map(n=>`<text x="${x(n).toFixed(1)}" y="${H-10}" fill="#7d8b99" font-size="8.5" text-anchor="middle">${n}</text>`).join('');

  let body;
  if(driftPos==='ALL'){
    body = Object.entries(shown).map(([pos,l])=>
      `<path d="${path(l,'tru')}" fill="none" stroke="${DRIFT_CURVE_COLORS[pos]}" stroke-width="1.6" opacity=".9"/>`).join('');
  } else {
    const l = shown[driftPos], col = DRIFT_CURVE_COLORS[driftPos];
    // shaded gap between the raw price move and the WAR-corrected TruRank
    const usable = l.filter(p=>p.tru!=null && p.price!=null);
    const area = usable.length ? `<path d="${
      usable.map((p,i)=>`${i?'L':'M'}${x(p.n).toFixed(1)},${y(p.price).toFixed(1)}`).join(' ')} ${
      usable.slice().reverse().map(p=>`L${x(p.n).toFixed(1)},${y(p.tru).toFixed(1)}`).join(' ')}Z"
      fill="${col}" opacity=".13"/>` : '';
    body = area
      + `<path d="${path(l,'price')}" fill="none" stroke="#7d8b99" stroke-width="1.3" stroke-dasharray="5,3"/>`
      + `<path d="${path(l,'talent')}" fill="none" stroke="#c88cff" stroke-width="1.1" stroke-dasharray="1.5,2.5" opacity=".8"/>`
      + `<path d="${path(l,'tru')}" fill="none" stroke="${col}" stroke-width="2"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet"
      role="img" aria-label="Market drift by positional slot">${grid}${xlab}${body}
    <text x="${PADL}" y="${H-1}" fill="#7d8b99" font-size="8.5">positional slot (${driftPos==='ALL'?'WR1, WR2, …':driftPos+'1, '+driftPos+'2, …'})</text></svg>`;
}

function driftValueMapSvg(series){
  const W=680, H=300, PADL=44, PADR=14, PADT=14, PADB=32;
  const pts = Object.entries(series).flatMap(([pos,l])=>l.filter(p=>p.talent!=null).map(p=>({...p,pos})));
  if(pts.length < 8) return '<div class="empty-note">Not enough matched slots to map.</div>';
  const w = ((DATA && DATA.meta && DATA.meta.marketDriftConfig)||{}).talentWeight ?? 0.5;
  const xMax = Math.max(6, ...pts.map(p=>Math.abs(p.price)));
  const yMax = Math.max(6, ...pts.map(p=>Math.abs(p.talent)));
  const X = v => PADL + (v + xMax)/(2*xMax) * (W-PADL-PADR);
  const Y = v => PADT + (yMax - v)/(2*yMax) * (H-PADT-PADB);

  // TruRank = price + w*talent, so TruRank = 0 is the line talent = -price/w
  const yAt = px => -px / w;
  const clamp = v => Math.max(-yMax, Math.min(yMax, v));
  const zero = `<line x1="${X(-xMax)}" y1="${Y(clamp(yAt(-xMax)))}" x2="${X(xMax)}" y2="${Y(clamp(yAt(xMax)))}"
    stroke="var(--amber)" stroke-width="1.2" stroke-dasharray="6,4" opacity=".75"/>`;

  const axes = `
    <line x1="${X(0)}" y1="${PADT}" x2="${X(0)}" y2="${H-PADB}" stroke="#2a3542" stroke-width="1"/>
    <line x1="${PADL}" y1="${Y(0)}" x2="${W-PADR}" y2="${Y(0)}" stroke="#2a3542" stroke-width="1"/>
    <text x="${PADL-6}" y="${Y(yMax)+8}" fill="#7d8b99" font-size="8.5" text-anchor="end">+${Math.round(yMax)}</text>
    <text x="${PADL-6}" y="${Y(-yMax)}" fill="#7d8b99" font-size="8.5" text-anchor="end">−${Math.round(yMax)}</text>
    <text x="${X(-xMax)+2}" y="${H-PADB+12}" fill="#7d8b99" font-size="8.5">−${Math.round(xMax)}</text>
    <text x="${X(xMax)-2}" y="${H-PADB+12}" fill="#7d8b99" font-size="8.5" text-anchor="end">+${Math.round(xMax)}</text>
    <text x="${(W-PADL-PADR)/2+PADL}" y="${H-4}" fill="#7d8b99" font-size="9" text-anchor="middle">← pricier than last year · PRICE DRIFT (picks) · cheaper than last year →</text>`;

  const quad = [
    [X(xMax)-6, PADT+12, 'end', 'var(--green)', 'cheaper + stronger tier — real edge'],
    [X(xMax)-6, H-PADB-6, 'end', 'var(--red)', 'cheaper but weaker tier — value trap'],
    [PADL+6, PADT+12, 'start', '#7d8b99', 'pricier but stronger — premium earned'],
    [PADL+6, H-PADB-6, 'start', 'var(--red)', 'pricier + weaker — avoid'],
  ].map(([px,py,anc,col,t])=>`<text x="${px}" y="${py}" fill="${col}" font-size="8.5" text-anchor="${anc}" opacity=".85">${t}</text>`).join('');

  const dots = pts.map(p=>{
    const fill = p.band==='strong-pos'?'#8bf0b5':p.band==='pos'?'#3ddc84'
      :p.band==='strong-neg'?'#ff9c9c':p.band==='neg'?'#ff4d4d':'#4a5866';
    const r = (p.band==='neutral'||p.band==='none')?2:3;
    return `<circle cx="${X(p.price).toFixed(1)}" cy="${Y(clamp(p.talent)).toFixed(1)}" r="${r}"
      fill="${fill}" opacity="${r===2?.5:.9}"><title>${p.name} (${p.slot||p.pos+p.n}) — price ${p.price>0?'+':''}${p.price}, talent ${p.talent>0?'+':''}${p.talent}, TruRank ${p.tru>0?'+':''}${p.tru}</title></circle>`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet"
      role="img" aria-label="Price drift versus talent drift">${axes}${quad}${zero}${dots}
    <text x="${X(0)+5}" y="${PADT+9}" fill="#7d8b99" font-size="8.5">talent drift ↑</text>
    <text x="${W-PADR-4}" y="${Y(clamp(yAt(xMax)))-4}" fill="var(--amber)" font-size="8.5" text-anchor="end" opacity=".9">TruRank = 0</text></svg>`;
}

function driftPanelHtml(){
  if(!hasDriftData()) return '';
  const series = driftSeries();
  const cfg = (DATA.meta && DATA.meta.marketDriftConfig) || {};
  const meta = driftMeta() || {};
  const w = cfg.talentWeight ?? 0.5;
  const tabs = ['ALL','QB','RB','WR','TE'].filter(p=>p==='ALL'||series[p])
    .map(p=>`<button class="drift-tab ${driftPos===p?'on':''}" data-pos="${p}">${p}</button>`).join('');
  const key = driftPos==='ALL'
    ? Object.keys(series).sort().map(pos=>`<span><i style="border-color:${DRIFT_CURVE_COLORS[pos]}"></i>${pos}</span>`).join('')
    : `<span><i style="border-color:#7d8b99;border-top-style:dashed"></i>price move</span>
       <span><i style="border-color:#c88cff;border-top-style:dotted"></i>talent (WAR rank)</span>
       <span><i style="border-color:${DRIFT_CURVE_COLORS[driftPos]};border-top-width:3px"></i>TruRank</span>`;

  const src = meta.adpSource2026
    ? `Measured against <b>${String(meta.adpSource2026).toUpperCase()}</b> ADP for 2026 vs <b>${String(meta.adpSource2025).toUpperCase()}</b> for 2025`
      + (meta.likeForLike ? ' (like-for-like).'
        : ` — these are different columns, so a constant ${meta.leanRemoved!=null?`${meta.leanRemoved>0?'+':''}${meta.leanRemoved}-pick `:''}lean has been removed. Positional shape is reliable; treat the absolute level as approximate.`)
    : '';

  return `<details class="drift-wrap" open><summary>◈ Market drift &amp; TruRank — what each positional slot costs vs last year</summary>
    <div class="drift-body">
      <div class="drift-tabs">${tabs}</div>
      <div class="drift-key">${key}</div>
      <div id="driftCurveMount">${driftCurveSvg(series)}</div>
      <div class="drift-note">
        Above the zero line = that slot is <b style="color:var(--green)">better value</b> than the same slot cost last year;
        below = <b style="color:var(--red)">more expensive</b> than it's worth. Units are draft picks.
        Slots are compared like-for-like (WR4 vs last year's WR4), so rookies and new names cost nothing.
        ${driftPos==='ALL'
          ? `Pick a position above to split TruRank into its two halves.`
          : `The dashed grey line is the raw price move. The shaded gap between it and the solid line is the
             <b>WAR correction</b> — where the shading pulls the solid line down, that slot got cheaper because
             the tier genuinely got worse, not because the market is wrong.`}
        Smoothed over ±${cfg.smoothWindow ?? 2} slots (talent ±${cfg.talentSmoothWindow ?? 4}); anything inside ±${cfg.neutralDeadband ?? 6} picks is treated as noise.
        ${src}
      </div>

      <div class="drift-sub">Value map — price drift vs talent drift</div>
      ${driftValueMapSvg(series)}
      <div class="drift-note">
        Each dot is one positional slot. <b>TruRank = price + ${w} × talent</b>, so the amber diagonal is the
        break-even line: everything above-right of it is a genuine edge, everything below-left is being
        overpaid for. The bottom-right quadrant is the one worth staring at — slots that look cheap on price
        alone but sit there because the tier lost talent. Talent carries ${w} weight because it compares 2026
        projections against 2025 actuals across a methodology gap: enough to veto a fake bargain, not enough
        to invent one. Hover any dot for the player and the split.
      </div>
    </div></details>`;
}

function computeTeamFit(player){
  const myPicks = zimmerDraft.picks.filter(p=>p.isMine);
  const spent = myPicks.reduce((s,p)=>s+p.cost,0);
  const remaining = ASSUMED_BUDGET - spent;
  const slotsLeft = ASSUMED_ROSTER.length - myPicks.length;
  const maxBid = Math.max(1, remaining - Math.max(0, slotsLeft - 1)); // $1 reserve per remaining slot after this one

  const posCount = {};
  myPicks.forEach(p=>{ posCount[p.position] = (posCount[p.position]||0) + 1; });
  const myCount = posCount[player.pos] || 0;
  const starterSlotsForPos = ASSUMED_ROSTER.filter(s=>s===player.pos).length;
  const flexEligible = (player.pos==='RB'||player.pos==='WR') ? ASSUMED_ROSTER.filter(s=>s==='FLEX').length : 0;
  const fillsStarterNeed = myCount < (starterSlotsForPos + flexEligible);

  let note = `You have $${remaining} left with ${slotsLeft} slot${slotsLeft===1?'':'s'} to fill `+
    `(max bid ~$${maxBid} after reserving $1/slot). `;
  note += fillsStarterNeed
    ? `This would be your ${myCount+1}${myCount===0?'st':myCount===1?'nd':myCount===2?'rd':'th'} ${player.pos} — fills a starting need.`
    : `You already have ${myCount} ${player.pos}s covering your starting slots — this would be pure depth.`;
  return {remaining, slotsLeft, maxBid, note};
}

      panel stay accurate. Pick the winning owner from the dropdown — choose "Me" for your own wins.
      Live ESPN polling will replace this when available; this stays as a backup.</div>
  `;

  renderRosterStrip();
  renderPlayerCard(selected, el);
  renderPositionBoard(selected, el);
  renderOpponentPanel(selected, el);
  renderLoggedPicks();

  // toggle: tiered Position Board <-> flat Player Search. Both are the SAME
  // unified table component now; the toggle only flips tier grouping, so
  // sort/filter/selection state carries across seamlessly.
  el.querySelectorAll('.pt-toggle button[data-col2]').forEach(btn=>{
    btn.onclick = ()=>{
      cockpitCol2Mode = btn.dataset.col2;
      el.querySelectorAll('.pt-toggle button[data-col2]').forEach(b=>b.classList.toggle('on',b===btn));
      renderPositionBoard(selected, el);
    };
  });

  wireCockpitResizer(el);

  const searchInput = document.getElementById('playerSearch');
  searchInput.oninput = (e)=>{
    zimmerDraft.searchQuery = e.target.value;
    renderSearchResults(e.target.value);
  };
  searchInput.onfocus = ()=>renderSearchResults(searchInput.value);

  document.getElementById('logAddBtn').onclick = ()=>{
    const name = document.getElementById('logName').value.trim();
    const pos = document.getElementById('logPos').value.trim().toUpperCase();
    const cost = parseInt(document.getElementById('logCost').value, 10);
    const ownerVal = document.getElementById('logOwner').value;
    if(!name || !cost) return;
    zimmerDraft.picks.push({
      name, position: pos||'—', cost,
      isMine: ownerVal==='__me__',
      owner: (ownerVal && ownerVal!=='__me__') ? ownerVal : null,
    });
    renderAuctionDraft();
  };
}

function renderRosterStrip(){
  const el = document.getElementById('rosterStrip');
  const myPicks = zimmerDraft.picks.filter(p=>p.isMine);
  // Walk the roster template, assigning each of my picks to slots greedily.
  const remainingPicks = [...myPicks];
  const cells = ASSUMED_ROSTER.map(slot=>{
    let fillIdx = -1;
    if(slot==='BEN'){
      fillIdx = remainingPicks.length ? 0 : -1;
    } else if(slot==='FLEX'){
      fillIdx = remainingPicks.findIndex(p=>['RB','WR','TE'].includes(p.position));
    } else {
      fillIdx = remainingPicks.findIndex(p=>p.position===slot);
    }
    let fill = null;
    if(fillIdx>=0){ fill = remainingPicks.splice(fillIdx,1)[0]; }
    return {slot, fill};
  });
  el.innerHTML = cells.map(c=>`
    <div class="roster-cell ${c.fill?'full':''}">
      <span class="rc-pos">${c.slot}</span>${c.fill?`<span class="rc-fill">${c.fill.name.split(' ').slice(-1)[0]} $${c.fill.cost}</span>`:'<span class="rc-fill" style="color:var(--line-2)">—</span>'}
    </div>`).join('');
}

function renderSearchResults(query){
  const box = document.getElementById('searchResults');
  if(!query || query.length<2){ box.style.display='none'; return; }
  const q = query.toLowerCase();
  const matches = DATA.players.filter(p=>p.name.toLowerCase().includes(q)).slice(0,8);
  if(!matches.length){ box.style.display='none'; return; }
  box.style.display='';
  box.innerHTML = matches.map(p=>
    `<div class="sr-item" data-id="${p.id}"><span>${p.name}</span><span class="sr-pos">${p.pos} · ${p.team||''}</span></div>`
  ).join('');
  box.querySelectorAll('.sr-item').forEach(el=>{
    el.onclick = ()=>{
      zimmerDraft.selectedPlayerId = el.dataset.id;
      zimmerDraft.searchQuery = '';
      box.style.display='none';
      renderAuctionDraft();
    };
  });
}

function renderPlayerCard(player, root){

  }
  const bidRange = expectedBidRange(player);
  const fit = computeTeamFit(player);
  const espnBid = player.espnRecommendedBid;
  const war = player.projectedWar;
  const mcBid = computeMissionControlBid(player);

  area.innerHTML = `
    <div class="card rec">
      <div class="top">
        <div class="name">${player.name.toUpperCase()}${isRookie(player)?`<span class="rookie-badge">R</span>`:''}</div>
        <div class="posbadge">${player.pos}</div>
      </div>
      <div class="meta">${player.team||''} · YOUR POS RANK #${player.seanPosRank>0?player.seanPosRank:'—'} · ${player.tier||'—'}${player.notes?' · '+player.notes:''}</div>

      <div class="pcard-grid">
        <div class="pcard-stat ${espnBid==null?'dim':''}">
          <div class="ps-lbl">ESPN Recommended Bid</div>
          <div class="ps-val">${espnBid!=null?'$'+espnBid:'—'}</div>
          <div class="ps-sub">${espnBid!=null?'ESPN crowd-sourced':'not yet published by ESPN'}</div>
        </div>
        <div class="pcard-stat ${!mcBid?'dim':''}">
          <div class="ps-lbl">Mission Control Target</div>
          <div class="ps-val">${mcBid?'$'+mcBid.bid:'—'}</div>
          <div class="ps-sub">${mcBid
            ? `${mcBid.band} tier · $${mcBid.rate}/WAR · base only, no live adj. yet`
            : (BIDCAL ? 'no calibration for this position' : 'run bid_calibration.py')}</div>
        </div>

          <div class="ps-lbl">Projected WAR</div>
          <div class="ps-val">${war!=null?(war>0?'+':'')+war:'—'}</div>
          <div class="ps-sub pt-warsrc">${war!=null?'pts above replacement · 2026 ESPN Projections':'needs 2026 ESPN projections'}</div>
        </div>
        <div class="pcard-stat ${!bidRange?'dim':''}">
          <div class="ps-lbl">Expected Bid Range</div>
          <div class="ps-val">${bidRange?`$${bidRange.low}–$${bidRange.high}`:'—'}</div>
          <div class="ps-sub">${bidRange?`historic ${bidRange.tier} · avg $${bidRange.avg}`:'no tier history match'}</div>

}

function myBudgetForPlayer(){
  // My current max feasible bid = budget left minus $1 reserve per other
  // remaining slot. Same math as the banner MAX BID (independent of the
  // specific player -- it's "the most I could spend on any single player now").
  const myPicks = zimmerDraft.picks.filter(p=>p.isMine);
  const spent = myPicks.reduce((s,p)=>s+p.cost,0);
  const remaining = ASSUMED_BUDGET - spent;
  const slotsLeft = ASSUMED_ROSTER.length - myPicks.length;
  return Math.max(1, remaining - Math.max(0, slotsLeft - 1));
}

function renderOpponentPanel(player, root){
  const area = (root||document).querySelector('.opponentPanelArea');
  if(!area) return;
  if(!ZHIST || !ZHIST.owners || !ZHIST.owners.length){
    area.innerHTML = `<div class="seclabel">Opponents</div>
      <div class="empty-note">Opponent tendencies need zimmer_analysis.json.<br>Run the analysis workflow.</div>`;
    return;
  }

  // per-opponent live spend (from attributed picks) -> remaining budget
  const oppSpend = {};
  const oppCount = {};
  zimmerDraft.picks.forEach(pick=>{
    if(pick.owner){
      oppSpend[pick.owner] = (oppSpend[pick.owner]||0) + pick.cost;
      oppCount[pick.owner] = (oppCount[pick.owner]||0) + 1;
    }
  });

  // Score each opponent's likely aggression on the SELECTED player.
  const scored = ZHIST.owners.map(o=>{
    const spent = oppSpend[o.owner]||0;
    const picksMade = oppCount[o.owner]||0;
    const budgetLeft = ASSUMED_BUDGET - spent;
    const slotsLeft = ASSUMED_ROSTER.length - picksMade;
    const attributed = picksMade>0; // do we actually have live data on them?

    let aggression = 0;
    const reasons = [];

    if(player){
      // (a) budget headroom: more $ left than an average remaining slot implies
      const perSlot = slotsLeft>0 ? budgetLeft/slotsLeft : 0;
      if(attributed){
        if(perSlot > 12){ aggression += 2; reasons.push(`flush ($${budgetLeft} left)`); }
        else if(perSlot < 5){ aggression -= 2; reasons.push(`budget-tight ($${budgetLeft} left)`); }
      }
      // (b) positional lean: do they historically pay up for / prioritize this position?
      if(o.priority_position===player.pos){ aggression += 2; reasons.push(`${player.pos}-priority historically`); }
      if(o.punt_position===player.pos){ aggression -= 2; reasons.push(`punts ${player.pos} historically`); }
      // (c) concentration style vs player caliber (tier)
      const eliteTier = player.seanPosRank!=null && player.seanPosRank<=6;
      if(o.concentration_style==='stars' && eliteTier){ aggression += 1; reasons.push('stars-&-scrubs on elite'); }
      if(o.concentration_style==='value' && eliteTier){ aggression -= 1; reasons.push('value-hunter, avoids top $'); }
      // (d) market driver signal
      if((o.tags||[]).includes('Market Driver')){ aggression += 1; reasons.push('market driver'); }
    }
    return {o, budgetLeft, slotsLeft, attributed, aggression, reasons};
  });

  // sort: hottest first
  scored.sort((a,b)=>b.aggression-a.aggression);

  const legend = player
    ? `<div class="aggr-legend">Likely bidders on <b style="color:var(--amber)">${player.name}</b>:
       <span style="color:var(--red)">red = aggressive</span>, <span style="color:var(--dim)">dim = unlikely</span>.
       Based on budget, historical position lean, and draft style.</div>`
    : `<div class="aggr-legend">Select a player to see who's likely to bid aggressively.</div>`;

  const cards = scored.map(s=>{
    const hot = player && s.aggression>=3;
    const cold = player && s.aggression<=-2;
    const tags = (s.o.tags||[]).slice(0,2).map(t=>`<span class="otag ${tagClass(t)}">${t}</span>`).join(' ');
    const budgetTxt = s.attributed
      ? `$${s.budgetLeft} · ${s.slotsLeft} slots`
      : `<span style="color:var(--line-2)">budget untracked</span>`;
    let aggrLine = '';
    if(player){
      const cls = hot?'hot':(cold?'cold':'neutral');
      const verdict = hot?'▲ LIKELY AGGRESSIVE':(cold?'▽ unlikely':'– neutral');
      aggrLine = `<div class="opp-aggr ${cls}">${verdict}${s.reasons.length?' — '+s.reasons.join(', '):''}</div>`;
    }
    return `<div class="opp-card ${hot?'hot':''} ${cold?'cold':''}">
      <div class="opp-head"><span class="opp-name">${s.o.owner}</span><span class="opp-budget">${budgetTxt}</span></div>
      <div class="opp-tags">${tags}</div>
      ${aggrLine}
    </div>`;
  }).join('');

  area.innerHTML = `<div class="seclabel">Opponent Intel</div>${legend}<div class="opp-grid">${cards}</div>`;
}

function renderPositionBoard(player, root){
  const area = (root||document).querySelector('.positionBoardArea');
  if(!area) return;
  // The Position Board is now the SAME component as Player Search, tier-grouped
  // and selectable, so toggling between the two is seamless (identical columns,
  // styling, sort/filter state). Selecting a nominated player pre-filters the
  // board to that position for focus, but the user can widen it via the Pos
  // filter like any other table.
  const rerender = ()=>renderPlayerTable(area, {
    rerender, groupByTier:(cockpitCol2Mode==='board'), selectable:true,
    onSelect:(pid)=>{ renderAuctionDraft(); },
  });
  rerender();
}

// Session-only draggable divider between the Board and Opponent columns. Drag
// left = more room for Opponent; drag right = more room for the Board. Rewrites
// grid-template-columns directly (see attachResizer). Resets on reload.
function wireCockpitResizer(el){
  // Zimmer cockpit: Active Player (0.85) | Board (1.6) | Opponent (1)
  attachResizer(el.querySelector('#cockpitResizer'), el.querySelector('.cockpit-cols'), [0.85,1.6,1]);
}
let _cockpitDrag = null, _cockpitResizerGlobalWired = false;

function renderLoggedPicks(){
  const el = document.getElementById('loggedPicks');
  if(!zimmerDraft.picks.length){
    el.innerHTML = `<div class="empty-note">No picks logged yet.</div>`;
    return;
  }
  el.innerHTML = zimmerDraft.picks.map((p,i)=>`
    <div class="logged-pick-row">
      <span>${p.isMine?'★ ':''}${p.name} <span style="color:var(--dim)">(${p.position})</span></span>
      <span>$${p.cost} <button data-i="${i}">✕</button></span>

// ---------- Replay mode ----------
// Plays back a REAL historical Zimmer draft, pick by pick, through the same
// kind of UI the live draft-day interface will use. Purpose: test the ticker,
// roster/budget tracking, and best-available board against real data and
// real cadence, without needing an actual live draft window open. The "Top
// Recommendation" here is necessarily RETROSPECTIVE (highest eventual price
// among remaining players) since these are already-completed drafts -- it's
// there to exercise the recommendation-card UI, not to simulate real strategy.

function stopReplayTimer(){
  if(replay.timer){ clearInterval(replay.timer); replay.timer=null; }
  replay.playing=false;
}

function renderReplay(){
  const el=document.getElementById('replayView');
  if(!ZDRAFTS){
    el.innerHTML=`<div class="seclabel">Replay — Zimmer Draft History</div>
      <div class="empty-note">zimmer_draft_history.json not found.<br>
      Run the "Update Zimmer Draft History" workflow to populate this view.</div>`;
    return;
  }
  if(!replay.started){ renderReplaySetup(el); }
  else { renderReplayPlayback(el); }
}

function renderReplaySetup(el){
  const seasons = Object.keys(ZDRAFTS.seasons||{}).sort().reverse();
  const seasonSel = replay.season || seasons[0];
  const sdata = ZDRAFTS.seasons[seasonSel];
  const teamOptions = sdata ? Object.values(sdata.teams).map(t=>t.owners?.[0]||t.team_name) : [];
  const uniqueOwners = [...new Set(teamOptions)];

  el.innerHTML=`
    <div class="seclabel">Replay — Zimmer Draft History</div>
    <div style="font-size:10px;color:var(--dim);line-height:1.5;">
      Plays back a real completed draft pick-by-pick so we can test the live-draft
      interface (ticker, roster/budget tracking, board) without waiting for an actual
      live draft window. Recommendations shown during replay are retrospective
      (known outcomes), not real strategic advice.
    </div>
    <div class="replay-setup">
      <label>Season</label>
      <select id="replaySeasonSel">
        ${seasons.map(s=>`<option value="${s}" ${s===seasonSel?'selected':''}>${s}</option>`).join('')}
      </select>
      <label>Play as (owner)</label>
      <select id="replayOwnerSel">
        ${uniqueOwners.map(o=>`<option value="${o}">${o}</option>`).join('')}
      </select>
      <button class="replay-start-btn" id="replayStartBtn">▶ Start Replay</button>
      <div class="replay-disclaimer">
        This uses a completed draft, so every outcome is already known. It's a test
        harness for the interface, not a prediction tool — the real recommendation
        engine (Big Board ranks, positional need, scarcity) only makes sense against
        the live 2026 player pool in Draft mode.
      </div>
    </div>`;

  document.getElementById('replaySeasonSel').onchange=(e)=>{
    replay.season=e.target.value; renderReplaySetup(el);
  };
  document.getElementById('replayStartBtn').onclick=()=>{
    const season=document.getElementById('replaySeasonSel').value;
    const owner=document.getElementById('replayOwnerSel').value;
    startReplay(season, owner);
  };
}

function startReplay(season, owner){
  const sdata = ZDRAFTS.seasons[season];
  const picks = [...(sdata.picks||[])];
  // chronological order: auctions use nomination_order, snake drafts use overall pick order
  if(picks.length && picks[0].nomination_order != null){
    picks.sort((a,b)=>(a.nomination_order||0)-(b.nomination_order||0));
  } else {
    picks.sort((a,b)=>((a.round||0)*1000+(a.pick||0))-((b.round||0)*1000+(b.pick||0)));
  }
  replay = {
    season, myOwner: owner, timeline: picks, teams: sdata.teams, idx: 0,
    playing: false, timer: null, speedMs: replay.speedMs||1500, started: true,
    // preserve the real live-draft picks so replay's synthesized picks (which
    // reuse zimmerDraft.picks to drive the shared cockpit components) don't
    // clobber an in-progress real draft. Restored in resetReplay / on exit.
    savedLivePicks: zimmerDraft.picks,
  };
  renderReplay();
}

function restoreLivePicks(){
  if(replay.savedLivePicks){
    zimmerDraft.picks = replay.savedLivePicks;
    replay.savedLivePicks = null;
  }
}

function resetReplay(){
  stopReplayTimer();
  restoreLivePicks();
  replay.started=false;
  renderReplay();
}

function stepReplay(delta){
  stopReplayTimer();
  replay.idx = Math.max(0, Math.min(replay.timeline.length, replay.idx+delta));
  renderReplay();
}

function toggleReplayPlay(){
  if(replay.playing){ stopReplayTimer(); renderReplay(); return; }
  if(replay.idx>=replay.timeline.length) return;
  replay.playing=true;
  replay.timer=setInterval(()=>{
    replay.idx++;
    if(replay.idx>=replay.timeline.length){ stopReplayTimer(); }
    renderReplay();
  }, replay.speedMs);
  renderReplay();
}

function renderReplayPlayback(el){
  const {timeline, idx, myOwner, teams} = replay;
  const picksSoFar = timeline.slice(0, idx);
  const isAuction = timeline.length && timeline[0].cost != null;
  const done = idx >= timeline.length;

  // Feed the SAME cockpit components the live Draft view uses, by projecting
  // replay picks-so-far into the zimmerDraft shape {name, position, cost,
  // isMine, owner}. This means Replay exercises the real position board and
  // opponent panel exactly as they'll behave live -- the whole point of the
  // rehearsal. The "next nominated player" is the pick that's about to happen
  // (timeline[idx]), so the card/board/opponent panel all react to it.
  zimmerDraft.picks = picksSoFar.map(p=>{
    const t = teams[String(p.team_id)];
    const owner = (t && t.owners && t.owners[0]) || p.team_name || null;
    return {
      name: p.player, position: p.position || '—', cost: p.cost || 0,
      isMine: owner===myOwner, owner: owner===myOwner ? null : owner,
    };
  });

  const nextPick = done ? null : timeline[idx];
  const nextPlayer = nextPick ? (findBigBoardPlayer(nextPick.player) || {
    // fall back to a minimal player object if not on the Big Board, so the
    // card still renders something meaningful during replay
    id:null, name: nextPick.player, pos: nextPick.position||'—',
    team:(teams[String(nextPick.team_id)]||{}).team_name||'', seanPosRank:null,
    tier:null, espnRecommendedBid:null, projectedWar:null, byeWeek:null, proTeamEspn:null,
  }) : null;

  const recent = picksSoFar.slice(-8).reverse();
  const tickerHtml = recent.length
    ? recent.map(p=>{
        const t=teams[String(p.team_id)];
        const owner=t?.owners?.[0]||p.team_name||'?';
        const priceTag = isAuction ? ` — $${p.cost}` : ` — R${p.round}.${p.pick}`;
        return `<span><b>${owner}</b> selects ${p.player}${priceTag}</span>`;
      }).join('')
    : `<span>DRAFT NOT YET STARTED</span>`;

  // controls + progress header
  el.innerHTML=`
    <div class="seclabel">Replay — ${replay.season} · as ${myOwner}
      <span class="retro-tag">rehearsal</span></div>
    <div class="replay-progress">PICK <b>${idx}</b> OF <b>${timeline.length}</b>${done?' · DRAFT COMPLETE':(nextPick?` · NEXT: ${nextPick.player}`:'')}</div>
    <div class="replay-controls">
      <button id="rwBtn" title="Step back">⏮</button>
      <button class="play-btn" id="playBtn">${replay.playing?'⏸ PAUSE':(done?'↺ RESTART':'▶ PLAY')}</button>
      <button id="fwBtn" title="Step forward">⏭</button>
      <select id="speedSel">
        <option value="2500" ${replay.speedMs===2500?'selected':''}>SLOW</option>
        <option value="1200" ${replay.speedMs===1200?'selected':''}>NORMAL</option>
        <option value="400" ${replay.speedMs===400?'selected':''}>FAST</option>
      </select>
      <button id="resetBtn" title="Choose different season/owner">⟲ SETUP</button>
    </div>

    <div class="ticker"><div class="track">${tickerHtml}${tickerHtml}</div></div>

    <div class="cockpit-cols cockpit-cols-noresize" style="margin-top:14px;">
      <div class="cockpit-col">
        <div class="seclabel">On The Block ${nextPick&&isAuction?`<span class="retro-tag">sold $${nextPick.cost}</span>`:''}</div>
        <div class="playerCardArea"></div>
      </div>
      <div class="cockpit-col"><div class="positionBoardArea"></div></div>
      <div class="cockpit-col"><div class="opponentPanelArea"></div></div>
    </div>

    <div class="foot">
      REPLAY REHEARSAL — ${replay.season} Zimmer draft, real historical data, driving the same
      cockpit components as the live Draft view. Player card values (ESPN bid, WAR) reflect the
      CURRENT Big Board where the historical player matches by name; "On The Block" shows what the
      pick actually sold for.
    </div>`;

  // reuse the exact cockpit renderers, scoped to the replay view's own
  // elements (the Draft view has identically-named element IDs, so we must
  // pass the replay root or getElementById would target the hidden Draft copy)
  renderPlayerCard(nextPlayer, el);
  renderPositionBoard(nextPlayer, el);
  renderOpponentPanel(nextPlayer, el);

  document.getElementById('rwBtn').onclick=()=>stepReplay(-1);
  document.getElementById('fwBtn').onclick=()=>stepReplay(1);
  document.getElementById('playBtn').onclick=()=>{
    if(done && !replay.playing){ replay.idx=0; renderReplay(); return; }
    toggleReplayPlay();
  };
  document.getElementById('resetBtn').onclick=()=>resetReplay();
  document.getElementById('speedSel').onchange=(e)=>{
    replay.speedMs=parseInt(e.target.value,10);
    if(replay.playing){ stopReplayTimer(); toggleReplayPlay(); }
  };
}

boot();
</script>
