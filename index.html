<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAFT CONTROL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@500;600;700&display=swap');
  :root{
    --bg:#0a0e14; --panel:#12181f; --line:#1f2833; --line-2:#2a3542;
    --amber:#ffb703; --cyan:#00d9ff; --red:#ff4d4d; --green:#3ddc84;
    --txt:#e8eef2; --dim:#7d8b99;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:'IBM Plex Mono',monospace;
    -webkit-font-smoothing:antialiased;padding-bottom:40px;}
  .wrap{max-width:780px;margin:0 auto;padding:0 14px;}

  /* site-wide footer -- Yahoo Fantasy attribution required on every page */
  .site-foot{max-width:780px;margin:24px auto 0;padding:14px 14px 30px;font-size:9.5px;
    color:var(--dim);border-top:1px solid var(--line);letter-spacing:0.02em;}
  .site-foot a{color:var(--cyan);text-decoration:none;}
  .site-foot a:hover{text-decoration:underline;}

  /* header */
  header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);}
  .hbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;max-width:780px;margin:0 auto;}
  .logo{font-weight:700;letter-spacing:0.18em;font-size:13px;color:var(--amber);}
  .logo b{color:var(--cyan);}
  .status{font-size:10px;color:var(--dim);letter-spacing:0.1em;}
  .status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 8px var(--green);margin-right:5px;animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* league tabs */
  .leagues{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--bg);}
  .leagues button{flex:1;background:none;border:none;border-bottom:2px solid transparent;
    color:var(--dim);font-family:inherit;font-size:11px;font-weight:600;letter-spacing:0.04em;
    padding:11px 6px;cursor:pointer;}
  .leagues button .plat{display:block;font-size:8.5px;letter-spacing:0.14em;margin-top:3px;opacity:.6;}
  .leagues button.on{color:var(--amber);border-bottom-color:var(--amber);}

  /* clock row */
  .clockrow{display:flex;align-items:center;gap:16px;padding:18px 0 6px;}
  .radar{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);position:relative;flex-shrink:0;
    background:repeating-radial-gradient(circle,transparent 0 11px,var(--line) 11px 12px);}
  .radar .sweep{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(255,183,3,.55),transparent 65deg);animation:spin 3s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .clock .big{font-size:26px;font-weight:700;color:var(--amber);line-height:1;}
  .clock .lbl{font-size:10px;color:var(--dim);letter-spacing:0.1em;margin-top:5px;}

  /* section label */
  .seclabel{font-size:10px;letter-spacing:0.16em;color:var(--cyan);margin:22px 0 10px;text-transform:uppercase;}
  .seclabel::before{content:'◈ ';}

  /* recommendation card */
  .card{background:var(--panel);border:1px solid var(--line);position:relative;padding:15px;margin-bottom:11px;}
  .card::before,.card::after{content:'';position:absolute;width:9px;height:9px;border:1px solid var(--amber);}
  .card::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
  .card::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
  .rec .top{display:flex;justify-content:space-between;align-items:baseline;}
  .rec .name{font-size:18px;font-weight:700;color:var(--amber);}
  .rec .posbadge{font-size:10px;padding:2px 7px;border:1px solid var(--line-2);color:var(--cyan);}
  .rec .meta{font-size:10.5px;color:var(--dim);margin:4px 0 12px;letter-spacing:0.02em;}
  .rec .row{display:flex;justify-content:space-between;font-size:11px;padding:7px 0;border-top:1px solid var(--line);}
  .rec .row .why{color:var(--cyan);text-align:right;max-width:62%;}
  .rec .row .why.warn{color:var(--red);}
  .tierpill{display:inline-block;font-size:9px;padding:2px 6px;border-radius:2px;margin-left:6px;
    background:rgba(0,217,255,.1);color:var(--cyan);vertical-align:middle;}
  .rookie-badge{display:inline-block;font-size:8.5px;font-weight:700;padding:1px 5px;
    border-radius:2px;margin-left:6px;background:rgba(255,183,3,.15);color:var(--amber);
    vertical-align:middle;letter-spacing:0.03em;cursor:help;}

  /* feed ticker */
  .ticker{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    overflow:hidden;white-space:nowrap;padding:8px 0;margin:6px 0 0;}
  .ticker .track{display:inline-block;animation:scroll 26s linear infinite;}
  .ticker span{font-size:10.5px;color:var(--dim);padding-right:34px;}
  .ticker span b{color:var(--cyan);}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* roster grid */
  .roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px;}
  .slot{background:var(--panel);border:1px solid var(--line);padding:9px 10px;}
  .slot .s-pos{font-size:9px;letter-spacing:0.12em;color:var(--dim);}
  .slot .s-val{font-size:12px;margin-top:3px;}
  .slot.filled .s-val{color:var(--txt);}
  .slot.empty .s-val{color:var(--line-2);}
  .slot.need{border-color:var(--red);}
  .slot.need .s-pos{color:var(--red);}
  .slot.keeper{border-color:var(--amber);}
  .slot.keeper .s-pos{color:var(--amber);}

  /* board table */
  table{width:100%;border-collapse:collapse;font-size:11px;}
  th{text-align:left;font-size:9px;letter-spacing:0.1em;color:var(--dim);text-transform:uppercase;
    padding:6px 6px;border-bottom:1px solid var(--line-2);font-weight:500;}
  td{padding:7px 6px;border-bottom:1px solid var(--line);}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .diff-pos{color:var(--green);} .diff-neg{color:var(--red);}
  tr.gone td{opacity:.32;text-decoration:line-through;}
  .foot{font-size:9.5px;color:var(--dim);margin-top:14px;line-height:1.6;}
  .empty-note{font-size:11px;color:var(--dim);padding:20px;text-align:center;border:1px dashed var(--line-2);}

  /* mode toggle (Draft / History) */
  .modes{display:flex;gap:8px;padding:12px 0 2px;}
  .modes button{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    font-family:inherit;font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;
    padding:8px 14px;cursor:pointer;}
  .modes button.on{color:var(--bg);background:var(--amber);border-color:var(--amber);}

  /* headline cards */
  .headline{background:var(--panel);border-left:2px solid var(--cyan);padding:10px 12px;margin-bottom:8px;
    font-size:11.5px;line-height:1.5;color:var(--txt);}
  .headline b{color:var(--amber);}

  /* tier spread heatmap-ish table */
  .tiertbl td.bar-cell{padding:4px 6px;min-width:120px;}
  .barwrap{position:relative;height:16px;background:var(--line);border-radius:2px;overflow:hidden;}
  .barfill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,rgba(0,217,255,.35),rgba(255,183,3,.55));}
  .barlbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 5px;font-size:9px;color:var(--txt);}
  .pos-head{color:var(--amber);font-weight:700;font-size:11px;padding-top:12px;}

  /* owner cards */
  .ownercard{background:var(--panel);border:1px solid var(--line);padding:12px;margin-bottom:9px;}
  .ownercard .oname{font-size:14px;font-weight:700;color:var(--amber);}
  .ownercard .otag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:10px;margin-left:8px;
    vertical-align:middle;letter-spacing:0.06em;}
  .otag.stars{background:rgba(255,77,77,.15);color:var(--red);}
  .otag.balanced{background:rgba(61,220,132,.15);color:var(--green);}
  .otag.value{background:rgba(0,217,255,.15);color:var(--cyan);}
  .ownercard .ostats{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;}
  .ostat{font-size:10px;color:var(--dim);}
  .ostat b{display:block;font-size:15px;color:var(--txt);font-weight:700;margin-top:2px;}
  .posspend{margin-top:9px;font-size:10px;color:var(--dim);line-height:1.7;}
  .posspend .pchip{display:inline-block;background:var(--line);border-radius:3px;padding:2px 6px;margin:2px 4px 0 0;color:var(--txt);}
  .stratnote{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--txt);line-height:1.55;}

  /* replay mode: setup screen */
  .replay-setup{background:var(--panel);border:1px solid var(--line);padding:16px;margin-top:8px;}
  .replay-setup label{display:block;font-size:10px;letter-spacing:0.1em;color:var(--dim);
    text-transform:uppercase;margin-bottom:6px;margin-top:14px;}
  .replay-setup label:first-child{margin-top:0;}
  .replay-setup select{width:100%;background:var(--bg);border:1px solid var(--line-2);color:var(--txt);
    font-family:inherit;font-size:13px;padding:9px 10px;}
  .replay-start-btn{width:100%;margin-top:18px;padding:12px;background:var(--amber);color:var(--bg);
    border:none;font-family:inherit;font-weight:700;font-size:12px;letter-spacing:0.08em;
    text-transform:uppercase;cursor:pointer;}
  .replay-disclaimer{font-size:10px;color:var(--dim);line-height:1.6;margin-top:10px;
    border-left:2px solid var(--line-2);padding-left:10px;}

  /* replay mode: playback controls */
  .replay-controls{display:flex;align-items:center;gap:8px;padding:10px 0;}
  .replay-controls button{background:var(--panel);border:1px solid var(--line);color:var(--txt);
    font-family:inherit;font-size:14px;padding:9px 13px;cursor:pointer;}
  .replay-controls button.play-btn{flex:1;background:var(--amber);color:var(--bg);border-color:var(--amber);
    font-weight:700;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;}
  .replay-controls select{background:var(--panel);border:1px solid var(--line);color:var(--txt);
    font-family:inherit;font-size:10px;padding:9px 6px;}
  .replay-progress{font-size:10px;color:var(--dim);letter-spacing:0.06em;padding:0 0 8px;}
  .replay-progress b{color:var(--amber);}
  .retro-tag{display:inline-block;font-size:8.5px;letter-spacing:0.08em;color:var(--bg);
    background:var(--cyan);padding:2px 6px;margin-left:6px;vertical-align:middle;text-transform:uppercase;}

  /* auction draft mode: player search + card */
  .search-wrap{position:relative;margin-bottom:10px;}
  .search-wrap input{width:100%;background:var(--panel);border:1px solid var(--line-2);color:var(--txt);
    font-family:inherit;font-size:14px;padding:11px 12px;}
  .search-results{position:absolute;top:100%;left:0;right:0;background:var(--panel);
    border:1px solid var(--line-2);border-top:none;max-height:260px;overflow-y:auto;z-index:20;}
  .search-results .sr-item{padding:9px 12px;font-size:12px;border-bottom:1px solid var(--line);cursor:pointer;
    display:flex;justify-content:space-between;}
  .search-results .sr-item:hover{background:var(--line);}
  .search-results .sr-item .sr-pos{color:var(--cyan);font-size:10px;}

  .budget-bar{display:flex;gap:10px;margin-bottom:14px;}
  .budget-chip{flex:1;background:var(--panel);border:1px solid var(--line);padding:9px 10px;text-align:center;}
  .budget-chip .bc-val{font-size:17px;font-weight:700;color:var(--amber);}
  .budget-chip .bc-lbl{font-size:8.5px;color:var(--dim);letter-spacing:0.08em;margin-top:2px;}

  .pcard-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;}
  .pcard-stat{background:var(--panel);border:1px solid var(--line);padding:10px 11px;}
  .pcard-stat .ps-lbl{font-size:8.5px;color:var(--dim);letter-spacing:0.08em;text-transform:uppercase;}
  .pcard-stat .ps-val{font-size:18px;font-weight:700;color:var(--amber);margin-top:3px;}
  .pcard-stat .ps-sub{font-size:9.5px;color:var(--dim);margin-top:2px;}
  .pcard-stat.dim .ps-val{color:var(--dim);font-size:14px;}
  .fit-note{background:var(--panel);border-left:2px solid var(--green);padding:10px 12px;font-size:11.5px;
    line-height:1.55;margin-top:4px;}
  .logged-pick-row{display:flex;justify-content:space-between;align-items:center;background:var(--panel);
    border:1px solid var(--line);padding:7px 10px;margin-bottom:6px;font-size:11px;}
  .logged-pick-row button{background:none;border:none;color:var(--red);font-size:14px;cursor:pointer;padding:0 4px;}
  .log-form{display:flex;gap:6px;margin-top:10px;}
  .log-form input{flex:1;background:var(--bg);border:1px solid var(--line-2);color:var(--txt);
    font-family:inherit;font-size:12px;padding:8px;}
  .log-form input.cost-input{flex:0 0 60px;}
  .log-form button{background:var(--amber);color:var(--bg);border:none;font-weight:700;padding:0 14px;cursor:pointer;}

  /* position board */
  .tier-group{margin-bottom:14px;}
  .tier-group-head{display:flex;justify-content:space-between;align-items:baseline;
    padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-bottom:none;}
  .tier-group-head .tg-name{font-size:12px;font-weight:700;color:var(--amber);}
  .tier-group-head .tg-hist{font-size:9.5px;color:var(--dim);}
  .tier-group-head .tg-hist b{color:var(--cyan);}
  .trend-badge{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:700;letter-spacing:0.03em;}
  .trend-badge.up{background:rgba(255,77,77,.15);color:var(--red);}
  .trend-badge.down{background:rgba(61,220,132,.15);color:var(--green);}
  .trend-badge.flat{background:rgba(125,139,153,.15);color:var(--dim);}
  .pbr{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;
    border:1px solid var(--line);border-top:none;font-size:11.5px;}
  .pbr:last-child{border-bottom:1px solid var(--line);}
  .pbr.selected{background:rgba(255,183,3,.1);border-left:2px solid var(--amber);}
  .pbr.drafted{opacity:0.5;}
  .pbr.drafted .pbr-name{text-decoration:line-through;}
  .pbr .pbr-rank{color:var(--dim);font-size:9.5px;margin-right:6px;}
  .pbr .pbr-status{font-size:10.5px;}
  .pbr .pbr-status.available{color:var(--green);}
  .pbr .pbr-status.mine{color:var(--amber);font-weight:700;}

  /* ===== auction desktop cockpit ===== */
  .cockpit-banner{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .cockpit-banner .budget-chip{flex:1;min-width:90px;}
  .budget-chip.kpi{border-color:var(--cyan);}
  .budget-chip.kpi .bc-val{color:var(--cyan);}
  .roster-strip{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
  .roster-cell{background:var(--panel);border:1px solid var(--line);padding:5px 9px;font-size:10px;}
  .roster-cell .rc-pos{color:var(--dim);letter-spacing:0.06em;}
  .roster-cell .rc-fill{color:var(--txt);font-weight:600;margin-left:5px;}
  .roster-cell.full{border-color:var(--green);}
  .roster-cell.full .rc-pos{color:var(--green);}

  /* Cockpit: Active Player | Board | [resizer] | Opponent. There are FOUR
     direct children of .cockpit-cols -- the two side columns, the board, AND
     the drag handle between board and opponent. So the grid needs FOUR tracks;
     the 3rd is a fixed narrow track for the resizer. (Earlier bug: only 3
     tracks were declared, so the opponent column wrapped to a new row at the
     bottom of the page.) The resizer rewrites the fr weights from JS. */
  .cockpit-cols{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:900px){
    .cockpit-cols{
      grid-template-columns:0.85fr 1.6fr 8px 1fr;
      align-items:start;
    }
    .wrap{max-width:1400px;}
  }
  /* on mobile (single column) the resizer is hidden, so it doesn't consume a row */
  .cockpit-cols{grid-auto-flow:row;}
  /* replay cockpit has no resizer -- 3 children, 3 tracks */
  @media(min-width:900px){
    .cockpit-cols-noresize{grid-template-columns:0.85fr 1.6fr 1fr;}
  }
  .cockpit-col{min-width:0;}
  .cockpit-col .seclabel:first-child{margin-top:0;}

  /* drag handle sits between board and opponent columns */
  .cockpit-resizer{display:none;}
  @media(min-width:900px){
    .cockpit-resizer{display:block;width:8px;cursor:col-resize;background:var(--line);
      border-radius:3px;align-self:stretch;position:relative;z-index:2;}
    .cockpit-resizer:hover,.cockpit-resizer.dragging{background:var(--amber);}
  }

  /* column 2 richer player rows */
  .pbr .pbr-meta{font-size:9px;color:var(--dim);margin-top:2px;}
  .pbr .pbr-metric{font-size:9.5px;text-align:right;white-space:nowrap;}
  .pbr .pbr-metric .m-espn{color:var(--cyan);}
  .pbr .pbr-metric .m-war{color:var(--amber);}
  .pbr-col-main{display:flex;flex-direction:column;min-width:0;flex:1;}

  /* column 3 opponent panels */
  .opp-card{background:var(--panel);border:1px solid var(--line);padding:10px 11px;margin-bottom:8px;}
  .opp-card.hot{border-color:var(--red);box-shadow:0 0 0 1px rgba(255,77,77,0.3);}
  .opp-card.cold{opacity:0.6;}
  .opp-head{display:flex;justify-content:space-between;align-items:baseline;}
  .opp-name{font-size:12px;font-weight:700;color:var(--txt);}
  .opp-budget{font-size:11px;color:var(--amber);font-weight:700;}
  .opp-tags{margin-top:5px;}
  .opp-tags .otag{font-size:8px;padding:1px 6px;}
  .opp-aggr{font-size:9.5px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);line-height:1.5;}
  .opp-aggr.hot{color:var(--red);}
  .opp-aggr.cold{color:var(--dim);}
  .opp-aggr.neutral{color:var(--cyan);}
  .aggr-legend{font-size:9px;color:var(--dim);margin-bottom:8px;line-height:1.5;}

  /* ===== draft order / live keepers panel (Kepners) ===== */
  .doTable{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:6px;}
  .doTable th{text-align:left;font-size:9px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--line-2);font-weight:500;}
  .doTable td{padding:6px 8px;border-bottom:1px solid var(--line);}
  .doTable tr.me{background:rgba(255,183,3,0.08);}
  .doTable .do-keeper{color:var(--green);font-size:10px;}
  .doTable .do-keeper-suggested{color:var(--amber);font-size:10px;font-style:italic;}
  .doTable .do-keeper-unmatched{color:var(--red);font-size:10px;font-weight:700;}
  .doTable .do-none{color:var(--dim);font-size:10px;}
  .do-unmatched{font-size:9px;color:var(--red);margin-top:4px;}

  /* ===== owner drafting profiles (Kepners) ===== */
  .owner-card{background:var(--panel);border:1px solid var(--line);padding:9px 11px;margin-bottom:7px;}
  .owner-card.me{border-color:var(--amber);}
  .owner-head{display:flex;justify-content:space-between;align-items:baseline;}
  .owner-name{font-size:12px;font-weight:700;color:var(--txt);}
  .owner-team{font-size:9px;color:var(--dim);}
  .owner-note{font-size:10px;color:var(--cyan);margin-top:5px;line-height:1.5;}

  /* ===== keeper value grades (Kepners) ===== */
  .kgTable{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:6px;}
  .kgTable th{text-align:left;font-size:9px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--line-2);font-weight:500;}
  .kgTable td{padding:6px 8px;border-bottom:1px solid var(--line);}
  .kgTable td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .kg-suggested-row{background:rgba(255,183,3,.05);}
  .kg-verdict{font-size:9.5px;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap;}
  .kg-verdict.eliteplus{background:rgba(255,183,3,.32);color:var(--amber);font-weight:700;
    box-shadow:0 0 0 1.5px var(--amber);}
  .kg-verdict.elite{background:rgba(255,183,3,.22);color:var(--amber);font-weight:700;
    box-shadow:0 0 0 1px rgba(255,183,3,0.4);}
  .kg-verdict.great{background:rgba(61,220,132,.18);color:var(--green);}
  .kg-verdict.good{background:rgba(61,220,132,.1);color:var(--green);}
  .kg-verdict.fair{background:rgba(125,139,153,.15);color:var(--dim);}
  .kg-verdict.overpriced{background:rgba(255,77,77,.15);color:var(--red);}
  .kg-verdict.bust{background:rgba(255,77,77,.22);color:var(--red);font-weight:700;}
  .kg-verdict.insufficient{background:rgba(125,139,153,.1);color:var(--line-2);}
  .kg-verdict.na{background:rgba(125,139,153,.1);color:var(--line-2);}
  .kgTable td .pt-sub{display:block;}
  .gvTable{margin-bottom:16px;}
  .gvTable th:first-child{color:var(--amber);font-size:10px;}
  .gv-total-row td{border-top:1px solid var(--line-2);border-bottom:none;font-weight:700;color:var(--cyan);}

  /* ===== searchable player table ===== */
  .pt-controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center;}
  .pt-controls input[type=text]{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line-2);
    color:var(--txt);font-family:inherit;font-size:13px;padding:9px 11px;}
  .pt-controls select{background:var(--panel);border:1px solid var(--line);color:var(--txt);
    font-family:inherit;font-size:11px;padding:9px 8px;}
  .pt-controls label{font-size:9px;color:var(--dim);letter-spacing:0.06em;display:flex;align-items:center;gap:4px;}
  .pt-controls button.clear{background:var(--panel);border:1px solid var(--line-2);color:var(--dim);
    font-family:inherit;font-size:10px;padding:8px 12px;cursor:pointer;letter-spacing:0.06em;}
  .pt-count{font-size:10px;color:var(--dim);margin-bottom:8px;}
  .pt-warsrc{opacity:0.75;}

  /* data-source legend (explains column provenance + season) */
  .ds-legend{margin:0 0 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);}
  .ds-legend summary{cursor:pointer;font-size:11px;color:var(--cyan);padding:8px 11px;user-select:none;}
  .ds-legend summary:hover{color:var(--amber);}
  .ds-legend[open] summary{border-bottom:1px solid var(--line);}
  .ds-table{width:100%;border-collapse:collapse;font-size:10.5px;}
  .ds-table th{text-align:left;font-size:8.5px;letter-spacing:0.05em;text-transform:uppercase;
    color:var(--dim);padding:6px 11px;font-weight:500;}
  .ds-table td{padding:5px 11px;border-top:1px solid var(--line);vertical-align:top;}
  .ds-table .ds-col{color:var(--txt);font-weight:600;white-space:nowrap;}
  .ds-table .ds-note{color:var(--dim);line-height:1.45;}
  .ds-yr{font-size:9px;padding:1px 6px;border-radius:9px;white-space:nowrap;font-weight:700;}
  .ds-yr-now{background:rgba(61,220,132,.14);color:var(--green);}
  .ds-yr-mix{background:rgba(255,183,3,.15);color:var(--amber);}
  .ptable-wrap{overflow-x:auto;max-height:62vh;overflow-y:auto;}
  table.ptable{width:100%;border-collapse:collapse;font-size:11px;}
  table.ptable th{position:sticky;top:0;background:var(--bg);text-align:left;font-size:9px;
    letter-spacing:0.06em;text-transform:uppercase;color:var(--dim);padding:7px 8px;
    border-bottom:1px solid var(--line-2);font-weight:500;cursor:pointer;white-space:nowrap;user-select:none;}
  table.ptable th:hover{color:var(--txt);}
  table.ptable th .arrow{color:var(--amber);}
  table.ptable td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.ptable tr.drafted td{opacity:0.4;}
  table.ptable tr.drafted .pt-name{text-decoration:line-through;}
  table.ptable tr.mine{background:rgba(255,183,3,0.08);}
  .pt-avail{color:var(--green);font-size:10px;}

  /* snake live Draft Log */
  .sdl-form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px;}
  .sdl-form input,.sdl-form select{background:var(--bg);border:1px solid var(--line-2);
    color:var(--txt);font-family:inherit;font-size:11px;padding:8px;border-radius:2px;}
  .sdl-form input{flex:1 1 200px;}
  .sdl-form select{flex:0 0 170px;}
  .sdl-form button{background:var(--amber);color:#0b1220;border:none;font-family:inherit;
    font-weight:700;font-size:10px;letter-spacing:0.08em;padding:9px 14px;border-radius:2px;cursor:pointer;}
  .sdl-form button.sdl-secondary{background:transparent;color:var(--dim);border:1px solid var(--line-2);}
  .sdl-form button:disabled{opacity:0.4;cursor:default;}
  .sdl-msg{font-size:9.5px;color:var(--dim);min-height:12px;margin-bottom:4px;}
  .sdl-msg.warn{color:var(--red);}
  .sdl-list{max-height:190px;overflow-y:auto;border-top:1px solid var(--line);}
  .sdl-row{display:flex;gap:8px;align-items:center;padding:5px 4px;border-bottom:1px solid var(--line);
    font-size:11px;}
  .sdl-row.mine{background:rgba(255,183,3,.07);}
  .sdl-pick{flex:0 0 46px;color:var(--dim);font-size:9.5px;font-variant-numeric:tabular-nums;}
  .sdl-name{flex:1 1 auto;}
  .sdl-pos{flex:0 0 34px;color:var(--dim);font-size:9.5px;}
  .sdl-team{flex:0 0 150px;color:var(--cyan);font-size:9.5px;text-align:right;}
  .sdl-warn{color:var(--red);cursor:help;}
  .sdl-empty{color:var(--dim);font-size:10px;padding:8px 4px;}
  /* per-row owner editing + delete (fix a pick from several turns back
     without undoing everything after it) */
  .sdl-owner{flex:0 0 150px;background:var(--bg);border:1px solid var(--line-2);
    color:var(--cyan);font-family:inherit;font-size:9.5px;padding:2px 4px;}
  .sdl-owner.mine{color:var(--amber);}
  .sdl-del{flex:0 0 22px;background:transparent;border:1px solid var(--line-2);
    color:var(--dim);cursor:pointer;font-family:inherit;font-size:10px;line-height:1;padding:2px 0;}
  .sdl-del:hover{color:var(--red);border-color:var(--red);}
  .sdl-prefill{color:var(--amber);}
  /* rosters-by-team verification view */
  .rbt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px;margin-top:6px;}
  .rbt-card{border:1px solid var(--line);background:var(--panel);padding:6px 8px;}
  .rbt-team{color:var(--cyan);font-size:10px;margin-bottom:4px;border-bottom:1px solid var(--line);
    padding-bottom:3px;display:flex;justify-content:space-between;gap:6px;}
  .rbt-team.mine{color:var(--amber);}
  .rbt-count{color:var(--dim);font-size:9px;font-weight:400;}
  .rbt-p{font-size:9.5px;padding:1px 0;display:flex;gap:6px;align-items:baseline;}
  .rbt-lbl{color:var(--dim);flex:0 0 32px;font-variant-numeric:tabular-nums;}
  .rbt-pos{color:var(--dim);flex:0 0 26px;}
  .rbt-nm{flex:1 1 auto;}
  .rbt-keep{color:var(--green);}
  .rbt-empty{color:var(--dim);font-size:9.5px;padding:2px 0;}
  .pt-taken{color:var(--dim);font-size:10px;}
  .pt-suggested{color:var(--amber);font-size:10px;font-style:italic;}
  .name-suggested-keeper{text-decoration:line-through;text-decoration-color:var(--amber);
    color:var(--dim);}
  .pt-num{text-align:right;font-variant-numeric:tabular-nums;}
  .pt-war-pos{color:var(--green);} .pt-war-neg{color:var(--red);}
  .pt-toggle{display:flex;gap:6px;margin-bottom:12px;}
  .pt-toggle button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);
    font-family:inherit;font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;
    padding:8px;cursor:pointer;}
  .pt-toggle button.on{background:var(--amber);color:var(--bg);border-color:var(--amber);}

  /* opponent cards flow into multiple columns when there's width to spare,
     so at wide screens you can see everyone without scrolling. */
  .opp-grid{display:grid;grid-template-columns:1fr;gap:8px;}

  /* progressively wider screens: widen the shell and let the opponent panel
     go multi-column. Board width is primarily controlled by the drag handle
     (the resizer rewrites grid-template-columns), so these mainly free up
     overall space. SCOPED TO ZIMMER ONLY (.wide-cockpit on body) -- the
     Kepners/Miami 3-panel snake cockpit stays at the 1400px cap regardless of
     monitor width; it doesn't need or
     want the extra room, and stretching it edge-to-edge on a wide screen
     just adds awkward whitespace instead of helping. */
  @media(min-width:1500px){
    body.wide-cockpit .wrap{max-width:1700px;}
    .opp-grid{grid-template-columns:1fr 1fr;}
  }
  @media(min-width:2100px){
    body.wide-cockpit .wrap{max-width:2000px;}
    .opp-grid{grid-template-columns:1fr 1fr;}
  }

  /* tier group header rows inside the unified player table (Position Board mode) */
  table.ptable tr.pt-tier-head td{background:var(--panel);color:var(--amber);
    font-size:10px;font-weight:700;letter-spacing:0.05em;padding:6px 8px;
    border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);position:sticky;}
  table.ptable tr.pt-tier-head .pt-tier-n{color:var(--dim);font-weight:400;margin-left:6px;}
  table.ptable tr.pt-selectable{cursor:pointer;}
  table.ptable tr.pt-selectable:hover td{background:rgba(255,183,3,0.06);}
  table.ptable tr.selected td{background:rgba(255,183,3,0.14);}
  .pt-sub{color:var(--dim);font-size:8.5px;display:block;line-height:1.3;}

  /* compact table mode: used inside the cockpit panels (Zimmer board, snake
     board) where 3 columns share the screen and there's no room to spare --
     tighter padding/font than the standalone full-width Players tab. */
  .positionBoardArea table.ptable, .snakeTableMount table.ptable{font-size:10px;}
  .positionBoardArea table.ptable th, .snakeTableMount table.ptable th{padding:5px 5px;font-size:8px;}
  .positionBoardArea table.ptable td, .snakeTableMount table.ptable td{padding:4px 5px;}
  .positionBoardArea table.ptable td.pt-name, .snakeTableMount table.ptable td.pt-name{
    max-width:110px;overflow:hidden;text-overflow:ellipsis;}

  /* ===== snake cockpit (Kepners/Miami) ===== */
  /* Genuine thirds with a modest middle emphasis (not the aggressive skew
     Zimmer's cockpit uses) -- ~30% / ~39% / ~30% of the 1400px-capped wrap,
     since the middle panel's table needs the extra room but shouldn't crowd
     out My Team / Deep Dive into narrow slivers. */
  .snake-cockpit{}
  /* Bounded panel height so the 3-panel cockpit doesn't force long page
     scrolling -- each panel scrolls internally instead, matching the table's
     max-height so all three feel visually aligned. */
  .panel-scroll{max-height:62vh;overflow-y:auto;}
  @media(min-width:900px){
    .snake-cockpit{grid-template-columns:1fr 1.3fr 8px 1fr;}
  }
  .snake-banner{margin-bottom:12px;}
  .myteam-list{display:flex;flex-direction:column;gap:4px;}
  .myteam-cell{display:flex;justify-content:space-between;align-items:baseline;
    background:var(--panel);border:1px solid var(--line);padding:6px 9px;font-size:11px;}
  .myteam-cell.filled{border-color:var(--green);}
  .myteam-cell .mt-slot{color:var(--dim);font-size:9px;letter-spacing:0.06em;min-width:40px;}
  .myteam-cell .mt-player{color:var(--txt);font-weight:600;text-align:right;}
  .myteam-cell .mt-rd{color:var(--amber);font-size:9px;font-weight:400;}
  .myteam-cell .mt-empty{color:var(--line-2);}

  .deepDiveArea .dd-head{border-bottom:1px solid var(--line-2);padding-bottom:8px;margin-bottom:10px;}
  .dd-name{font-size:15px;font-weight:700;color:var(--amber);}
  .dd-sub{font-size:10px;color:var(--dim);margin-top:2px;}
  .dd-block{margin-bottom:11px;}
  .dd-lbl{font-size:9px;letter-spacing:0.06em;text-transform:uppercase;color:var(--dim);margin-bottom:3px;}
  .dd-val{margin-bottom:2px;}
  .dd-detail{font-size:10.5px;color:var(--txt);line-height:1.5;}
  .dd-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;}
  .dd-badge.avail-high{background:rgba(61,220,132,.18);color:var(--green);}
  .dd-badge.avail-mid{background:rgba(255,183,3,.15);color:var(--amber);}
  .dd-badge.avail-low{background:rgba(255,77,77,.15);color:var(--red);}
  .dd-fit{font-size:10.5px;font-weight:600;}
  .dd-fit.fit-good{color:var(--green);}
  .dd-fit.fit-ok{color:var(--amber);}
  .dd-fit.fit-low{color:var(--dim);}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="logo">DRAFT<b>CONTROL</b></div>
    <div class="status"><span class="dot"></span><span id="statustxt">DATA LOADED · MOCK MODE</span></div>
  </div>
  <div class="leagues" id="leagues"></div>
</header>

<div class="wrap">
  <div class="modes" id="modes">
    <button data-mode="draft" class="on">Draft</button>
    <button data-mode="players">Players</button>
    <button data-mode="prep">Prep</button>
    <button data-mode="history">History</button>
    <button data-mode="replay">Replay</button>
  </div>

  <!-- DRAFT VIEW -->
  <div id="draftView">
    <div id="snakeDraftUI">
      <div class="snake-banner" id="snakeBanner"></div>

      <div class="seclabel">Live Feed</div>
      <div class="ticker"><div class="track" id="ticker"></div></div>

      <div class="cockpit-cols snake-cockpit">
        <div class="cockpit-col">
          <div class="seclabel">My Team — <span id="myteamlbl"></span></div>
          <div class="myTeamArea panel-scroll" id="myTeamArea"></div>
        </div>
        <div class="cockpit-col">
          <div class="seclabel">Player Board</div>
          <div class="snakePlayerArea"></div>
        </div>
        <div class="cockpit-resizer" id="snakeResizer" title="Drag to resize board vs draft log/deep-dive column"></div>
        <div class="cockpit-col panel-scroll">
          <div class="seclabel">Draft Log — <span id="snakeLogTurn"></span></div>
          <div id="snakeDraftLog"></div>
          <div class="seclabel" style="margin-top:14px;">Player Deep Dive</div>
          <div class="deepDiveArea" id="deepDiveArea"></div>
        </div>
      </div>

      <div id="rostersByTeamArea"></div>

      <div id="liveDraftPullArea"></div>

      <div class="foot" id="foot"></div>
    </div>

    <div id="auctionDraftUI" style="display:none;"></div>
  </div>

  <!-- HISTORY VIEW -->
  <div id="historyView" style="display:none;"></div>

  <!-- REPLAY VIEW -->
  <div id="replayView" style="display:none;"></div>

  <!-- PLAYERS VIEW (standalone) -->
  <div id="playersView" style="display:none;"></div>

  <!-- PREP VIEW (Kepners/Miami: Draft Order, Owner Profiles, Keeper Grades) -->
  <div id="prepView" style="display:none;"></div>
</div>

<footer class="site-foot">
  Fantasy data provided by <a href="https://sports.yahoo.com/fantasy/" target="_blank" rel="noopener">Yahoo Fantasy</a>.
</footer>

<script>
let DATA=null, ZHIST=null, ZDRAFTS=null, ZGRADES=null, BIDCAL=null, ROPT=null, KEPA=null, KEPG=null, activeLeague='kepners', activeMode='draft';

// Predicted keepers, keyed by league. Each league has its own file and its own
// prediction script, since keeper rules differ (Kepners: cost -2; Miami: cost
// -3 plus a 2026 UDFA rule at a 13th). Regenerated yearly, not by a workflow.
let KEEPER_SUGGESTIONS = {};
// Back-compat alias: existing code paths reference KEPS for Kepners.
let KEPS = null;

// Shared player-table state -- used by BOTH the standalone Players tab and the
// in-cockpit table toggle, so filters/sort persist as you move between them.
// Session-only (plain object, resets on full page reload) per design choice.
let playerTable = {
  query: '', posFilter: 'ALL', availFilter: 'ALL',
  sortKey: 'projectedWar', sortDir: 'desc',
};
// In the Zimmer cockpit, whether the middle column shows the position board
// ('board') or the full searchable table ('table').
let cockpitCol2Mode = 'board';

// Snake-league (Kepners/Miami) cockpit state: which player is selected for the
// Deep Dive, and whether the board is tier-grouped or flat.
// picks: live manual pick log for snake drafts. Mirrors zimmerDraft.picks
// (the auction equivalent) so both cockpits feed the same drafted-state
// plumbing. Session-only by design -- a page reload clears it, same as the
// auction log, since a half-remembered draft state is worse than none.
// Each entry: {name, pos, playerId, overall, round, pickInRound, team, isMine}
let snakeDraft = { selectedPlayerId: null, boardMode: 'board', picks: [] };

// Replay mode state
let replay = {
  season: null, myOwner: null, timeline: [], teams: {}, idx: 0,
  playing: false, timer: null, speedMs: 1500, started: false,
};

// Auction draft mode state (Zimmer). In-memory only -- resets on page reload.
// This is the manual-tracking fallback described to the user: log your own
// picks as you win them, since live ESPN draft polling isn't wired in yet.
// ASSUMED_BUDGET and ASSUMED_ROSTER are placeholders -- Zimmer has no Team
// sheet in the workbook (unlike Kepners/Miami) so we don't have its real
// roster construction on file. Correct these if they don't match reality.
const ASSUMED_BUDGET = 200;
const ASSUMED_ROSTER = ['QB','RB','RB','WR','WR','WR','TE','FLEX','DEF','K','BEN','BEN','BEN','BEN','BEN','BEN'];

// Kepners 2026 divisions (drawn 2026-08-12). Keyed on the same `manager`
// string used everywhere else in the app (bigboard.json teams[].manager),
// not the casual nickname Sean uses in conversation -- e.g. Sean calls these
// owners "Joe" and "McGann", but the site (Owner Profiles, Draft Order,
// Keeper Grades) has always displayed them as "Berdine" and "Mike/Brad" per
// kepners_team_aliases.json. Kept consistent with that here.
// Confirmed with Sean: Mark = Neary, Pat = Ditto (he goes by "Dittoe"
// casually; the manager field stays "Ditto" to match every other file/table
// in the project -- kepners_team_aliases.json, bigboard.json,
// kepners_analysis.json all use that spelling).
const KEPNERS_DIVISIONS = [
  { name: 'Group 1', managers: ['Mullins', 'Berdine', 'Matty', 'Mike/Brad'] },
  { name: 'Group 2', managers: ['Scott', 'Neary', 'Ditto', 'Weber'] },
  { name: 'Group 3', managers: ['Mikey', 'Bobby', 'Steve', 'Greene'] },
];

let zimmerDraft = {
  picks: [],          // {name, position, cost, isMine, owner} -- ALL draft picks
  searchQuery: '',
  selectedPlayerId: null,
};

// Opponent roster/budget assumptions. Zimmer has no Team sheet in the workbook,
// so these mirror ASSUMED_BUDGET/ASSUMED_ROSTER. Owner list is pulled live from
// zimmer_analysis.json (the real owners we have tendency data for) at render time.
function getOpponentOwners(){
  if(!ZHIST || !ZHIST.owners) return [];
  // Exclude "me" -- we track our own budget separately in the banner.
  return ZHIST.owners.map(o=>o.owner);
}

// Best-effort match of a free-text logged name to a Big Board player, so the
// position board can mark them drafted. Same lightweight normalization idea
// as convert_bigboard.py's name matching (lowercase, trim) -- good enough for
// live-draft speed-typing; unmatched names just won't highlight on the board.
function findBigBoardPlayer(name){
  const norm = s => (s||'').toLowerCase().replace(/[.''\-]/g,'').trim();
  const target = norm(name);
  return DATA.players.find(p=>norm(p.name)===target);
}

// Mirrors zimmer_analysis.py's TIER_SIZES / tier_label EXACTLY -- if you tune
// one, tune the other, or Expected Bid Range lookups will silently mismatch.
const TIER_SIZES = {
  QB: [4,4,4], RB: [12,12,12,12], WR: [12,12,12,12], TE: [4,4,4], K: [12], DEF: [12],
};
function tierLabelForRank(position, rankWithinPos){ // rankWithinPos is 0-indexed
  const sizes = TIER_SIZES[position] || [12,12,12,12,12];
  let start = 1;
  for(let i=0;i<sizes.length;i++){
    const size = sizes[i];
    const end = start + size - 1;
    if(rankWithinPos <= end - 1){
      return size < 12 ? `${position}${start}-${end}` : `${position}${i+1}`;
    }
    start = end + 1;
  }
  return `${position}${start}+`;
}

// ---- data load: bigboard.json (+ optional zimmer_analysis.json / zimmer_draft_history.json) ----
async function boot(){
  try{
    const r = await fetch('bigboard.json');
    DATA = await r.json();
  }catch(e){
    document.getElementById('statustxt').textContent='bigboard.json NOT FOUND — run converter';
    return;
  }
  // Zimmer analysis is optional — only present after the analysis workflow runs.
  try{
    const r2 = await fetch('zimmer_analysis.json');
    if(r2.ok) ZHIST = await r2.json();
  }catch(e){ /* history view will show an empty state */ }
  // Zimmer raw draft history — powers Replay mode.
  try{
    const r3 = await fetch('zimmer_draft_history.json');
    if(r3.ok) ZDRAFTS = await r3.json();
  }catch(e){ /* replay view will show an empty state */ }
  // Zimmer draft effectiveness grades — powers the History view's grading section.
  try{
    const r4 = await fetch('zimmer_draft_grades.json');
    if(r4.ok) ZGRADES = await r4.json();
  }catch(e){ /* grading section will show an empty state */ }
  // Static WAR->$ bid calibration — powers the Mission Control Target Bid.
  try{
    const r5 = await fetch('bid_calibration.json');
    if(r5.ok) BIDCAL = await r5.json();
  }catch(e){ /* target bid will show as unavailable */ }
  // Roster optimizer output — powers the History view's "Optimal Roster" section.
  try{
    const r6 = await fetch('roster_optimizer_result.json');
    if(r6.ok) ROPT = await r6.json();
  }catch(e){ /* section will show an empty state */ }
  // Kepners owner drafting profiles — powers the Draft view's "Owner Profiles" section.
  try{
    const r7 = await fetch('kepners_analysis.json');
    if(r7.ok) KEPA = await r7.json();
  }catch(e){ /* section will show an empty state */ }
  // Kepners keeper value grades — powers the Draft view's "Keeper Value" table.
  try{
    const r8 = await fetch('kepners_draft_grades.json');
    if(r8.ok) KEPG = await r8.json();
  }catch(e){ /* section will show an empty state */ }

  // Kepners predicted keepers (from last season's rosters) -- fills in until
  // a manager's real keepers are confirmed in the Google Sheet. Regenerated
  // once per year from the prior season's final-rosters export; see the
  // methodology/source_note fields inside the file itself.
  try{
    const r9 = await fetch('kepners_suggested_keepers.json');
    if(r9.ok){ KEPS = await r9.json(); KEEPER_SUGGESTIONS.kepners = KEPS; }
  }catch(e){ /* Draft Order table just won't show amber suggestions */ }

  try{
    const r10 = await fetch('miami_suggested_keepers.json');
    if(r10.ok) KEEPER_SUGGESTIONS.miami = await r10.json();
  }catch(e){ /* Miami just won't show suggestions */ }

  computeSeanOverallRanks();
  renderLeagueTabs();
  wireModes();
  render();
}

// VBD-style overall Target Rank: order ALL Sean-ranked players across positions
// by their value over replacement (projected WAR), so a QB1 and RB1 interleave
// by how much value each adds above its position's replacement level -- the
// standard value-based-drafting approach, rather than a naive position-number
// sort. Players Sean hasn't ranked (seanPosRank 0/null) get no overall rank.
// Falls back to seanPosRank ordering within position if WAR is unavailable,
// so it still produces a sensible ordering before ESPN projections are pulled.
function computeSeanOverallRanks(){
  if(!DATA || !DATA.players) return;
  const ranked = DATA.players.filter(p=>p.seanPosRank && p.seanPosRank>0);
  // Primary sort key: projectedWar desc (true VBD). Fallback when WAR missing:
  // a synthetic value = -(seanPosRank) scaled per position so higher pos rank
  // sorts earlier, with QB/TE nudged down slightly to mimic typical VBD
  // (single-QB league replacement is shallow). This only matters pre-projections.
  const POS_FALLBACK_WEIGHT = {RB:1.0, WR:1.0, QB:0.6, TE:0.7, K:0.2, DEF:0.2};
  const val = p => {
    if(p.projectedWar!=null) return p.projectedWar;
    const w = POS_FALLBACK_WEIGHT[p.pos] ?? 0.5;
    return -(p.seanPosRank) * (1/w); // less negative = ranked better
  };
  ranked.sort((a,b)=> val(b)-val(a));
  ranked.forEach((p,i)=>{ p.seanRankOverall = i+1; });
  // ensure unranked players explicitly carry null (not stale)
  DATA.players.forEach(p=>{ if(!(p.seanPosRank>0)) p.seanRankOverall = null; });
}

// ---------- recommendation engine (v1 heuristic) ----------
// Score = your-rank priority + positional need bump + scarcity-before-turn.
// Live draft state (drafted[], myRoster) is empty in mock mode; wire the
// proxy poll here later — everything below already reacts to it.
function computeRecs(lg){
  const drafted=new Set();            // playerIds already gone (from live feed)
  const rosterCounts={};              // your filled counts by position
  const need=neededPositions(lg,rosterCounts);
  const pool=DATA.players
    .filter(p=>p.pos!=='NA' && p.seanPosRank!=null && !drafted.has(p.id))
    .map(p=>{
      let score=1000-(p.avgRank||300);           // consensus baseline
      if(need.has(p.pos)) score+=120;            // fills a need
      if(p.tierGroup==='avoid') score-=400;
      if(p.tierGroup==='handcuff') score-=150;
      if(typeof p.myDiff==='number') score+=p.myDiff*4; // you rate above ADP
      // keeper lock: if a player is kept in THIS league, remove from pool
      if(lg.keepers.some(k=>k.playerId===p.id)) score=-1e9;
      return {...p,_score:score};
    })
    .filter(p=>p._score>-1e8)
    .sort((a,b)=>b._score-a._score);
  return {pool,need};
}

function neededPositions(lg,counts){
  // crude v1: any starter slot type not yet filled is a need
  const starters=lg.rosterSlots.filter(s=>!['BEN','K','DEF'].includes(s));
  const need=new Set();
  starters.forEach(s=>{ const key=s==='FLEX'?'RB':s; if(!(counts[key]>0)) need.add(key); });
  return need;
}

// inferred from the league name. Zimmer ran auctions for years and is snake
// for 2026, but may well switch back -- so the auction cockpit stays fully
// intact and simply activates whenever a league's format is "auction".
// Flipping a league between formats is a one-word change in league_rules.json
// with no code edit required.
function leagueFormat(lg){
  return (lg && lg.rules && lg.rules.format) || 'snake';
}

  return leagueFormat(DATA && DATA.leagues && DATA.leagues[activeLeague]) === 'auction';

// 2026 keeper value grades: forward-looking (the season hasn't been played, so
// there's no actual WAR yet). For each team's live 2026 keepers (from the
// Google Sheet sync), compare the keeper's ROUND COST to where that player is
// projected to be drafted this year (consensus rank -> round). Keeping a player
// well before their market round = value; keeping them at/after it = a reach.
// This is distinct from the "2025 Keeper Value Grades" below, which grade last
// season's keepers on ACTUAL production.
//
// Returns null when there's nothing to grade yet (no suggestions file, or no
// team has a keeper logged/predicted) -- callers render their own empty-state
// message in that case. Split out from render2026KeeperGrades so the
// Group/Owner Keeper Value rollup can consume the identical graded list
// without recomputing peer pools twice.
function compute2026KeeperGrades(lg){
  // Any league with a suggestions file (Kepners, Miami) -- not Kepners-only.
  const SUG = KEEPER_SUGGESTIONS[activeLeague];
  if(!SUG) return null;

  // Merge real (Google Sheet) keepers with suggested (predicted) ones, same
  // per-manager priority as the Draft Order table and the availability map:
  // real always wins; suggestions only fill in where a manager has no real
  // keeper entered yet. This lets the grades populate immediately instead of
  // waiting on every manager to confirm -- accuracy improves automatically
  // as real picks replace suggestions, no re-work needed here.
  const teamsWithKeepers = [];
  (lg.teams||[]).forEach(t=>{
    const real = t.liveKeepers||[];
    const suggested = (SUG && SUG.by_manager && SUG.by_manager[t.manager]) || [];
    if(real.length){
      teamsWithKeepers.push({...t, _keepers: real.map(k=>({...k, _isSuggested:false}))});
    } else if(suggested.length){
      // A suggestion entry can be flagged confirmed (a manager has told us
      // their real picks even though there's no sheet sync for this league --
      // e.g. Miami's J White). Those render green like synced keepers.
      teamsWithKeepers.push({...t, _keepers: suggested.map(k=>({...k, _isSuggested: !k.confirmed}))});
    }
  });

  if(!teamsWithKeepers.length) return null;
  const teamCount = lg.teams.length || 12;
  const rankToRound = (rank)=> rank!=null ? Math.floor((rank-1)/teamCount)+1 : null;

  // Build a same-position, round-indexed peer pool from the WHOLE Big Board
  // (there's no 2026 draft yet to pull real picks from, so every rostered
  // Big Board player at a position stands in for "what a pick at this cost
  // would typically return"). Mirrors kepners_draft_grades.py's
  // peer_avg_war() widening-window logic exactly, just swapping actual_war
  // (past results) for projectedWar (forward-looking).
  const PEER_WINDOW_START = 0, PEER_WINDOW_MAX = 6, MIN_PEER_SAMPLE = 5;
  // League-specific WAR: an 8-team league leaves better players on waivers, so
  // the same player is worth less above replacement there. Falls back to the
  // flat baseline if bigboard.json predates the per-league change.
  const warOf = (p)=> (p.warByLeague && p.warByLeague[activeLeague]!=null)
    ? p.warByLeague[activeLeague] : p.projectedWar;
  const byPositionRound = {};
  DATA.players.forEach(p=>{
    if(warOf(p)==null) return;
    const r = rankToRound(p.avgRank);
    if(r==null) return;
    (byPositionRound[p.pos] = byPositionRound[p.pos] || {});
    (byPositionRound[p.pos][r] = byPositionRound[p.pos][r] || []).push(warOf(p));
  });
  function peerAvgWar(position, round_){
    const byRound = byPositionRound[position] || {};
    for(let w=PEER_WINDOW_START; w<=PEER_WINDOW_MAX; w++){
      const wars = [];
      Object.keys(byRound).forEach(r=>{
        if(Math.abs(Number(r)-round_)<=w) wars.push(...byRound[r]);
      });
      if(wars.length>=MIN_PEER_SAMPLE){
        return {avg: wars.reduce((a,b)=>a+b,0)/wars.length, n: wars.length, w};
      }
    }
    // last attempt at max window even if still thin
    const wars = [];
    Object.keys(byRound).forEach(r=>{
      if(Math.abs(Number(r)-round_)<=PEER_WINDOW_MAX) wars.push(...byRound[r]);
    });
    return wars.length ? {avg: wars.reduce((a,b)=>a+b,0)/wars.length, n: wars.length, w:PEER_WINDOW_MAX} : {avg:null, n:0, w:null};
  }

  // Keeper Value = Surplus * (WAR / 100) * 0.5
  // Confirmed with Sean: the 100 is a FLAT constant across all positions
  // (not each position's own top WAR) -- it approximates the WAR spread of
  // an elite difference-maker at any position, so an elite TE (whose
  // position ceiling is naturally much lower than RB/WR) doesn't get an
  // artificial boost just for being close to ITS OWN position's max. This
  // means keeping the best TE in the league is correctly rated as less
  // impactful than keeping an elite RB/WR, matching how much more a great
  // RB/WR actually moves a championship roster.
  //
  // The WAR multiplier is what makes this different from a pure surplus
  // ranking: a low-WAR player at a huge round-cost discount (e.g. a
  // replacement-level RB kept in round 13) gets multiplied down toward zero,
  // since war/100 is tiny -- so a big bargain on a mediocre player can't
  // outrank a real difference-maker's smaller-percentage discount. Verified
  // against Amon-Ra St. Brown (elite WAR, but kept round 1 = no discount):
  // his surplus is ~0 since he's compared against his true round-1 peers,
  // so Keeper Value lands right around 0 too -- a fair value, not a great
  // one, which is the correct read since there was no draft-cost advantage
  // to keeping him specifically.
  const KEEPER_VALUE_WAR_CONST = 100;
  const KEEPER_VALUE_WEIGHT = 1;

  const graded = [];
  teamsWithKeepers.forEach(t=>{
    t._keepers.forEach(k=>{
      const bp = findBigBoardPlayer(k.player);
      const keeperRound = k.round;
      const projWar = bp ? warOf(bp) : null;
      const projRound = bp ? rankToRound(bp.avgRank) : null;
      let peer=null, surplus=null, keeperValue=null, verdict, cls;
      if(!bp){ verdict='player not on board'; cls='na'; }
      else if(projWar==null || keeperRound==null){ verdict='no WAR projection'; cls='na'; }
      else {
        peer = peerAvgWar(bp.pos, keeperRound);
        if(peer.avg==null){ verdict='insufficient peer data'; cls='na'; }
        else {
          surplus = Math.round((projWar - peer.avg)*10)/10;
          // VALUE FLOOR (critical -- see project notes): Keeper Value
          // multiplies surplus by WAR, so when WAR is <=0 a NEGATIVE surplus
          // (correctly reading "below peers") flips the sign and produces a
          // large POSITIVE Keeper Value -- a projected bust reading as a
          // great keep. Don't compute Keeper Value at all in that case; a
          // player projected at/below replacement has no keeper value
          // regardless of how the cost math reads. Always floor before
          // multiplying by a signed quantity.
          if(projWar<=0){ verdict='no value (proj. WAR ≤ 0)'; cls='fair'; }
          else {
          keeperValue = Math.round(surplus * (projWar/KEEPER_VALUE_WAR_CONST) * KEEPER_VALUE_WEIGHT * 10)/10;
          // Tier cutoffs doubled from the original 0.5-weighted values --
          // removing the flat 0.5 multiplier doubles every score uniformly,
          // so cutoffs double too (same players, same tiers, new number line).
          // Tier cutoffs are derived per league from that league's own Keeper
          // Value distribution (bigboard.json -> keeperValueTiers). Keeper
          // Value scales with league depth, so reusing 12-team thresholds in
          // an 8-team league would read "fair" for essentially every keeper.
          const T = lg.keeperValueTiers || {elitePlus:160, elite:70, great:20, good:4, fairFloor:-6};
          if(keeperValue>=T.elitePlus){ verdict='elite value+'; cls='eliteplus'; }
          else if(keeperValue>=T.elite){ verdict='elite value'; cls='elite'; }
          else if(keeperValue>=T.great){ verdict='great value'; cls='great'; }
          else if(keeperValue>=T.good){ verdict='good value'; cls='good'; }
          else if(keeperValue>T.fairFloor){ verdict='fair'; cls='fair'; }
          else { verdict='reach'; cls='overpriced'; }
          }
        }
      }
      graded.push({
        manager:t.manager, team:t.team||t.manager, player:k.player,
        pos: bp?bp.pos:'—', keeperRound, projWar, projRound,
        peerAvgWar: peer?peer.avg:null, peerN: peer?peer.n:null, peerWindow: peer?peer.w:null,
        surplus, keeperValue, verdict, cls, isSuggested: !!k._isSuggested,
      });
    });
  });
  // Sort directly on Keeper Value -- the formula itself already balances
  // absolute production against cost, so no separate tier-then-tiebreak
  // step is needed the way the old WAR-primary approach required.
  graded.sort((a,b)=>{
    if(a.keeperValue==null && b.keeperValue==null) return 0;
    if(a.keeperValue==null) return 1;
    if(b.keeperValue==null) return -1;
    return b.keeperValue - a.keeperValue;
  });

  const suggestedCount = graded.filter(g=>g.isSuggested).length;
  return { graded, suggestedCount };
}

  if(!el) return;

    el.innerHTML = `<div class="seclabel">2026 Keeper Value Grades</div>

      Run "Update Kepners Draft Order" to pull keepers from the Google Sheet.<br>
      <span class="pt-warsrc">WAR/consensus rank will be calculated based on 2026 ESPN Projections.</span></div>`;
    return;
  }
  const { graded, suggestedCount } = kv2026;

  const rows = graded.map(g=>`
    <tr class="${g.isSuggested?'kg-suggested-row':''}">
      <td>${g.manager}</td>
      <td>${g.player}${g.isSuggested?` <span class="do-keeper-suggested" title="Predicted -- not yet confirmed in the Google Sheet">*</span>`:''}</td>
      <td>${g.pos}</td>
      <td class="num">R${g.keeperRound ?? '—'}</td>
      <td class="num">${g.projRound!=null?'R'+g.projRound:'—'}</td>
      <td class="num">${g.projWar!=null?(g.projWar>0?'+':'')+g.projWar:'—'}</td>
      <td class="num">${g.peerAvgWar!=null?`${g.peerAvgWar>0?'+':''}${Math.round(g.peerAvgWar*10)/10} <span class="pt-sub">n=${g.peerN}, ±${g.peerWindow}rd</span>`:'—'}</td>
      <td class="num">${g.surplus!=null?(g.surplus>0?'+':'')+g.surplus:'—'}</td>
      <td class="num">${g.keeperValue!=null?(g.keeperValue>0?'+':'')+g.keeperValue:'—'}</td>
      <td><span class="kg-verdict ${g.cls}">${g.verdict}</span></td>
    </tr>`).join('');

  el.innerHTML = `<div class="seclabel">2026 Keeper Value Grades
    <span style="font-size:9px;color:var(--dim);font-weight:400;">— your league's kept players</span></div>
    <div style="font-size:9px;color:var(--dim);margin-bottom:8px;line-height:1.5;">
      <span class="pt-warsrc">WAR calculated based on 2026 ESPN Projections (2025 grades below use actual results instead).</span><br>
      <b>Keeper Value = Surplus × (Proj WAR ÷ 100)</b> -- the WAR factor keeps a big discount on a
      mediocre player (huge surplus, low WAR) from outranking a real difference-maker: a bargain only
      counts for much if the player himself is actually good. The 100 is a flat constant across all
      positions (not each position's own ceiling), so an elite TE's naturally lower ceiling doesn't let
      it out-rank an elite RB/WR the way a per-position scale would.
      ${suggestedCount?` <span class="do-keeper-suggested">${suggestedCount} row(s) marked * use a predicted keeper, not yet confirmed.</span>`:''}
    </div>
    <table class="kgTable"><thead><tr>
      <th>Manager</th><th>Player</th><th>Pos</th><th class="num">Keeper Rd</th><th class="num">Proj. Rd</th>
      <th class="num">Proj WAR</th><th class="num">Peer Avg WAR</th><th class="num">Surplus</th>
      <th class="num">Keeper Value</th><th>Verdict</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

// Group/Owner Keeper Value rollup (Kepners only -- divisions were drawn for
// Kepners' 2026 season; Miami/Zimmer have no divisions on file). Sums each
// owner's 2026 Keeper Value across their keeper picks, then sums owners'
// totals up to their division (KEPNERS_DIVISIONS). Ungraded keepers
// (keeperValue null -- e.g. "player not on board") contribute 0 to the sum
// but are called out separately so a $0 total isn't mistaken for "no value"
// when it's really "couldn't be graded yet".
function renderGroupKeeperValue(lg, kv2026){
  const el = document.getElementById('groupValueArea');
  if(!el) return;
  if(activeLeague!=='kepners'){ el.innerHTML=''; return; }
  if(!kv2026){
    el.innerHTML = `<div class="seclabel">Keeper Value by Group</div>
      <div class="empty-note">No 2026 keepers synced or predicted yet -- nothing to roll up.</div>`;
    return;
  }

  // Per-manager totals from the same graded list the table above renders.
  const byManager = {};
  kv2026.graded.forEach(g=>{
    const m = byManager[g.manager] = byManager[g.manager] || { total:0, graded:0, ungraded:0, team:g.team };
    if(g.keeperValue!=null){ m.total += g.keeperValue; m.graded++; }
    else { m.ungraded++; }
  });

  const groups = KEPNERS_DIVISIONS.map(div=>{
    const owners = div.managers.map(m=>{
      const d = byManager[m];
      return {
        manager: m,
        team: d ? d.team : (lg.teams.find(t=>t.manager===m)||{}).team,
        total: d ? Math.round(d.total*10)/10 : 0,
        graded: d ? d.graded : 0,
        ungraded: d ? d.ungraded : 0,
      };
    }).sort((a,b)=>b.total-a.total);
    const groupTotal = Math.round(owners.reduce((s,o)=>s+o.total,0)*10)/10;
    return { name: div.name, owners, groupTotal };
  }).sort((a,b)=>b.groupTotal-a.groupTotal);

  const groupBlocks = groups.map(g=>`
    <table class="kgTable gvTable"><thead><tr>
      <th>${g.name}</th><th>Team</th><th class="num">Keepers Graded</th><th class="num">Total Keeper Value</th>
    </tr></thead><tbody>
      ${g.owners.map(o=>`
        <tr>
          <td>${o.manager}</td>
          <td class="pt-sub">${o.team||'—'}</td>
          <td class="num">${o.graded}${o.ungraded?` <span class="pt-sub">(+${o.ungraded} ungraded)</span>`:''}</td>
          <td class="num">${o.total>0?'+':''}${o.total}</td>
        </tr>`).join('')}
      <tr class="gv-total-row">
        <td colspan="3">Group Total</td>
        <td class="num">${g.groupTotal>0?'+':''}${g.groupTotal}</td>
      </tr>
    </tbody></table>`).join('');

  el.innerHTML = `<div class="seclabel">Keeper Value by Group
    <span style="font-size:9px;color:var(--dim);font-weight:400;">— divisions drawn 2026-08-12</span></div>
    <div style="font-size:9px;color:var(--dim);margin-bottom:8px;line-height:1.5;">
      Sums each owner's 2026 Keeper Value (see table above) across both their keeper picks, then sums
      owners up to their division. Ungraded keepers (no Big Board match / no WAR projection / insufficient
      peer data) count as 0 toward the total and are flagged separately rather than silently folded in.
    </div>
    ${groupBlocks}`;
}

function renderSnakeBanner(lg){
  const el = document.getElementById('snakeBanner');
  if(!el) return;
  const myTeamObj = lg.teams.find(t=>t.isMe);
  const myPos = myTeamObj && myTeamObj.draftPosition!=null ? myTeamObj.draftPosition : null;
  const teams = lg.teams.length;
  const roster = lg.rosterSlots || [];
  // my roster fill from keepers (live draft logging isn't wired for snake yet;
  // keepers are the only locked picks we know pre-draft)
  const myKeepers = (myTeamObj && myTeamObj.liveKeepers) ? myTeamObj.liveKeepers.length : 0;
  const myLogged = snakeDraft.picks.filter(p=>p.isMine).length;
  const nextOverall = snakeDraft.picks.length + 1;
  const next = snakePickLabel(nextOverall, teams);
  const chips = [
    myPos!=null ? {v:`#${myPos}`, l:'MY DRAFT SLOT'} : {v:'—', l:'MY DRAFT SLOT'},
    {v:teams, l:'TEAMS'},
    {v:`${myKeepers+myLogged}/${roster.length}`, l:'MY ROSTER'},
    {v:snakeDraft.picks.length, l:'PICKS LOGGED'},
    {v:teams?next.label:'—', l:'NEXT PICK'},
  ];
  el.innerHTML = `<div class="cockpit-banner">
    ${chips.map(c=>`<div class="budget-chip"><div class="bc-val">${c.v}</div><div class="bc-lbl">${c.l}</div></div>`).join('')}
  </div>`;
}

// ---- Snake live pick log (manual entry) --------------------------------
// Snake order: odd rounds run slot 1..N, even rounds reverse (N..1).
function snakeSlotForOverall(overall, teams){
  if(!teams) return null;
  const round = Math.floor((overall-1)/teams)+1;
  const idxInRound = ((overall-1) % teams)+1;
  return (round % 2 === 1) ? idxInRound : (teams - idxInRound + 1);
}
function snakePickLabel(overall, teams){
  if(!teams) return {round:null, pickInRound:null, label:`#${overall}`};
  const round = Math.floor((overall-1)/teams)+1;
  const pickInRound = ((overall-1) % teams)+1;
  return {round, pickInRound, label:`${round}.${String(pickInRound).padStart(2,'0')}`};
}

// Pick numbers are POSITIONAL, not stored per pick: overall/round/label are
// all derived from a pick's index in the array. So any insert or delete has
// to renumber everything after it, or the log silently disagrees with the
// snake order (and My Team / Deep Dive read the wrong round).
// Owner (team/isMine) is deliberately NOT recomputed -- it's explicitly
// recorded per pick, and after a mid-draft correction the recorded owner is
// the truth, not whatever the snake order would predict.
function renumberSnakePicks(teams){
  snakeDraft.picks.forEach((p,i)=>{
    const info = snakePickLabel(i+1, teams);
    p.overall = i+1;
    p.round = info.round;
    p.pickInRound = info.pickInRound;
    p.label = info.label;
  });
}

function renderSnakeDraftLog(lg){
  const el = document.getElementById('snakeDraftLog');
  if(!el) return;
  const teams = lg.teams.length;
  const nextOverall = snakeDraft.picks.length + 1;
  const {round, pickInRound, label} = snakePickLabel(nextOverall, teams);
  const onClockSlot = snakeSlotForOverall(nextOverall, teams);
  // Draft slots may not be drawn yet (Zimmer's are null pre-draft), in which
  // case we can't say who's on the clock -- show the pick number only rather
  // than guessing at a team.
  const onClockTeam = onClockSlot!=null ? lg.teams.find(t=>t.slot===onClockSlot) : null;

  const turnEl = document.getElementById('snakeLogTurn');
  if(turnEl){
    turnEl.textContent = teams
      ? `next: ${label} (overall ${nextOverall})${onClockTeam?` · ${onClockTeam.team} on the clock`:''}`
      : 'no teams configured';
  }

  // Autocomplete from players not already logged/kept, so you can't easily
  // log someone twice and typos surface immediately.
  const takenIds = new Set(snakeDraft.picks.map(p=>p.playerId).filter(Boolean));
  const avail = DATA.players
    .filter(p=>p.pos && p.pos!=='NA' && !takenIds.has(p.id))
    .slice(0, 400);

  // Prefill from whatever's selected on the Player Board, so logging a pick
  // is click-player -> ADD instead of retyping a name that's already on
  // screen. Skipped if that player is already logged, so the box doesn't
  // keep re-offering someone who's off the board.
  const selP = snakeDraft.selectedPlayerId
    ? DATA.players.find(p=>p.id===snakeDraft.selectedPlayerId) : null;
  const prefill = (selP && !takenIds.has(selP.id)) ? selP.name : '';

  const ownerOptions = (p)=>`
    <option value="" ${!p.isMine && !p.team?'selected':''}>— unassigned —</option>
    <option value="__me__" ${p.isMine?'selected':''}>★ Me</option>
    ${lg.teams.filter(t=>!t.isMe).map(t=>
      `<option value="${t.team}" ${!p.isMine && p.team===t.team?'selected':''}>${t.team}</option>`).join('')}`;

  // Newest first (matches how you read a draft board), but data-idx carries
  // the TRUE array index so edit/delete hit the right pick regardless of
  // display order.
  const rows = snakeDraft.picks.map((p,idx)=>({p,idx})).reverse().map(({p,idx})=>`
    <div class="sdl-row ${p.isMine?'mine':''}">
      <span class="sdl-pick">${p.label}</span>
      <span class="sdl-name">${p.name}${p.playerId?'':' <span class="sdl-warn" title="No Big Board match -- this pick will NOT grey out on the board">⚠</span>'}</span>
      <span class="sdl-pos">${p.pos||'—'}</span>
      <select class="sdl-owner ${p.isMine?'mine':''}" data-idx="${idx}" title="Change who made this pick">
        ${ownerOptions(p)}
      </select>
      <button class="sdl-del" data-idx="${idx}" title="Delete this pick (everything after it renumbers)">✕</button>
    </div>`).join('');

  el.innerHTML = `
    <div class="sdl-form">
      <input id="sdlName" list="sdlPlayers" placeholder="Player name..." autocomplete="off" value="${prefill.replace(/"/g,'&quot;')}">
      <datalist id="sdlPlayers">${avail.map(p=>`<option value="${p.name}">`).join('')}</datalist>
      <select id="sdlTeam">
        <option value="">— drafted by —</option>
        <option value="__me__">★ Me</option>
        ${lg.teams.filter(t=>!t.isMe).map(t=>`<option value="${t.team}" ${onClockTeam&&onClockTeam.team===t.team?'selected':''}>${t.team}</option>`).join('')}
      </select>
      <button id="sdlAdd">ADD</button>
      <button id="sdlClear" class="sdl-secondary" ${snakeDraft.picks.length?'':'disabled'}>CLEAR</button>
    </div>
    <div id="sdlMsg" class="sdl-msg">${prefill?`<span class="sdl-prefill">↑ filled from board selection: ${prefill}</span>`:''}</div>
    <div class="sdl-list">${rows||'<div class="sdl-empty">No picks logged yet.</div>'}</div>
    <div class="foot">Log EVERY pick as it happens (not just yours) so the board, My Team and
      Deep Dive stay accurate. Select a player on the board to fill the name automatically.
      Use the dropdown on any row to fix who drafted it, or ✕ to delete a pick from any point
      (later picks renumber). Session-only — a page reload clears the log.</div>`;

  const nameInput = document.getElementById('sdlName');
  const teamSel = document.getElementById('sdlTeam');
  const msg = document.getElementById('sdlMsg');

  function addPick(){
    const raw = nameInput.value.trim();
    if(!raw){ msg.textContent='Enter a player name.'; return; }
    const bp = findBigBoardPlayer(raw);
    const teamVal = teamSel.value;
    const isMine = teamVal === '__me__';
    const overall = snakeDraft.picks.length + 1;
    const info = snakePickLabel(overall, teams);
    snakeDraft.picks.push({
      name: bp ? bp.name : raw,
      pos: bp ? bp.pos : null,
      playerId: bp ? bp.id : null,
      overall, round: info.round, pickInRound: info.pickInRound, label: info.label,
      team: isMine ? (lg.teams.find(t=>t.isMe)||{}).team : (teamVal||null),
      isMine,
    });
    // Clear the board selection once logged, so the prefill doesn't keep
    // re-offering a player who's now taken.
    if(bp && snakeDraft.selectedPlayerId===bp.id) snakeDraft.selectedPlayerId = null;
    // Flag unmatched names loudly -- a typo here means the player silently
    // stays "available" on the board, which is the failure mode that matters.
    msg.textContent = bp ? '' : `"${raw}" didn't match a Big Board player — logged, but it won't grey out on the board.`;
    msg.className = bp ? 'sdl-msg' : 'sdl-msg warn';
    nameInput.value='';
    render();
    const again = document.getElementById('sdlName');
    if(again) again.focus();
  }

  document.getElementById('sdlAdd').onclick = addPick;
  nameInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addPick(); } };
  document.getElementById('sdlClear').onclick = ()=>{
    if(snakeDraft.picks.length && confirm(`Clear all ${snakeDraft.picks.length} logged picks?`)){
      snakeDraft.picks = []; render();
    }
  };

  // Delete any pick, not just the most recent.
  el.querySelectorAll('.sdl-del').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.idx);
      const p = snakeDraft.picks[idx];
      if(!p) return;
      // Only confirm when it's NOT the last pick -- deleting the most recent
      // one is the cheap, common "oops" and shouldn't need a dialog, but
      // removing one from mid-draft renumbers everything after it.
      const isLast = idx === snakeDraft.picks.length - 1;
      if(!isLast && !confirm(`Delete ${p.label} ${p.name}? The ${snakeDraft.picks.length-idx-1} pick(s) after it will renumber.`)) return;
      snakeDraft.picks.splice(idx,1);
      renumberSnakePicks(teams);
      render();
    };
  });

  // Reassign the owner of any past pick in place.
  el.querySelectorAll('.sdl-owner').forEach(sel=>{
    sel.onchange = ()=>{
      const idx = Number(sel.dataset.idx);
      const p = snakeDraft.picks[idx];
      if(!p) return;
      const v = sel.value;
      p.isMine = v === '__me__';
      p.team = p.isMine ? (lg.teams.find(t=>t.isMe)||{}).team : (v || null);
      render();
    };
  });
}

// Rosters-by-team: a side-by-side read of what each team has, purely so a
// manual-entry mistake (wrong owner, missed pick, duplicate) can be spotted
// against the real platform without scrolling the chronological log.
// Includes keepers as well as logged picks, since that's what the platform
// shows on a roster -- a log that matches pick-for-pick can still look wrong
// next to ESPN/Yahoo if keepers aren't accounted for.
function renderRostersByTeam(lg){
  const el = document.getElementById('rostersByTeamArea');
  if(!el) return;
  if(isAuctionLeague()){ el.innerHTML=''; return; }

  const byTeam = new Map();
  (lg.teams||[]).forEach(t=>byTeam.set(t.team, {team:t, keepers:[], picks:[]}));
  // Unassigned picks still need somewhere to show up -- silently dropping
  // them would hide exactly the data-entry mistake this view exists to catch.
  byTeam.set('__unassigned__', {team:{team:'(unassigned)', isMe:false}, keepers:[], picks:[]});

  (lg.teams||[]).forEach(t=>{
    (t.liveKeepers||[]).forEach(k=>{
      const bp = findBigBoardPlayer(k.player);
      const entry = byTeam.get(t.team);
      if(entry) entry.keepers.push({name:k.player, pos:bp?bp.pos:null, round:k.round});
    });
  });
  snakeDraft.picks.forEach(p=>{
    const key = p.team && byTeam.has(p.team) ? p.team : '__unassigned__';
    byTeam.get(key).picks.push(p);
  });

  const cards = [...byTeam.entries()]
    .filter(([key,v])=>key!=='__unassigned__' || v.picks.length)  // hide the unassigned card unless it has something
    .map(([key,v])=>{
      const total = v.keepers.length + v.picks.length;
      const lines = [
        ...v.keepers.map(k=>`<div class="rbt-p"><span class="rbt-lbl rbt-keep">K${k.round??''}</span><span class="rbt-pos">${k.pos||'—'}</span><span class="rbt-nm">${k.name}</span></div>`),
        ...v.picks.map(p=>`<div class="rbt-p"><span class="rbt-lbl">${p.label}</span><span class="rbt-pos">${p.pos||'—'}</span><span class="rbt-nm">${p.name}${p.playerId?'':' <span class="sdl-warn" title="No Big Board match">⚠</span>'}</span></div>`),
      ];
      return `<div class="rbt-card">
        <div class="rbt-team ${v.team.isMe?'mine':''}">
          <span>${v.team.isMe?'★ ':''}${v.team.team}</span><span class="rbt-count">${total}</span>
        </div>
        ${lines.join('') || '<div class="rbt-empty">nothing yet</div>'}
      </div>`;
    }).join('');

  el.innerHTML = `<details class="ds-legend" style="margin-top:10px;">
    <summary>ⓘ Rosters by Team — verify my manual entry against the platform</summary>
    <div style="padding:8px 11px;">
      <div style="font-size:9px;color:var(--dim);line-height:1.5;">
        Keepers (green <b>K</b>) plus every pick logged to that team. Compare against ESPN/Yahoo to catch a
        pick logged to the wrong owner, a missed pick, or a duplicate. A ⚠ means the name didn't match the
        Big Board, so that player is still showing as available on the board.
      </div>
      <div class="rbt-grid">${cards}</div>
    </div>
  </details>`;
}

function renderMyTeam(lg){
  const el = document.getElementById('myTeamArea');
  if(!el) return;
  const myTeamObj = lg.teams.find(t=>t.isMe);
  const roster = lg.rosterSlots || [];
  // Slots fill from keepers PLUS anything logged to me in the live Draft Log,
  // so the panel (and the Deep Dive roster-fit read that depends on it) stays
  // accurate as the draft progresses rather than being frozen pre-draft.
  const myKeepers = (myTeamObj && myTeamObj.liveKeepers) ? [...myTeamObj.liveKeepers] : [];
  const myLogged = snakeDraft.picks
    .filter(p=>p.isMine)
    .map(p=>({player:p.name, round:p.round, _pick:p.label}));
  // Dedupe by normalized name: if a keeper also gets typed into the Draft Log
  // (easy to do -- keepers consume real draft picks in this league), he'd
  // otherwise occupy two roster slots and push a real player off the panel.
  const seen = new Set();
  const remaining = [...myKeepers, ...myLogged].filter(k=>{
    const bp = findBigBoardPlayer(k.player);
    const key = bp ? bp.id : (k.player||'').toLowerCase().trim();
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  const posOf = (k)=>{ const bp = findBigBoardPlayer(k.player); return bp ? bp.pos : null; };
  const cells = roster.map(slot=>({slot, fill:null}));
  // Three passes, in priority order, because a single in-order pass lets an
  // early wildcard slot swallow a player a later dedicated slot needed.
  //
  // BUG FIXED: BEN slots were matched with the same `bp.pos===slot` test used
  // for real position slots -- but "BEN" is not a position, so that test can
  // never be true and every pick past your starters silently vanished from
  // the panel (drafting a 3rd/4th RB appeared to do nothing). BEN now takes
  // any leftover. FLEX was the mirror-image bug: it matched `k=>true`, so it
  // would happily absorb a QB/K/DEF that no real FLEX slot can start.
  cells.forEach(c=>{                                   // 1. dedicated starters
    if(['FLEX','BEN','IR'].includes(c.slot)) return;
    const i = remaining.findIndex(k=>posOf(k)===c.slot);
    if(i>=0) c.fill = remaining.splice(i,1)[0];
  });
  cells.forEach(c=>{                                   // 2. FLEX: RB/WR/TE only
    if(c.slot!=='FLEX') return;
    const i = remaining.findIndex(k=>FLEX_ELIGIBLE.includes(posOf(k)));
    if(i>=0) c.fill = remaining.splice(i,1)[0];
  });
  cells.forEach(c=>{                                   // 3. bench: anything left
    if(c.slot!=='BEN' && c.slot!=='IR') return;
    if(remaining.length) c.fill = remaining.shift();
  });
  // If the roster config has fewer slots than players logged to me, say so
  // rather than dropping them on the floor the way the old code did silently.
  const overflow = remaining.length;
  el.innerHTML = `<div class="myteam-list">
    ${cells.map(c=>`
      <div class="myteam-cell ${c.fill?'filled':''}">
        <span class="mt-slot">${c.slot}</span>
        ${c.fill
          ? `<span class="mt-player">${c.fill.player} <span class="mt-rd">${c.fill._pick?'@'+c.fill._pick:'R'+c.fill.round}</span></span>`
          : `<span class="mt-empty">—</span>`}
      </div>`).join('')}
  </div>
  <div class="foot" style="margin-top:8px;">Slots fill from your keepers plus anything logged to you
    in the Draft Log below. Positional needs here drive the Deep Dive's roster-fit read.
    ${overflow?`<br><span class="sdl-warn">⚠ ${overflow} more player(s) logged to you than this roster has slots
      (${roster.length}) — check for a mis-attributed pick in the Draft Log.</span>`:''}</div>`;
}
