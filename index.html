// ---- Snake live pick log (manual entry) --------------------------------
// Snake order: odd rounds run slot 1..N, even rounds reverse (N..1).
function snakeSlotForOverall(overall, teams){
  if(!teams) return null;
  const round = Math.floor((overall-1)/teams)+1;
  const idxInRound = ((overall-1) % teams)+1;
  return (round % 2 === 1) ? idxInRound : (teams - idxInRound + 1);
}
function snakePickLabel(overall, teams){
  if(!teams) return {round:null, pickInRound:null, label:`#${overall}`};
  const round = Math.floor((overall-1)/teams)+1;
  const pickInRound = ((overall-1) % teams)+1;
  return {round, pickInRound, label:`${round}.${String(pickInRound).padStart(2,'0')}`};
}

// ---------- Keeper-aware draft schedule ----------
// A keeper COSTS its owner that round's pick -- they're not on the clock in
// the round their keeper is priced at. So the real order isn't a clean snake:
// if the round-3 order is [A, B, C] and B has a round-3 keeper, round 3 runs
// A -> C, and every later pick shifts up by one.
//
// The plain snakeSlotForOverall/snakePickLabel above are pure position math
// with no knowledge of keepers, which is why they can't express this. Rather
// than patch each consumer separately (draft log, My Team, Deep Dive, TruRank
// plan all derive picks independently, and would drift apart), this builds ONE
// schedule everything reads from.
//
// Falls back to a plain snake when nothing has a draftPosition (e.g. a league
// whose order isn't drawn yet), so it's safe to call unconditionally.
function buildDraftSchedule(lg){
  const teamList = (lg && lg.teams) || [];
  const teams = teamList.length;
  const rounds = ((lg && lg.rosterSlots) || []).length;
  if(!teams || !rounds) return [];

  // slot -> Set of rounds consumed by that team's keepers.
  // A Set dedupes the pathological case of two keepers priced at the same
  // round for one team -- they only ever forfeit the one pick that exists.
  const consumed = new Map();
  teamList.forEach(t=>{
    if(t.draftPosition==null) return;
    const set = new Set();
    resolvedKeepers(t).forEach(k=>{
      const r = Number(k.round);
      if(Number.isFinite(r) && r>=1 && r<=rounds) set.add(r);
    });
    consumed.set(t.draftPosition, set);
  });

  const sched = [];
  for(let r=1; r<=rounds; r++){
    for(let i=1; i<=teams; i++){
      const slot = (r % 2 === 1) ? i : (teams - i + 1);   // snake
      if((consumed.get(slot) || new Set()).has(r)) continue;  // keeper takes this pick
      sched.push({round:r, slot, team: teamList.find(t=>t.draftPosition===slot) || null});
    }
  }
  // Number the picks that ACTUALLY happen. pickInRound counts real picks only,
  // so a round where someone was skipped runs 1..N-1 rather than leaving a gap.
  const perRound = {};
  sched.forEach((s,i)=>{
    perRound[s.round] = (perRound[s.round]||0) + 1;
    s.pickInRound = perRound[s.round];
    s.overall = i+1;
    s.label = `${s.round}.${String(s.pickInRound).padStart(2,'0')}`;
  });
  return sched;
}

// The schedule entry for the Nth overall pick (1-based). Falls back to plain
// snake math past the end of the schedule so a mis-logged extra pick can't
// crash the log.
function scheduleAt(lg, overall){
  const sched = buildDraftSchedule(lg);
  if(!sched.length || overall<1 || overall>sched.length){
    const teams = ((lg&&lg.teams)||[]).length;
    const info = snakePickLabel(overall, teams);
    return {...info, slot: snakeSlotForOverall(overall, teams), team:null, overall};
  }
  return sched[overall-1];
}

// Pick numbers are POSITIONAL, not stored per pick: overall/round/label are
// all derived from a pick's index in the array. So any insert or delete has
// to renumber everything after it, or the log silently disagrees with the
// snake order (and My Team / Deep Dive read the wrong round).
// Owner (team/isMine) is deliberately NOT recomputed -- it's explicitly
// recorded per pick, and after a mid-draft correction the recorded owner is
// the truth, not whatever the snake order would predict.
function renumberSnakePicks(lg){
  // Uses the keeper-aware schedule, not raw snake math: deleting a pick
  // mid-draft has to renumber against the SAME order the log is filling, or
  // labels drift out of sync with who was actually on the clock.
  snakeDraft.picks.forEach((p,i)=>{
    const info = scheduleAt(lg, i+1);
    p.overall = i+1;
    p.round = info.round;
    p.pickInRound = info.pickInRound;
    p.label = info.label;
  });
}

function renderSnakeDraftLog(lg){
  const el = document.getElementById('snakeDraftLog');
  if(!el) return;
  const teams = lg.teams.length;
  const nextOverall = snakeDraft.picks.length + 1;
  // Keeper-aware: an owner whose keeper is priced at this round is skipped
  // entirely, so the schedule -- not raw snake math -- decides who's up.
  const nextEntry = scheduleAt(lg, nextOverall);
  const {round, pickInRound, label} = nextEntry;
  const onClockSlot = nextEntry.slot;
  // Draft slots may not be drawn yet (Zimmer's are null pre-draft), in which
  // case we can't say who's on the clock -- show the pick number only rather
  // than guessing at a team.
  // `slot` here is draftPosition, NOT the Big Board Excel column index also
  // confusingly called `slot` on team objects (col - 4 in convert_bigboard.py,
  // which is reused for roster-position slots like QB/RB/BEN). Comparing
  // against the wrong one made "on the clock" disagree with the rest of the app.
  const onClockTeam = nextEntry.team
    || (onClockSlot!=null ? lg.teams.find(t=>t.draftPosition===onClockSlot) : null);
  // Who, if anyone, was skipped this round because a keeper consumed their pick.
  const skippedThisRound = (lg.teams||[]).filter(t=>
    t.draftPosition!=null && resolvedKeepers(t).some(k=>Number(k.round)===round));

  const turnEl = document.getElementById('snakeLogTurn');
  if(turnEl){
    turnEl.textContent = teams
      ? `next: ${label} (overall ${nextOverall})${onClockTeam?` · ${onClockTeam.team} on the clock`:''}`
        + (skippedThisRound.length
            ? ` · R${round} keeper skip: ${skippedThisRound.map(t=>t.team).join(', ')}`
            : '')
      : 'no teams configured';
  }

  // Autocomplete from players not already logged/kept, so you can't easily
  // log someone twice and typos surface immediately.
  const takenIds = new Set(snakeDraft.picks.map(p=>p.playerId).filter(Boolean));
  const avail = DATA.players
    .filter(p=>p.pos && p.pos!=='NA' && !takenIds.has(p.id))
    .slice(0, 400);

  // Prefill from whatever's selected on the Player Board, so logging a pick
  // is click-player -> ADD instead of retyping a name that's already on
  // screen. Skipped if that player is already logged, so the box doesn't
  // keep re-offering someone who's off the board.
  const selP = snakeDraft.selectedPlayerId
    ? DATA.players.find(p=>p.id===snakeDraft.selectedPlayerId) : null;
  const prefill = (selP && !takenIds.has(selP.id)) ? selP.name : '';

  const ownerOptions = (p)=>`
    <option value="" ${!p.isMine && !p.team?'selected':''}>— unassigned —</option>
    <option value="__me__" ${p.isMine?'selected':''}>★ Me</option>
    ${lg.teams.filter(t=>!t.isMe).map(t=>
      `<option value="${t.team}" ${!p.isMine && p.team===t.team?'selected':''}>${t.team}</option>`).join('')}`;

  // Newest first (matches how you read a draft board), but data-idx carries
  // the TRUE array index so edit/delete hit the right pick regardless of
  // display order.
  const rows = snakeDraft.picks.map((p,idx)=>({p,idx})).reverse().map(({p,idx})=>`
    <div class="sdl-row ${p.isMine?'mine':''}">
      <span class="sdl-pick">${p.label}</span>
      <span class="sdl-name">${p.name}${p.playerId?'':' <span class="sdl-warn" title="No Big Board match -- this pick will NOT grey out on the board">⚠</span>'}</span>
      <span class="sdl-pos">${p.pos||'—'}</span>
      <select class="sdl-owner ${p.isMine?'mine':''}" data-idx="${idx}" title="Change who made this pick">
        ${ownerOptions(p)}
      </select>
      <button class="sdl-del" data-idx="${idx}" title="Delete this pick (everything after it renumbers)">✕</button>
    </div>`).join('');

  el.innerHTML = `
    <div class="sdl-form">
      <input id="sdlName" list="sdlPlayers" placeholder="Player name..." autocomplete="off" value="${prefill.replace(/"/g,'&quot;')}">
      <datalist id="sdlPlayers">${avail.map(p=>`<option value="${p.name}">`).join('')}</datalist>
      <select id="sdlTeam">
        <option value="">— drafted by —</option>
        <option value="__me__" ${onClockTeam&&onClockTeam.isMe?'selected':''}>★ Me</option>
        ${lg.teams.filter(t=>!t.isMe).map(t=>`<option value="${t.team}" ${onClockTeam&&!onClockTeam.isMe&&onClockTeam.team===t.team?'selected':''}>${t.team}</option>`).join('')}
      </select>
      <button id="sdlAdd">ADD</button>
      <button id="sdlClear" class="sdl-secondary" ${snakeDraft.picks.length?'':'disabled'}>CLEAR</button>
    </div>
    <div id="sdlMsg" class="sdl-msg">${prefill?`<span class="sdl-prefill">↑ filled from board selection: ${prefill}</span>`:''}</div>
    <div class="sdl-list">${rows||'<div class="sdl-empty">No picks logged yet.</div>'}</div>
    <div class="foot">Log EVERY pick as it happens (not just yours) so the board, My Team and
      Deep Dive stay accurate. Select a player on the board to fill the name automatically.
      Use the dropdown on any row to fix who drafted it, or ✕ to delete a pick from any point
      (later picks renumber). Session-only — a page reload clears the log.</div>`;

  const nameInput = document.getElementById('sdlName');
  const teamSel = document.getElementById('sdlTeam');
  const msg = document.getElementById('sdlMsg');

  function addPick(){
    const raw = nameInput.value.trim();
    if(!raw){ msg.textContent='Enter a player name.'; return; }
    const bp = findBigBoardPlayer(raw);
    const teamVal = teamSel.value;
    const isMine = teamVal === '__me__';
    const overall = snakeDraft.picks.length + 1;
    const info = scheduleAt(lg, overall);
    snakeDraft.picks.push({
      name: bp ? bp.name : raw,
      pos: bp ? bp.pos : null,
      playerId: bp ? bp.id : null,
      overall, round: info.round, pickInRound: info.pickInRound, label: info.label,
      team: isMine ? (lg.teams.find(t=>t.isMe)||{}).team : (teamVal||null),
      isMine,
    });
    // Clear the board selection once logged, so the prefill doesn't keep
    // re-offering a player who's now taken.
    if(bp && snakeDraft.selectedPlayerId===bp.id) snakeDraft.selectedPlayerId = null;
    // Flag unmatched names loudly -- a typo here means the player silently
    // stays "available" on the board, which is the failure mode that matters.
    msg.textContent = bp ? '' : `"${raw}" didn't match a Big Board player — logged, but it won't grey out on the board.`;
    msg.className = bp ? 'sdl-msg' : 'sdl-msg warn';
    nameInput.value='';
    render();
    const again = document.getElementById('sdlName');
    if(again) again.focus();
  }

  document.getElementById('sdlAdd').onclick = addPick;
  nameInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addPick(); } };
  document.getElementById('sdlClear').onclick = ()=>{
    if(snakeDraft.picks.length && confirm(`Clear all ${snakeDraft.picks.length} logged picks?`)){
      snakeDraft.picks = []; render();
    }
  };

  // Delete any pick, not just the most recent.
  el.querySelectorAll('.sdl-del').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.idx);
      const p = snakeDraft.picks[idx];
      if(!p) return;
      // Only confirm when it's NOT the last pick -- deleting the most recent
      // one is the cheap, common "oops" and shouldn't need a dialog, but
      // removing one from mid-draft renumbers everything after it.
      const isLast = idx === snakeDraft.picks.length - 1;
      if(!isLast && !confirm(`Delete ${p.label} ${p.name}? The ${snakeDraft.picks.length-idx-1} pick(s) after it will renumber.`)) return;
      snakeDraft.picks.splice(idx,1);
      renumberSnakePicks(lg);
      render();
    };
  });

  // Reassign the owner of any past pick in place.
  el.querySelectorAll('.sdl-owner').forEach(sel=>{
    sel.onchange = ()=>{
      const idx = Number(sel.dataset.idx);
      const p = snakeDraft.picks[idx];
      if(!p) return;
      const v = sel.value;
      p.isMine = v === '__me__';
      p.team = p.isMine ? (lg.teams.find(t=>t.isMe)||{}).team : (v || null);
      render();
    };
  });
}

// Rosters-by-team: a side-by-side read of what each team has, purely so a
// manual-entry mistake (wrong owner, missed pick, duplicate) can be spotted
// against the real platform without scrolling the chronological log.
// Includes keepers as well as logged picks, since that's what the platform
// shows on a roster -- a log that matches pick-for-pick can still look wrong
// next to ESPN/Yahoo if keepers aren't accounted for.
// Fills a league's roster slots from a set of players, in the order the slots
// are declared. Shared by My Team and Rosters by Team so the two can never
// disagree about which player occupies which slot.
// `entries` items: {player, round, _pick, playerId, pos}
// Three passes, in priority order, because a single in-order pass lets an
// early wildcard slot swallow a player a later dedicated slot needed.
//
// BUG HISTORY: BEN slots were once matched with the same `pos===slot` test
// used for real position slots -- but "BEN" is not a position, so that test
// can never be true and every pick past the starters silently vanished. FLEX
// was the mirror-image bug: it matched everything, so it would absorb a
// QB/K/DEF that no real FLEX slot can start.
function fillRosterSlots(roster, entries){
  const remaining = [...entries];
  const cells = roster.map(slot=>({slot, fill:null}));
  const posOf = (k)=>{
    if(k.pos) return k.pos;
    const bp = findBigBoardPlayer(k.player);
    return bp ? bp.pos : null;
  };
  cells.forEach(c=>{                                   // 1. dedicated starters
    if(['FLEX','BEN','IR'].includes(c.slot)) return;
    const i = remaining.findIndex(k=>posOf(k)===c.slot);
    if(i>=0) c.fill = remaining.splice(i,1)[0];
  });
  cells.forEach(c=>{                                   // 2. FLEX: RB/WR/TE only
    if(c.slot!=='FLEX') return;
    const i = remaining.findIndex(k=>FLEX_ELIGIBLE.includes(posOf(k)));
    if(i>=0) c.fill = remaining.splice(i,1)[0];
  });
  cells.forEach(c=>{                                   // 3. bench: anything left
    if(c.slot!=='BEN' && c.slot!=='IR') return;
    if(remaining.length) c.fill = remaining.shift();
  });
  return {cells, overflow: remaining.length, overflowPlayers: remaining};
}

// Dedupe by Big Board id (falling back to name): if a keeper also gets typed
// into the Draft Log -- easy to do, since keepers consume real draft picks in
// these leagues -- he'd otherwise occupy two roster slots and push a real
// player off the panel.
function dedupeRosterEntries(entries){
  const seen = new Set();
  return entries.filter(k=>{
    const bp = findBigBoardPlayer(k.player);
    const key = bp ? bp.id : (k.player||'').toLowerCase().trim();
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function renderRostersByTeam(lg){
  const el = document.getElementById('rostersByTeamArea');
  if(!el) return;
  if(isAuctionLeague()){ el.innerHTML=''; return; }

  const byTeam = new Map();
  (lg.teams||[]).forEach(t=>byTeam.set(t.team, {team:t, keepers:[], picks:[]}));
  // Unassigned picks still need somewhere to show up -- silently dropping
  // them would hide exactly the data-entry mistake this view exists to catch.
  byTeam.set('__unassigned__', {team:{team:'(unassigned)', isMe:false}, keepers:[], picks:[]});

  (lg.teams||[]).forEach(t=>{
    resolvedKeepers(t).forEach(k=>{
      const bp = findBigBoardPlayer(k.player);
      const entry = byTeam.get(t.team);
      if(entry) entry.keepers.push({player:k.player, pos:bp?bp.pos:null, round:k.round,
                                    playerId:bp?bp.id:null, isKeeper:true});
    });
  });
  snakeDraft.picks.forEach(p=>{
    const key = p.team && byTeam.has(p.team) ? p.team : '__unassigned__';
    byTeam.get(key).picks.push({player:p.name, pos:p.pos, round:p.round,
                                _pick:p.label, playerId:p.playerId, isKeeper:false});
  });

  const roster = lg.rosterSlots || [];
  const warFor = (e)=>{
    const bp = e.playerId ? DATA.players.find(p=>p.id===e.playerId) : findBigBoardPlayer(e.player);
    return bp ? warOf(bp) : null;
  };
  const isStarter = (slot)=> slot!=='BEN' && slot!=='IR';

  const cards = [...byTeam.entries()]
    .filter(([key,v])=>key!=='__unassigned__' || v.picks.length)  // hide the unassigned card unless it has something
    .map(([key,v])=>{
      const entries = dedupeRosterEntries([...v.keepers, ...v.picks]);
      const total = entries.length;
      // The unassigned bucket has no roster shape to fill -- show it as a flat
      // list rather than forcing it through slot allocation.
      const unassigned = key==='__unassigned__';
      const {cells, overflowPlayers} = unassigned
        ? {cells: entries.map(e=>({slot:'?', fill:e})), overflowPlayers: []}
        : fillRosterSlots(roster, entries);

      // WAR totals. Negative WAR is floored at 0 per player rather than
      // subtracted: a below-replacement player on your BENCH costs you
      // nothing, since you'd simply start someone else (that's what
      // "replacement level" means). Subtracting his negative would penalise a
      // team for roster filler it never has to play.
      // Starters are reported separately because in a start-9 league that's
      // the number that actually decides matchups -- bench depth barely moves
      // it, so a raw whole-roster total flatters teams who hoarded depth.
      let sumAll = 0, sumStart = 0;
      cells.forEach(c=>{
        if(!c.fill) return;
        const w = warFor(c.fill);
        if(w==null || w<=0) return;
        sumAll += w;
        if(isStarter(c.slot)) sumStart += w;
      });

      const lines = cells.map(c=>{
        if(!c.fill){
          return `<div class="rbt-p rbt-openslot"><span class="rbt-lbl">${c.slot}</span>
            <span class="rbt-pos">—</span><span class="rbt-nm">open</span><span class="rbt-war"></span></div>`;
        }
        const e = c.fill;
        const w = warFor(e);
        const bp = e.playerId ? DATA.players.find(p=>p.id===e.playerId) : findBigBoardPlayer(e.player);
        const chip = bp ? `<span class="pos-chip" style="${posTierStyle(bp)}" title="${bp.tier&&!isBlankVal(bp.tier)?bp.tier:'no tier'}">${e.pos||bp.pos}</span>`
                        : `<span class="rbt-pos">${e.pos||'—'}</span>`;
        const when = e.isKeeper ? `K${e.round??''}` : (e._pick || `R${e.round??''}`);
        return `<div class="rbt-p${isStarter(c.slot)?'':' rbt-bench'}">
          <span class="rbt-lbl ${e.isKeeper?'rbt-keep':''}" title="${e.isKeeper?'keeper':'drafted'} ${when}">${c.slot}</span>
          ${chip}
          <span class="rbt-nm">${e.player}${e.playerId?'':' <span class="sdl-warn" title="No Big Board match">⚠</span>'}</span>
          <span class="rbt-war ${w==null?'rbt-warna':w<0?'rbt-warneg':''}">${w==null?'—':(w>0?'+':'')+Math.round(w)}</span>
        </div>`;
      }).join('');

      const overflowNote = (overflowPlayers && overflowPlayers.length)
        ? `<div class="rbt-p rbt-over"><span class="rbt-lbl">!</span><span class="rbt-pos">—</span>
           <span class="rbt-nm">${overflowPlayers.length} more than roster has slots: ${overflowPlayers.map(o=>o.player).join(', ')}</span></div>`
        : '';

      return `<div class="rbt-card">
        <div class="rbt-team ${v.team.isMe?'mine':''}">
          <span>${v.team.isMe?'★ ':''}${v.team.team}</span><span class="rbt-count">${total}</span>
        </div>
        ${unassigned?'':`<div class="rbt-wartot" title="Sum of positive WAR. Starters = non-bench slots only.">
          Σ WAR <b>${Math.round(sumAll)}</b> <span class="rbt-startwar">starters ${Math.round(sumStart)}</span>
        </div>`}
        ${lines || '<div class="rbt-empty">nothing yet</div>'}
        ${overflowNote}
      </div>`;
    }).join('');

  el.innerHTML = `<details class="ds-legend" style="margin-top:10px;">
    <summary>ⓘ Rosters by Team — verify my manual entry against the platform</summary>
    <div style="padding:8px 11px;">
      <div style="font-size:9px;color:var(--dim);line-height:1.5;">
        Laid out by roster slot (same order as My Team) so open starting spots are obvious — an
        <b>open</b> row means that team hasn't filled that slot yet. Position colour matches the Player
        Board: hue = position, darker = better tier. <b>Σ WAR</b> sums positive WAR only — a
        below-replacement player on the bench costs nothing, since you'd just start someone else — and
        <b>starters</b> excludes bench slots, which is the number that actually decides matchups.
        Compare against ESPN/Yahoo to catch a pick logged to the wrong owner, a missed pick, or a
        duplicate. A ⚠ means the name didn't match the Big Board, so that player still shows as
        available on the board.
      </div>
      <div class="rbt-grid">${cards}</div>
    </div>
  </details>`;
}

// -------- Player Deep Dive (snake leagues) --------
// Given a selected player, synthesize the insights Sean asked for:
//  1. availability-by-next-pick estimate (draft order + how many picks until
//     my next turn + how many owners ahead plausibly want this position)
//  2. roster fit (does it fill an open need on my team?)
//  3. bye-week overlaps with my current roster
//  4. team stacking / correlation notes
//  5. tier position (top vs bottom of the available tier) => reach vs value
// Everything degrades gracefully when inputs are missing (no ranks, no draft
// order synced, etc.) rather than erroring.

// My roster composition by position: keepers PLUS anything live-logged to me,
// reading whichever draft log the ACTIVE league actually uses (snake vs
// auction). Shared by the Deep Dive roster-fit read and the Adjusted WAR
// discount so those two can never disagree about what I already own.
// Note the two logs store position under different keys -- snake picks use
// `pos`, auction picks use `position`.
function myPositionCounts(lg){
  const myTeamObj = (lg && lg.teams) ? lg.teams.find(t=>t.isMe) : null;
  const counts = {};
  const bump = (pos)=>{ if(pos) counts[pos] = (counts[pos]||0)+1; };
  resolvedKeepers(myTeamObj).forEach(k=>{
    const bp = findBigBoardPlayer(k.player);
    if(bp) bump(bp.pos);
  });
  // Live-logged picks count too -- otherwise roster state stays frozen at the
  // pre-draft (keepers-only) view and keeps reporting open starting slots
  // at positions already filled during the draft.
  if(isAuctionLeague()) zimmerDraft.picks.filter(p=>p.isMine).forEach(p=>bump(p.position));
  else snakeDraft.picks.filter(p=>p.isMine).forEach(p=>bump(p.pos));
  return {myTeamObj, counts};
}
function myRosterPositions(lg){ return myPositionCounts(lg); }

function picksUntilMyNextTurn(lg){
  // Snake: from my slot, how many other picks happen before I'm up again.
  // Without live pick tracking we estimate the *between-turns* gap, which in a
  // snake is (2 * (teams - slot)) + 1 at the turn, or teams-based generally.
  const teams = lg.teams.length;
  const myTeamObj = lg.teams.find(t=>t.isMe);
  const slot = myTeamObj && myTeamObj.draftPosition;
  if(!slot || !teams) return null;
  // average gap between an owner's two picks across a snake boundary:
  // going down then back up. Two common gaps: 2*(teams-slot) and 2*(slot-1).
  // Use the smaller-to-larger range as the "picks until next turn" window.
  const gapA = 2*(teams-slot);   // if we're near the turn
  const gapB = 2*(slot-1);       // the other boundary
  return {teams, slot, minGap: Math.min(gapA,gapB), maxGap: Math.max(gapA,gapB)};
}

function availabilityEstimate(player, lg){
  // Heuristic: a player ranked at overall consensus rank R is likely gone
  // within ~R picks. If my next turn is `gap` picks away and there are already
  // `drafted` players off the board, compare the player's consensus rank to
  // the pick number I'll next be on. Owner positional tendencies (from KEPA)
  // sharpen "how many owners ahead of me still need this position."
  const g = picksUntilMyNextTurn(lg);
  if(!g || player.avgRank==null) return {label:'unknown', detail:'need draft order + consensus rank'};
  // crude current pick count: keepers don't consume snake picks, so approximate
  // "picks made" as 0 pre-draft; this becomes precise once live logging lands.
  const nextPickNumber = g.slot; // pre-draft, my first pick is at my slot
  const cushion = player.avgRank - nextPickNumber;
  // owners drafting ahead of me this round who lean this position historically
  let posHungryAhead = 0;
  if(KEPA && KEPA.owners){
    const ahead = lg.teams.filter(t=>t.draftPosition!=null && t.draftPosition < g.slot);
    ahead.forEach(t=>{
      const prof = KEPA.owners.find(o=>o.manager===t.manager);
      if(prof && prof.early_position_counts && prof.early_position_counts[player.pos]) posHungryAhead++;
    });
  }
  let label, cls;
  const adjCushion = cushion - posHungryAhead*1.5;
  if(adjCushion >= g.maxGap) { label='very likely available'; cls='avail-high'; }
  else if(adjCushion >= 0)   { label='probably available';    cls='avail-mid'; }
  else if(adjCushion >= -g.maxGap){ label='coin flip';        cls='avail-mid'; }
  else { label='likely gone'; cls='avail-low'; }
  const detail = `consensus #${player.avgRank}; your next pick ~#${nextPickNumber}`
    + (posHungryAhead?`, ${posHungryAhead} owner(s) ahead lean ${player.pos}`:'');
  return {label, cls, detail};
}

function tierPositionRead(player){
  // Where does this player sit within their tier? Top of tier = taking them
  // early is a slight reach (the tier still has comparable options); bottom of
  // tier = last chance at this quality, more of a "take now."
  if(!player.tier || player.tier==='0' || !(player.seanPosRank>0)) return null;
  const tierLabel = player.tier.split(' - ')[0];
  const tierMates = DATA.players.filter(p=>p.pos===player.pos && p.tier && p.tier.split(' - ')[0]===tierLabel && p.seanPosRank>0);
  if(tierMates.length<=1) return {tierLabel, pos:'only', read:'only player in this tier — value depends entirely on positional need'};
  const ranks = tierMates.map(p=>p.seanPosRank).sort((a,b)=>a-b);
  const idx = ranks.indexOf(player.seanPosRank);
  const frac = idx/(ranks.length-1);
  if(frac<=0.34) return {tierLabel, pos:'top', read:`top of ${tierLabel} — comparable options likely remain, so taking now is a mild reach unless you need the position`};
  if(frac>=0.67) return {tierLabel, pos:'bottom', read:`bottom of ${tierLabel} — last of this quality tier, so this is more of a "take now or drop a tier"`};
  return {tierLabel, pos:'middle', read:`middle of ${tierLabel}`};
}

function byeOverlaps(player, lg){
  if(!player.byeWeek) return [];
  const {myTeamObj} = myRosterPositions(lg);
  const overlaps = [];
  resolvedKeepers(myTeamObj).forEach(k=>{
    const bp = findBigBoardPlayer(k.player);
    if(bp && bp.byeWeek===player.byeWeek) overlaps.push(bp.name);
  });
  return overlaps;
}

function teamCorrelations(player, lg){
  const team = player.proTeamEspn || player.team;
  if(!team) return [];
  const {myTeamObj} = myRosterPositions(lg);
  const mates = [];
  resolvedKeepers(myTeamObj).forEach(k=>{
    const bp = findBigBoardPlayer(k.player);
    if(bp && (bp.proTeamEspn||bp.team)===team) mates.push(`${bp.name} (${bp.pos})`);
  });
  return mates;
}

// The MKT number alone can't tell you WHICH story it is -- a cheap slot is
// either a mispriced tier or a tier that genuinely got worse. Deep Dive is
// where there's room to say which, in words.
function driftReadBlock(player){
  const d = driftOf(player);
  if(!d) return '';
  const teams = ((DATA.leagues[activeLeague]||{}).teams||[]).length || 12;
  const dir = d.tru>0 ? 'later' : 'earlier';
  const rounds = (Math.abs(d.tru)/teams).toFixed(1);
  let verdict;
  if(d.talent==null){
    verdict = `No 2025 production match for that slot, so this is a price move only — treat it as unconfirmed.`;
  } else if(d.tru>0 && d.price>0 && d.talent>=0){
    verdict = `Cheaper <i>and</i> the tier held its value — a real discount, not a downgrade.`;
  } else if(d.price>0 && d.talent<0 && d.tru<=0){
    verdict = `Looks cheap on price alone, but this tier is weaker than last year's — the discount is earned, not a bargain.`;
  } else if(d.price<0 && d.talent>0){
    verdict = `Costs more than last year, but the tier is genuinely stronger — the premium is at least partly deserved.`;
  } else if(d.tru<0){
    verdict = `Being bid up past what the slot has historically been worth.`;
  } else {
    verdict = `Priced roughly where this slot has been.`;
  }
  return `<div class="dd-block">
      <div class="dd-lbl">Market drift (TruRank)</div>
      <div class="dd-val"><span class="pt-mkt mkt-${d.band}" style="display:inline-block">${d.tru>0?'+':''}${d.tru} picks</span></div>
      <div class="dd-detail">The <b>${d.slot}</b> slot is going ${rounds} round${rounds==='1.0'?'':'s'} ${dir} than ${d.slot} did last year
        (price ${d.price>0?'+':''}${d.price}${d.talent!=null?`, talent ${d.talent>0?'+':''}${d.talent}`:''}).
        ${verdict}</div>
    </div>`;
}

// ---------- Next Best Pick engine + "players I like" ----------

// The overall pick numbers of my next two turns, accounting for picks already
// logged. The older availabilityEstimate() approximates my next pick as my
// draft slot (i.e. pre-draft only) -- that's fine for its purposes but useless
// once a draft is underway, so these do it properly off the live log.
function myUpcomingPicks(lg){
  const teams = (lg.teams||[]).length;
  const me = (lg.teams||[]).find(t=>t.isMe);
  const slot = me && me.draftPosition;
  if(!slot || !teams) return {next:null, after:null, teams, slot:slot||null};
  const start = snakeDraft.picks.length + 1;
  // Read straight off the keeper-aware schedule rather than scanning raw
  // snake positions: rounds where an owner is skipped for a keeper shift
  // every subsequent pick, so position math alone puts my turns in the wrong
  // place -- and this feeds the Deep Dive's "will he last?" read and the
  // TruRank plan, both of which are only as good as the pick number.
  const mine = buildDraftSchedule(lg)
    .filter(s=>s.overall>=start && s.slot===slot)
    .map(s=>s.overall);
  return {next: mine[0] ?? null, after: mine[1] ?? null, teams, slot};
}

// How much *I* like a player relative to the market.
// Returns {score, explicit, flag}:
//   explicit=true  -> came from the Big Board's own "Like" column (Yes/No)
//   explicit=false -> DERIVED from how much higher I rank him than consensus
// The two are kept distinguishable because they're on incompatible scales: a
// derived signal can reach +55 for a deep sleeper, which would otherwise
// outrank a player I explicitly flagged "Yes". Explicit intent should win over
// an inferred one, so callers tier on `explicit` first and only then on score.
function likeSignal(p){
  const raw = p.like;
  if(raw!=null && String(raw).trim()!==''){
    const s = String(raw).trim();
    const up = s.toUpperCase();
    // "#N/A" is an Excel formula error, NOT an opinion -- fall through to the
    // derived signal rather than treating it as a real entry. 26 of the 48
    // populated cells are currently this.
    if(up!=='#N/A' && up!=='N/A' && up!=='NAN'){
      const n = Number(s);
      if(!Number.isNaN(n)) return {score:n*6, explicit:true, flag:null};   // numeric rating
      if(/^(y|yes|like|love|target|★+|\*+)$/i.test(s)) return {score:18, explicit:true, flag:'yes'};
      // Explicit AVOID. Previously this fell through to the derived signal,
      // so a player I'd deliberately marked "No" could still be recommended
      // on the strength of my position rank -- the opposite of the intent.
      if(/^(n|no|avoid|fade|dislike|pass)$/i.test(s)) return {score:-18, explicit:true, flag:'no'};
    }
  }
  // Derived: positive = I'm higher on him than the market is.
  if(p.seanRankOverall!=null && p.avgRank!=null && !isBlankVal(p.avgRank)){
    return {score: p.avgRank - p.seanRankOverall, explicit:false, flag:null};
  }
  return {score:null, explicit:false, flag:null};
}
// Back-compat numeric accessor.
function likeScore(p){ return likeSignal(p).score; }

// Shared blank test (Excel "#N/A" leaks through as a string, see ptRows sort).
function isBlankVal(v){
  if(v==null || v==='') return true;
  if(typeof v==='number' && Number.isNaN(v)) return true;
  if(typeof v==='string'){
    const t = v.trim().toUpperCase();
    if(t==='#N/A' || t==='N/A' || t==='NAN') return true;
  }
  return false;
}

// Will this player still be on the board at `targetOverall`?
// Banded against consensus rank with one round of ADP noise as the tolerance,
// since treating ADP as exact would make every call falsely confident.
function availabilityAt(p, targetOverall, teams){
  if(targetOverall==null || isBlankVal(p.avgRank) || p.avgRank==null){
    return {cls:'risky', label:'unknown', cushion:null};
  }
  const cushion = p.avgRank - targetOverall;   // + = ADP says he lasts past my pick
  const band = teams || 12;                    // ~one round of ADP slop
  if(cushion >= band)  return {cls:'safe',  label:'should last', cushion};
  if(cushion >= -band) return {cls:'risky', label:'coin flip',   cushion};
  return {cls:'gone', label:'likely gone', cushion};
}

// Players I like best, still available, ranked by like-signal.
function topLikedPlayers(lg, n){
  const drafted = ptDraftedMap();
  const rosterable = leagueRosterablePositions(lg);
  return DATA.players
    .filter(p=>p.pos && p.pos!=='NA' && !drafted[p.id] && (!rosterable || rosterable.has(p.pos)))
    .map(p=>{ const sig = likeSignal(p); return {p, ...sig, like:sig.score, war:warOf(p)}; })
    .filter(x=>x.score!=null && x.score>0 && x.flag!=='no')
    // Explicitly-flagged players sort ABOVE derived ones regardless of score:
    // "I marked this guy" is a stronger statement than "my rank happens to be
    // higher than consensus", and the two scales aren't comparable anyway.
    // Within each tier, WAR breaks the tie -- every explicit "Yes" carries the
    // identical score of 18, so without this they'd order arbitrarily.
    .sort((a,b)=>{
      if(a.explicit!==b.explicit) return a.explicit ? -1 : 1;
      if(a.explicit) return (b.war ?? -1e9) - (a.war ?? -1e9);
      return b.score - a.score;
    })
    .slice(0, n||10);
}

// The actual recommendation. Deliberately built on ADJUSTED WAR rather than
// raw WAR, because adjusted already encodes roster construction -- it decays a
// position's value once my starting slots there are full (see
// rosterFillFactors), which is exactly the "factor in roster construction"
// requirement. On top of that:
//   + a like bonus, so my own board beats the market's when I disagree
//   + a scarcity bonus for players who won't survive to my next turn, since
//     equal value now vs later isn't equal if he's gone by then
function recommendNextPicks(lg, n){
  const drafted = ptDraftedMap();
  const rosterable = leagueRosterablePositions(lg);
  const {next, after, teams} = myUpcomingPicks(lg);
  const factors = rosterFillFactors();

  const scored = DATA.players
    .filter(p=>p.pos && p.pos!=='NA' && !drafted[p.id] && (!rosterable || rosterable.has(p.pos)))
    .map(p=>{
      const adj = computeAdjustedWar(p, factors);
      if(adj==null) return null;
      const sig = likeSignal(p);
      const like = sig.score || 0;
      // Cap the like bonus so a deep sleeper I'm 60 spots high on can't
      // leapfrog a genuinely elite player -- it should break ties and tilt
      // close calls, not override the value model.
      // An EXPLICIT flag gets a flat, stronger weight than a derived one:
      // marking someone "Yes" is a deliberate statement, so it shouldn't be
      // scaled down by the same 0.35 factor applied to an inferred signal.
      // "No" is a hard penalty -- large enough to bury a player I've said I
      // don't want, without hard-filtering him (if he's the last startable
      // body at a position I need, I should still see him).
      const likeBonus = sig.explicit
        ? (sig.flag==='no' ? -60 : sig.flag==='yes' ? 12 : Math.max(-15, Math.min(15, like * 0.35)))
        : Math.max(-15, Math.min(15, like * 0.35));
      // Scarcity: only rewards players who won't be there next turn. Uses my
      // pick AFTER next, because the real question is "if I pass now, is he
      // there when I'm back?"
      const av = availabilityAt(p, after, teams);
      const scarcity = av.cls==='gone' ? 10 : av.cls==='risky' ? 4 : 0;
      return {p, adj, like, likeBonus, scarcity, av, explicit:sig.explicit, flag:sig.flag,
              score: adj + likeBonus + scarcity};
    })
    .filter(Boolean)
    .sort((a,b)=>b.score-a.score);

  return {list: scored.slice(0, n||6), next, after, teams};
}

          warOf(top.p)!=null&&warOf(top.p)!==top.adj?` (raw ${warOf(top.p)>0?'+':''}${Math.round(warOf(top.p)*10)/10})`:''}</div>

// ---------- TruRank Draft Plan ----------
// TruRank (marketDrift[league].tru) scores a POSITIONAL SLOT (e.g. "WR2") on
// whether this year's market is pricing that slot favourably vs last year,
// adjusted for talent. Positive = the slot is cheaper/better than it should
// be, i.e. a good place to spend a pick.
//
// The plan answers "which position should I take in each of MY rounds?" by
// looking at which players will realistically be on the board at each of my
// picks and what their slots' TruRank says.

function truOf(p){
  const md = p.marketDrift && p.marketDrift[activeLeague];
  return md && typeof md.tru === 'number' ? md : null;
}

// Every one of my pick numbers for the whole draft, not just the next two.
function myAllPickOveralls(lg){
  const me = (lg.teams||[]).find(t=>t.isMe);
  const slot = me && me.draftPosition;
  if(!slot) return [];
  // Keeper-aware, and it drops the rounds where MY OWN keeper takes the pick
  // -- the TruRank plan shouldn't plan a selection in a round I don't pick in.
  return buildDraftSchedule(lg)
    .filter(s=>s.slot===slot)
    .map(s=>({round:s.round, overall:s.overall}));
}

function buildTruPlan(lg){
  const teams = (lg.teams||[]).length;
  const drafted = ptDraftedMap();
  const rosterable = leagueRosterablePositions(lg);
  const picks = myAllPickOveralls(lg);
  if(!picks.length) return null;

  const pool = DATA.players.filter(p=>
    p.pos && p.pos!=='NA' && !drafted[p.id] &&
    (!rosterable || rosterable.has(p.pos)) &&
    !isBlankVal(p.avgRank) && p.avgRank!=null && truOf(p));

  // What I already have, so the plan doesn't keep recommending a filled position.
  const {counts} = myPositionCounts(lg);
  const have = {...counts};
  const roster = lg.rosterSlots || [];
  const capacityOf = (pos)=>{
    const starters = roster.filter(s=>s===pos).length;
    const flex = FLEX_ELIGIBLE.includes(pos) ? roster.filter(s=>s==='FLEX').length : 0;
    // one bench body beyond starters for the skill positions worth stashing
    const bench = ['RB','WR'].includes(pos) ? 2 : ['QB','TE'].includes(pos) ? 1 : 0;
    return Math.max(1, starters + flex + bench);
  };

  const POSNS = ['QB','RB','WR','TE'];
  const rows = picks.map(({round, overall})=>{
    // Players plausibly on the board at this pick: ADP within half a round
    // before (might slip) through ~1.5 rounds after. A pure "ADP >= overall"
    // cut would ignore that ADP is noisy in both directions.
    const lo = overall - Math.round(teams*0.5);
    const hi = overall + Math.round(teams*1.5);
    const byPos = {};
    POSNS.forEach(pos=>{
      const cands = pool.filter(p=>p.pos===pos && p.avgRank>=lo && p.avgRank<=hi);
      if(!cands.length){ byPos[pos]=null; return; }
      // Best realistic TruRank at this position in this window, plus the
      // player who represents it.
      const best = cands.reduce((a,b)=> (truOf(b).tru > truOf(a).tru ? b : a));
      // Best WAR available here too -- see the guard below.
      const bestWar = cands.reduce((a,b)=> ((warOf(b)??-1e9) > (warOf(a)??-1e9) ? b : a));
      byPos[pos] = {tru: truOf(best).tru, slot: truOf(best).slot,
                    band: truOf(best).band, player: best,
                    war: warOf(bestWar) ?? null, warPlayer: bestWar};
    });
    // VALUE GUARD: TruRank scores how efficiently a positional SLOT is priced,
    // not how good the player is. Ranking on TruRank alone recommended a TE at
    // pick #2 in testing -- correct on price, terrible as draft advice, since
    // it punts ~100 WAR to save a few points of market inefficiency.
    // So: only positions whose best available player is within WAR_TOLERANCE
    // of the best player on the board are eligible, and TruRank then breaks
    // the tie among those. Price efficiency decides between comparable
    // options; it never justifies passing on a materially better player.
    const eligible = POSNS.filter(pos=>byPos[pos] && (have[pos]||0) < capacityOf(pos));
    const maxWar = Math.max(...eligible.map(pos=>byPos[pos].war ?? -1e9), -1e9);
    const WAR_TOLERANCE = 20;
    const inValueRange = eligible.filter(pos=>(byPos[pos].war ?? -1e9) >= maxWar - WAR_TOLERANCE);
    const ranked = (inValueRange.length ? inValueRange : eligible)
      .sort((a,b)=>byPos[b].tru - byPos[a].tru);
    const pick = ranked[0] || null;
    if(pick) have[pick] = (have[pick]||0) + 1;   // simulate taking it forward
    return {round, overall, byPos, ranked, rec:pick};
  });

  // Per-position: which of MY rounds carry a positive TruRank for that position
  const posWindows = {};
  POSNS.forEach(pos=>{
    const good = rows.filter(r=>r.byPos[pos] && r.byPos[pos].tru > 0).map(r=>r.round);
    const best = rows.filter(r=>r.byPos[pos])
      .sort((a,b)=>b.byPos[pos].tru - a.byPos[pos].tru)[0];
    posWindows[pos] = {
      positiveRounds: good,
      best: best ? {round:best.round, tru:best.byPos[pos].tru,
                    slot:best.byPos[pos].slot, player:best.byPos[pos].player.name} : null,
    };
  });

  // RB vs WR lean, round by round -- called out explicitly because it's the
  // decision that recurs most often through the middle of a draft.
  const rbwr = rows.filter(r=>r.byPos.RB && r.byPos.WR).map(r=>({
    round:r.round,
    diff: r.byPos.RB.tru - r.byPos.WR.tru,
    lean: r.byPos.RB.tru > r.byPos.WR.tru ? 'RB' : 'WR',
  }));

  return {rows, posWindows, rbwr, nextOverall: snakeDraft.picks.length + 1};
}

function renderTruPlan(lg){
  const el = document.getElementById('truPlanArea');
  if(!el) return;
  if(isAuctionLeague()){ el.innerHTML=''; return; }
  const plan = buildTruPlan(lg);
  if(!plan){ el.innerHTML=''; return; }

  const cls = (t)=> t>=6 ? 'tp-pos-strong' : t<=-6 ? 'tp-pos-weak' : 'tp-pos-ok';
  const fmt = (v)=> (v>0?'+':'')+v.toFixed(1);

  const body = plan.rows.map(r=>{
    const isNext = r.overall >= plan.nextOverall &&
      !plan.rows.some(o=>o.overall >= plan.nextOverall && o.overall < r.overall);
    const cells = ['QB','RB','WR','TE'].map(pos=>{
      const d = r.byPos[pos];
      if(!d) return `<td class="tp-tru" style="color:var(--dim)">—</td>`;
      return `<td class="tp-tru ${cls(d.tru)}" title="${d.slot}: ${d.player.name}">${fmt(d.tru)}</td>`;
    }).join('');
    return `<tr class="${isNext?'mine-now':''}">
      <td class="tp-rd">R${r.round}</td>
      <td class="tp-pick">#${r.overall}</td>
      ${cells}
      <td><b class="${r.rec?cls(r.byPos[r.rec].tru):''}">${r.rec||'—'}</b></td>
    </tr>`;
  }).join('');

  const w = plan.posWindows;
  const windowTxt = (pos)=>{
    const d = w[pos];
    if(!d || !d.positiveRounds.length){
      return `<div><b>${pos}</b>: no round with positive TruRank — the market is charging full price at every slot you'd reach.</div>`;
    }
    const rs = d.positiveRounds;
    // Collapse consecutive rounds into ranges so a 6-round span doesn't print
    // as six separate numbers.
    const ranges = [];
    let start = rs[0], prev = rs[0];
    rs.slice(1).forEach(x=>{ if(x===prev+1){prev=x;} else {ranges.push([start,prev]); start=prev=x;} });
    ranges.push([start,prev]);
    const txt = ranges.map(([a,b])=>a===b?`R${a}`:`R${a}–${b}`).join(', ');
    return `<div><b>${pos}</b>: positive TruRank at ${txt}${
      d.best?` · best is <b>R${d.best.round}</b> (${d.best.slot}, ${fmt(d.best.tru)}, e.g. ${d.best.player})`:''}</div>`;
  };

  const rbLean = plan.rbwr.filter(x=>x.lean==='RB').map(x=>x.round);
  const wrLean = plan.rbwr.filter(x=>x.lean==='WR').map(x=>x.round);
  const leanTxt = `<div style="margin-top:4px;"><b>RB vs WR</b>: lean
    <b style="color:var(--green)">RB</b> in ${rbLean.length?'R'+rbLean.join(', R'):'—'};
    lean <b style="color:var(--amber)">WR</b> in ${wrLean.length?'R'+wrLean.join(', R'):'—'}.</div>`;

  el.innerHTML = `<div class="tp-wrap">
    <div class="tp-hdr">TRURANK DRAFT PLAN</div>
    <div class="tp-note">Best TruRank reachable at each of your picks, by position. Positive = the market
      is underpricing that positional slot this year relative to last. The <b>Take</b> column is the
      highest-TruRank position you still have room for <i>among those with comparable talent available</i>
      — TruRank prices slots, so on its own it would happily punt 100 WAR to save a few points of
      efficiency. It assumes you follow it, so later rows reflect earlier ones. Amber row = your next pick.</div>
    <table class="tp-tbl">
      <thead><tr><th>Rd</th><th>Pick</th><th style="text-align:right">QB</th><th style="text-align:right">RB</th>
        <th style="text-align:right">WR</th><th style="text-align:right">TE</th><th>Take</th></tr></thead>
      <tbody>${body}</tbody>
    </table>
    <div class="tp-sum">
      ${['QB','TE','RB','WR'].map(windowTxt).join('')}
      ${leanTxt}
    </div>
  </div>`;
}

  const avail = availabilityEstimate(player, lg);
  const tierRead = tierPositionRead(player);

// Shared resizer: drags the divider between the middle and right columns by
// rewriting the WHOLE grid-template-columns string. The grid has FOUR tracks:
// left col, middle (board), an 8px resizer track, right col. Only the middle
// fr weight changes on drag; the others stay fixed. `defaults` = [left, middle,
// right] fr weights (the 8px resizer track is constant and inserted here).
function attachResizer(resizer, cols, defaults){
  if(!resizer || !cols) return;
  const trackStr = (mid)=>{
    const [l,,r] = defaults;
    return `${l}fr ${mid}fr 8px ${r}fr`;
  };
  const readMid = ()=>{
    // parse the current middle fr weight from the inline style if present,
    // else fall back to the default. Matches "Lfr Mfr 8px Rfr".
    const cur = cols.style.gridTemplateColumns;
    const m = cur && cur.match(/^([\d.]+)fr\s+([\d.]+)fr\s+8px\s+([\d.]+)fr$/);
    return m ? parseFloat(m[2]) : defaults[1];
  };
  resizer.onmousedown = (e)=>{
    _cockpitDrag = {cols, startX:e.clientX, startMid:readMid(), defaults, trackStr};
    resizer.classList.add('dragging');
    document.body.style.userSelect='none';
    e.preventDefault();
  };
  if(!_cockpitResizerGlobalWired){
    _cockpitResizerGlobalWired = true;
    window.addEventListener('mousemove', (e)=>{
      if(!_cockpitDrag) return;
      const delta = (e.clientX-_cockpitDrag.startX)/250; // ~250px drag ≈ 1.0 fr
      const mid = Math.max(0.6, Math.min(4, _cockpitDrag.startMid+delta));
      const [l,,r] = _cockpitDrag.defaults;
      _cockpitDrag.cols.style.gridTemplateColumns = `${l}fr ${mid.toFixed(2)}fr 8px ${r}fr`;
    });
    window.addEventListener('mouseup', ()=>{
      if(_cockpitDrag){
        document.querySelectorAll('.cockpit-resizer.dragging').forEach(r=>r.classList.remove('dragging'));
        document.body.style.userSelect='';
        _cockpitDrag = null;
      }
    });
  }
}

function renderDraftOrder(lg){
  const el = document.getElementById('draftOrderArea');
  // Kepners has a live Google Sheet sync; Miami doesn't, but still has keeper
  // data worth showing (confirmed picks owners have told us, plus predictions).
  // Leagues with neither a sync nor a suggestions file don't show the panel.
  const SUG = KEEPER_SUGGESTIONS[activeLeague];
  if(activeLeague!=='kepners' && !SUG){ el.innerHTML=''; return; }
  if(activeLeague==='kepners' && !lg.draftOrderSynced){
    el.innerHTML = `<div class="seclabel">Draft Order &amp; Keepers</div>
      <div class="empty-note">kepners_draft_order.json not found.<br>
      Run "Update Kepners Draft Order" to pull the live Google Sheet.</div>`;
    return;
  }
  // Show every team that's synced from the sheet, not just ones with a
  // drawn slot -- keepers are usually locked in before slots are drawn, so
  // filtering on draftPosition!=null was hiding real keeper data. Assigned
  // slots sort first (in order), then TBD teams.
  const withPos = lg.teams.slice().sort((a,b)=>{
    const aNone = a.draftPosition==null, bNone = b.draftPosition==null;
    if (aNone !== bNone) return aNone ? 1 : -1;
    return aNone ? 0 : a.draftPosition - b.draftPosition;
  });
  const rows = withPos.map(t=>{
    const real = t.liveKeepers||[];
    const allSuggested = (SUG && SUG.by_manager && SUG.by_manager[t.manager]) || [];
    // Entries flagged confirmed are real choices an owner has told us directly,
    // even without a sheet sync (Miami) -- promote them to the green path.
    const confirmed = allSuggested.filter(k=>k.confirmed);
    const suggested = allSuggested.filter(k=>!k.confirmed);
    const realOrConfirmed = real.length ? real : confirmed;
    let keeperHtml;
    if (realOrConfirmed.length){
      // Real Google Sheet data always wins, shown green/confirmed -- unless
      // the name doesn't match any Big Board player at all (typo, or a
      // naming-format mismatch like "Luther Burden III" vs the Big Board's
      // "Luther Burden"), in which case flag it red so it's obvious this
      // keeper isn't actually being tracked anywhere else on the site yet.
      keeperHtml = realOrConfirmed.map(k=>{
        const matched = !!findBigBoardPlayer(k.player);
        return matched
          ? `<span class="do-keeper">${k.player} (R${k.round})</span>`
          : `<span class="do-keeper-unmatched" title="No Big Board player matches this name -- check spelling/format">${k.player} (R${k.round}) ⚠</span>`;
      }).join('<br>');
    } else if (suggested.length){
      // No real data yet -- fall back to the surplus-based prediction from
      // last year's rosters, shown amber/italic and clearly labeled as a guess.
      keeperHtml = suggested.map(k=>`<span class="do-keeper-suggested">${k.player} (R${k.round})<span title="Predicted from 2025 roster + keeper-cost surplus -- not yet confirmed"> *</span></span>`).join('<br>');
    } else {
      keeperHtml = `<span class="do-none">none yet</span>`;
    }
    const posHtml = t.draftPosition!=null ? t.draftPosition : `<span class="do-none">TBD</span>`;
    return `<tr class="${t.isMe?'me':''}">
      <td>${posHtml}</td>
      <td>${t.team}${t.isMe?' ★':''}</td>
      <td>${t.manager}</td>
      <td>${keeperHtml}</td>
    </tr>`;
  }).join('');
  const genDate = lg.draftOrderGenerated ? new Date(lg.draftOrderGenerated).toLocaleString() : '—';
  const unmatchedHtml = (lg.draftOrderUnmatched||[]).length
    ? `<div class="do-unmatched">⚠ ${lg.draftOrderUnmatched.length} name(s) in the sheet didn't match a known manager: ${lg.draftOrderUnmatched.join(', ')} — check for a spelling variant.</div>`
    : '';
  const kepsVintage = KEPS ? ` (from ${KEPS.source_season} rosters)` : '';
  el.innerHTML = `<div class="seclabel">Draft Order &amp; Keepers <span style="font-size:9px;color:var(--dim);font-weight:400;">— live from the shared Google Sheet</span></div>
    <div style="font-size:9px;color:var(--dim);margin-bottom:6px;">
      <span class="do-keeper">green</span> = confirmed in the Google Sheet ·
      <span class="do-keeper-suggested">amber *</span> = predicted${kepsVintage} from last year's roster (surplus of current value vs. keeper-round cost) until the manager enters their real pick ·
      <span class="do-keeper-unmatched">red ⚠</span> = in the sheet but doesn't match any Big Board player -- check spelling/format
    </div>
    <table class="doTable"><thead><tr><th>Pick</th><th>Team</th><th>Manager</th><th>Keepers</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="4" style="color:var(--dim)">No slots claimed yet.</td></tr>'}</tbody></table>
    ${unmatchedHtml}
    <div style="font-size:9px;color:var(--dim);margin-top:2px;">synced ${genDate}</div>`;
}

function renderOwnerProfiles(lg){
  const el = document.getElementById('ownerProfilesArea');
  if(activeLeague!=='kepners'){ el.innerHTML=''; return; }
  if(!KEPA || !KEPA.owners || !KEPA.owners.length){
    el.innerHTML = `<div class="seclabel">Owner Drafting Profiles</div>
      <div class="empty-note">kepners_analysis.json not found.<br>
      Run "Parse Kepners Draft Results" then "Update Kepners Analysis".</div>`;
    return;
  }
  const single = KEPA.seasons_analyzed.length===1;
  const TIMING_POS = ['QB','TE'];
  const stanceCls = (s)=> s==='aggressive' ? 'tm-aggr' : s==='patient' ? 'tm-pat' : 'tm-mkt';

  const cards = KEPA.owners.map(o=>{
    const me = lg.teams.find(t=>t.manager===o.manager && t.isMe);
    // QB/TE timing badges -- the signal RB/WR-centric profiling misses.
    // "gone first" (how many at that position were already off the board) is
    // what separates starting a run from getting swept up in one.
    const badges = TIMING_POS.map(pos=>{
      const t = (o.position_timing||{})[pos];
      if(!t) return '';
      if(!t.drafted) return `<span class="tm-badge tm-none">${pos} —<span class="tm-sub">none drafted</span></span>`;
      // Reach vs the Yahoo board that year: + = took him earlier than ADP.
      const rp = (o.reach_vs_adp||{})[pos];
      const reachTxt = rp && rp.sample
        ? `${rp.median_reach>0?'+':''}${Math.round(rp.median_reach)} vs ADP`
        : `${t.started_the_run?'★ started the run':`${t.gone_before} gone first`}`;
      return `<span class="tm-badge ${stanceCls(t.stance)}" title="${t.player} at overall #${t.overall}${t.vs_median_rounds!=null?`; ${Math.abs(t.vs_median_rounds)} round(s) ${t.vs_median_rounds<0?'earlier':'later'} than league median`:''}${rp&&rp.sample?`; median ${Math.abs(Math.round(rp.median_reach))} picks ${rp.median_reach>0?'earlier':'later'} than Yahoo ADP across ${rp.sample} ${pos} pick(s)`:''}">
        ${pos} R${t.round}
        <span class="tm-sub">${t.started_the_run?'★ ran first · ':''}${reachTxt}</span>
      </span>`;
    }).join('');
    // Overall draft-wide reach tendency
    const ov = (o.reach_vs_adp||{}).overall;
    const ovBadge = ov && ov.sample
      ? `<span class="tm-badge ${ov.median_reach>8?'tm-aggr':ov.median_reach<0?'tm-pat':'tm-mkt'}"
           title="Median across ${ov.sample} non-keeper picks. Biggest reach: ${ov.biggest_reach.player} (${ov.biggest_reach.position}) at overall #${ov.biggest_reach.overall} vs ADP ${ov.biggest_reach.adp}.">
          ALL ${ov.median_reach>0?'+':''}${Math.round(ov.median_reach)}<span class="tm-sub">vs Yahoo ADP</span></span>`
      : '';
    return `<div class="owner-card ${me?'me':''}">
      <div class="owner-head">
        <span class="owner-name">${o.manager}${me?' ★':''}</span>
        <span class="owner-team">${o.team}</span>
      </div>
      <div class="tm-row">${badges}${ovBadge}</div>
      <div class="owner-note">${o.strategy_note}</div>
    </div>`;
  }).join('');

  // League-wide QB/TE timing reference + detected runs
  const timing = KEPA.position_timing || {};
  const runs = KEPA.positional_runs || [];
  const timingSummary = TIMING_POS.filter(p=>timing[p]).map(pos=>{
    const d = timing[pos];
    const fo = d.first_off_board;
    return `<div class="tm-sum-row"><b>${pos}</b>
      first off the board: <b class="tm-hl">${fo.player}</b> at overall #${fo.overall}
      (R${fo.round}, ${fo.manager}) · league median first ${pos}: <b class="tm-hl">R${d.median_first_round}</b>
      · ${d.owners_who_drafted}/${KEPA.owners.length} owners drafted one</div>`;
  }).join('');
  const runsList = runs.length ? runs.map(r=>
    `<div class="tm-sum-row">▸ <b>${r.count} ${r.position}s</b> went between overall
      #${r.start_overall}–${r.end_overall} (from R${r.start_round}) — started by
      <b class="tm-hl">${r.started_by||'—'}</b></div>`).join('')
    : '<div class="tm-sum-row">No positional runs detected.</div>';

  // Who reaches hardest at the scarce positions, vs the Yahoo board that year
  const reachRank = (pos)=>{
    const rows = KEPA.owners
      .map(o=>({m:o.manager, r:(o.reach_vs_adp||{})[pos]}))
      .filter(x=>x.r && x.r.sample)
      .sort((a,b)=>b.r.median_reach-a.r.median_reach);
    if(!rows.length) return '';
    const fmt = x=>`<b class="tm-hl">${x.m}</b> ${x.r.median_reach>0?'+':''}${Math.round(x.r.median_reach)}`;
    return `<div class="tm-sum-row"><b>${pos}</b> most aggressive vs ADP: ${
      rows.slice(0,3).map(fmt).join(' · ')}${rows.length>3?` &nbsp;·&nbsp; most patient: ${fmt(rows[rows.length-1])}`:''}</div>`;
  };
  const hasReach = KEPA.owners.some(o=>(o.reach_vs_adp||{}).overall);
  const reachBlock = hasReach
    ? `<div class="tm-sum-hdr" style="margin-top:7px;">REACH vs YAHOO ADP (median picks earlier than ADP)</div>
       ${TIMING_POS.map(reachRank).join('')}`
    : `<div class="tm-sum-hdr" style="margin-top:7px;">REACH vs YAHOO ADP</div>
       <div class="tm-sum-row">Not available — run "Update Big Board Data" to generate
       <code>kepners_adp_2025.json</code>, then re-run "Update Kepners Analysis".</div>`;

  el.innerHTML = `<div class="seclabel">Owner Drafting Profiles
    <span style="font-size:9px;color:var(--dim);font-weight:400;">
      — ${KEPA.seasons_analyzed.join(', ')}${single?' (single season — will sharpen as more years are added)':''}
    </span></div>
    ${timingSummary||runs.length ? `<div class="tm-summary">

      <div class="tm-sum-hdr" style="margin-top:7px;">DETECTED RUNS (3+ at a position inside 14 picks)</div>
      ${runsList}
      ${reachBlock}
      <div class="tm-foot">Reach is measured against the <b>Yahoo</b> ADP from that season's Big Board
        (column M), since Kepners drafts on Yahoo — not a cross-platform blend nobody here drafted from.
        Keepers are excluded: their round is set by last year's cost, not a decision made against this
        year's board. Stance compares to this league's own median first-pick round, and "gone first"
        counts how many at that position were already drafted — separating the owner who <b>starts</b>
        a run from one swept into it.</div>
    </div>` : ''}
    ${cards}
    ${(KEPA.unmatched_team_labels||[]).length ? `<div class="do-unmatched">⚠ unmatched team label(s) in the parsed history: ${KEPA.unmatched_team_labels.join(', ')}</div>` : ''}`;
}

function verdictClass(verdict){
  // Explicit map, not a strip-non-letters regex -- the regex approach
  // collapsed "elite value+" to the same class as "elite value" (stripping
  // the '+' along with everything else), losing the visual distinction the
  // eliteplus tier exists for.
  if(verdict.startsWith('elite value+')) return 'eliteplus';
  if(verdict.startsWith('elite value')) return 'elite';
  if(verdict.startsWith('great value')) return 'great';
  if(verdict.startsWith('good value')) return 'good';
  if(verdict.startsWith('bust')) return 'bust';
  if(verdict.startsWith('overpriced') || verdict.startsWith('reach')) return 'overpriced';
  return 'fair';
}

// Confirmed + predicted 2026 keepers for a league, deduped the same way the
// drafted-status greyout (ptDraftedMap) already does: a real sync result
// always wins over a same-player prediction. Shared by the Live Feed ticker
// and the draft-tab footer so the two can't disagree on a keeper count.
function leagueKeeperItems(lg){
  // BUG FIXED: confirmed used to mean "only t.liveKeepers" -- correct for
  // Kepners (live sheet sync) but Miami has no sync, so a manager's real
  // pick only ever arrives as a KEEPER_SUGGESTIONS entry flagged `confirmed`.
  // That meant Miami's confirmed keepers fell into the loop below and got
  // mislabeled "*predicted" in the ticker. resolvedKeepers() already knows
  // how to find a team's real keepers whichever source they came from.
  const confirmedIds = new Set();
  const confirmed = [];
  (lg.teams||[]).forEach(t=>{
    resolvedKeepers(t).forEach(k=>{
      const bp = findBigBoardPlayer(k.player);
      if(bp) confirmedIds.add(bp.id);
      confirmed.push({team:t.team, player:k.player, round:k.round});
    });
  });
  const predicted = [];
  const SUG = KEEPER_SUGGESTIONS[activeLeague];
  if(SUG && SUG.by_manager){
    (lg.teams||[]).forEach(t=>{
      (SUG.by_manager[t.manager]||[]).forEach(k=>{
        if(k.confirmed) return; // already counted above via resolvedKeepers
        const bp = findBigBoardPlayer(k.player);
        if(bp && confirmedIds.has(bp.id)) return;
        predicted.push({team:t.team, player:k.player, round:k.round});
      });
    });
  }
  return {confirmed, predicted};
}

function renderTicker(lg){
  // BUG FIXED: this read `lg.keepers` -- a stale 2025 snapshot baked directly
  // into bigboard.json under the league object (short names like "Love",
  // "Daniels", "Bucky" and last year's rounds -- that's why "Ranus keeps Love
  // (R12)" kept showing up no matter what actually happened this year).
  // The live/current data is per-team: `t.liveKeepers` for 2026 keepers (the
  // same source the My Team panel and 2026 Keeper Value Grades already use),
  // plus whatever's been logged in the Draft Log so far. Works identically
  // for Kepners and Miami since it just walks whichever league object it's
  // handed -- no Kepners-only assumptions.
  const isAuction = isAuctionLeague();
  const {confirmed, predicted} = leagueKeeperItems(lg);
  const keeperItems = [
    ...confirmed.map(k=>`<span><b>${k.team}</b> keeps ${k.player} (R${k.round})</span>`),
    ...predicted.map(k=>`<span><b>${k.team}</b> keeps ${k.player} (R${k.round}) <span class="pt-sub" style="display:inline">*predicted</span></span>`),
  ];

  // Live draft picks -- most recent first; this is the actually-"live" part.
  const draftPicks = isAuction ? zimmerDraft.picks : snakeDraft.picks;
  const pickItems = (draftPicks||[]).slice().reverse().map(p=>{
    const teamName = p.isMine ? (lg.teams.find(t=>t.isMe)||{}).team : (p.team||'—');
    const suffix = isAuction ? (p.cost!=null?` $${p.cost}`:'') : (p.label?` @${p.label}`:'');
    return `<span><b>${teamName}</b> drafts ${p.name}${suffix}</span>`;
  });

  const items = [...pickItems, ...keeperItems].slice(0,10);
  const track = items.length
    ? [...items,...items].join('')
    : `<span>NO PICKS YET · <b>${lg.myTeam}</b> ON DECK</span>`;
  document.getElementById('ticker').innerHTML = track;
}

// ---------- "Update Draft Results" button (ESPN, Zimmer only for now) ----------
// Yahoo (Kepners/Miami) needs the still-blocked Yahoo API; ESPN needs nothing
// but a lobby/league ID, so this ships for Zimmer first and is testable TODAY
// against a real ESPN Mock Draft Lobby (see espn_live_draft_pull.py's
// docstring for exactly what's confirmed vs. best-effort about that).
//
// Architecture: the button calls GitHub's REST API directly from the browser
// (api.github.com supports CORS for any origin -- confirmed, no proxy
// server needed) to fire a workflow_dispatch on update-live-draft.yml, polls
// that workflow's most recent run until it completes, then re-fetches the
// JSON it wrote straight from raw.githubusercontent.com.
//
// SECURITY: this requires a GitHub token in the browser, and this repo is
// PUBLIC. The token must NEVER be hardcoded here -- that would hand it to
// every visitor. Sean pastes his own token once; it's kept in HIS OWN
// browser's localStorage only (never committed, never sent anywhere but
// api.github.com). He should generate a fine-grained PAT scoped to ONLY this
// repo with ONLY "Actions: Read and write" permission -- NOT the broad
// classic repo+workflow PAT the season pipeline uses. If this token ever
// leaks, the blast radius should be "someone can trigger workflow runs",
// never "someone can push code or read other data."
const GH_OWNER = 'truckinorcruisin-bit';
const GH_REPO = 'kepners';
const LIVE_DRAFT_WORKFLOW = 'update-live-draft.yml';
const LS_PAT_KEY = 'kepners_gh_actions_pat';
const LS_LOBBY_KEY = 'kepners_espn_lobby_id';

let liveDraftPull = { polling:false, status:null, error:null, result:null };

function ghPat(promptIfMissing){
  let pat = localStorage.getItem(LS_PAT_KEY);
  if(!pat && promptIfMissing){
    pat = window.prompt(
      'Paste a GitHub fine-grained PAT for this button.\n\n'+
      'Generate one at github.com/settings/personal-access-tokens/new:\n'+
      '  • Repository access: Only select repositories -> '+GH_REPO+'\n'+
      '  • Permissions: Actions -> Read and write (nothing else needed)\n\n'+
      'Stored only in this browser (localStorage), never sent anywhere but api.github.com.'
    );
    if(pat) localStorage.setItem(LS_PAT_KEY, pat.trim());
  }
  return pat ? pat.trim() : null;
}

async function ghApi(path, opts){
  const pat = ghPat(true);
  if(!pat) throw new Error('No token provided.');
  const resp = await fetch(`https://api.github.com${path}`, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${pat}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts && opts.headers),
    },
  });
  if(resp.status===401){
    localStorage.removeItem(LS_PAT_KEY); // stale/bad token -- don't keep re-trying it silently
    throw new Error('GitHub rejected the token (401) -- it may be expired or wrong. Cleared it; try again to re-enter.');
  }
  if(!resp.ok && resp.status!==204){
    const body = await resp.text().catch(()=>'');
    throw new Error(`GitHub API ${resp.status}: ${body.slice(0,200)}`);
  }
  return resp.status===204 ? null : resp.json();
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function runLiveDraftPull(lobbyId){
  liveDraftPull = { polling:true, status:'Dispatching workflow…', error:null, result:null };
  renderLiveDraftPull(DATA.leagues[activeLeague]);
  try{
    const dispatchedAt = new Date();
    await ghApi(`/repos/${GH_OWNER}/${GH_REPO}/actions/workflows/${LIVE_DRAFT_WORKFLOW}/dispatches`, {
      method:'POST',
      body: JSON.stringify({ ref:'main', inputs:{ lobby_id:String(lobbyId), year:'2026' } }),
    });

    // Poll for a NEW run (created after dispatchedAt) to completion. Capped
    // at ~40 tries / 3s each (2 min) -- a GH-hosted runner cold-starting plus
    // a single HTTP pull is normally well under a minute; if it's still
    // going past 2 min something's actually wrong and Sean should look at
    // the Actions tab directly rather than staring at a spinner forever.
    let run = null;
    for(let i=0;i<40;i++){
      liveDraftPull.status = i===0 ? 'Waiting for the run to start…' : `Waiting for the run to finish… (${i*3}s)`;
      renderLiveDraftPull(DATA.leagues[activeLeague]);
      await sleep(3000);
      const runs = await ghApi(`/repos/${GH_OWNER}/${GH_REPO}/actions/workflows/${LIVE_DRAFT_WORKFLOW}/runs?per_page=5`);
      const candidate = (runs.workflow_runs||[]).find(r=>new Date(r.created_at) >= dispatchedAt - 5000);
      if(candidate){
        run = candidate;
        if(candidate.status==='completed') break;
      }
    }
    if(!run){
      throw new Error('No run showed up after 2 minutes -- check the Actions tab directly.');
    }
    if(run.status!=='completed'){
      liveDraftPull = { polling:false, status:null,
        error:`Run is still going after 2 min (status: ${run.status}). Check it here: ${run.html_url}`, result:null };
      renderLiveDraftPull(DATA.leagues[activeLeague]);
      return;
    }
    if(run.conclusion!=='success'){
      throw new Error(`Run finished with conclusion "${run.conclusion}". Check the log: ${run.html_url}`);
    }

    liveDraftPull.status = 'Fetching results…';
    renderLiveDraftPull(DATA.leagues[activeLeague]);
    const resp = await fetch(`https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/espn_live_draft.json?t=${Date.now()}`);
    if(!resp.ok) throw new Error(`Workflow succeeded but espn_live_draft.json fetch failed (HTTP ${resp.status}). It may not have committed -- check the run log: ${run.html_url}`);
    const result = await resp.json();
    liveDraftPull = { polling:false, status:null, error:null, result };
  } catch(e){
    liveDraftPull = { polling:false, status:null, error:e.message, result:null };
  }
  renderLiveDraftPull(DATA.leagues[activeLeague]);
}
