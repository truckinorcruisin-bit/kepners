name: Update Kepners Draft Order

# Runs automatically once a day, and can still be triggered manually any time
# right after the Google Sheet changes (owners claiming draft slots or
# locking in keepers). Reads directly from the public Google Sheet -- no
# secrets needed, no re-upload required. Run "Update Big Board" first if this
# is the very first run (needs bigboard.json's manager list to match names).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'  # ~6-7am US Eastern (UTC-5/-4 depending on DST)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync draft order from Google Sheet
        run: python kepners_draft_sync.py

      - name: Re-run Big Board conversion to merge it in
        run: |
          pip install openpyxl
          python convert_bigboard.py data/FY26_BigBoard.xlsx bigboard.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kepners_draft_order.json bigboard.json
          git diff --staged --quiet || git commit -m "Sync Kepners draft order/keepers"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (likely another workflow pushed to main first) -- rebasing and retrying ($i/5)..."
            git pull --rebase origin main
          done
          echo "::error::git push failed after 5 retries. If this keeps happening, check for a genuine merge conflict that needs manual resolution."
          exit 1
