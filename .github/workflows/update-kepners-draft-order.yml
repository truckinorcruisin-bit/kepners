name: Update Kepners Draft Order

# LOCKED 2026-09-02: Sean has finalized keepers for the season. The daily
# `schedule` trigger below is commented out on purpose -- it was silently
# re-pulling the public Google Sheet every day, and anyone editing that
# sheet after the deadline (accidentally or otherwise) would have overwritten
# the now-final keeper data on the very next scheduled run. `workflow_dispatch`
# is left available for an intentional, one-off manual re-sync if a genuine
# correction is ever needed later -- re-enable the schedule block below only
# if a future season needs ongoing live sync again.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 11 * * *'  # ~6-7am US Eastern (UTC-5/-4 depending on DST)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync draft order from Google Sheet
        run: python kepners_draft_sync.py

      - name: Re-run Big Board conversion to merge it in
        run: |
          pip install openpyxl
          python convert_bigboard.py data/FY26_BigBoard.xlsx bigboard.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kepners_draft_order.json bigboard.json
          git diff --staged --quiet || git commit -m "Sync Kepners draft order/keepers"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (likely another workflow pushed to main first) -- rebasing and retrying ($i/5)..."
            git pull --rebase origin main
          done
          echo "::error::git push failed after 5 retries. If this keeps happening, check for a genuine merge conflict that needs manual resolution."
          exit 1
