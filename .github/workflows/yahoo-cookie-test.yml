name: Yahoo Cookie Scrape Test (diagnostic)

# One-off diagnostic: tests whether the YAHOO_COOKIE_STRING secret authenticates
# Yahoo's roster pages when replayed from a GitHub-hosted runner (as opposed to
# your own browser). This is the real open question with the cookie-scraping
# approach -- Yahoo may tie session validity to IP/fingerprint in ways that
# break when the same cookie is reused from a different machine.
#
# Run this manually (Actions tab -> this workflow -> Run workflow), then check
# the uploaded artifact:
#   - Real player names/keeper flags in the JSON => cookie works from GHA, we're good
#   - "LOGIN WALL" errors or a login page in raw_page_sample.html => cookie is
#     tied to your browser session and won't work unattended from GHA

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: 'Yahoo league ID'
        required: true
        default: '102398'
      team_id:
        description: 'Team ID to test (your team in Kepners is 12)'
        required: true
        default: '12'

jobs:
  test-cookie:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 --break-system-packages

      - name: Write cookie to file
        env:
          YAHOO_COOKIE_STRING: ${{ secrets.YAHOO_COOKIE_STRING }}
        run: |
          if [ -z "$YAHOO_COOKIE_STRING" ]; then
            echo "ERROR: YAHOO_COOKIE_STRING secret is empty or not set."
            exit 1
          fi
          echo "$YAHOO_COOKIE_STRING" > yahoo_cookie.txt
          echo "Cookie string length: $(wc -c < yahoo_cookie.txt) characters"

      - name: Run scraper against your roster page
        run: |
          python yahoo_scrape.py \
            --league-id "${{ github.event.inputs.league_id }}" \
            --teams "${{ github.event.inputs.team_id }}" \
            --cookie-file yahoo_cookie.txt \
            --out roster_test_result.json
        continue-on-error: true

      - name: Also save the raw HTML for manual inspection
        run: |
          python - <<'EOF'
          import requests

          with open("yahoo_cookie.txt", "r", encoding="utf-8") as f:
              cookie = f.read().strip()

          session = requests.Session()
          session.headers.update({
              "Cookie": cookie,
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                  "(KHTML, like Gecko) Chrome/124.0 Safari/537.36"
              ),
              "Accept-Language": "en-US,en;q=0.9",
          })

          league_id = "${{ github.event.inputs.league_id }}"
          team_id = "${{ github.event.inputs.team_id }}"
          url = f"https://football.fantasysports.yahoo.com/f1/{league_id}/{team_id}/team"

          resp = session.get(url, timeout=20)
          print(f"Status code: {resp.status_code}")

          with open("raw_page_sample.html", "w", encoding="utf-8") as f:
              f.write(resp.text)

          # Quick signal in the log itself, no need to open the artifact for this part
          login_markers = ('id="login-username"', 'id="login-signin"', "login.yahoo.com")
          if any(m in resp.text for m in login_markers):
              print("!!! RESPONSE LOOKS LIKE A LOGIN PAGE -- cookie did not authenticate from GHA !!!")
          elif "ysf-player-name" in resp.text:
              print(">>> Response contains roster markup -- cookie IS authenticating from GHA <<<")
          else:
              print("??? Response is neither an obvious login page nor obvious roster markup -- inspect the artifact ???")
          EOF

      - name: Remove cookie file before uploading anything
        if: always()
        run: rm -f yahoo_cookie.txt

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-cookie-test-results
          path: |
            roster_test_result.json
            raw_page_sample.html
          retention-days: 3
