name: Yahoo Identity Check (diagnostic)

# One-off: confirms which Yahoo account the CURRENTLY STORED YAHOO_REFRESH_TOKEN
# actually belongs to, by asking Yahoo's own OIDC userinfo endpoint -- rather
# than us inferring it from which browser tab was used. Safe to delete after
# use; doesn't touch any secrets or pipeline data.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh access token
        run: |
          curl -s -X POST https://api.login.yahoo.com/oauth2/get_token \
            -u "${{ secrets.YAHOO_CLIENT_ID }}:${{ secrets.YAHOO_CLIENT_SECRET }}" \
            -d "grant_type=refresh_token&redirect_uri=https://truckinorcruisin-bit.github.io/kepners&refresh_token=${{ secrets.YAHOO_REFRESH_TOKEN }}" \
            -o refresh_response.json
          echo "---- Refresh response (full, untruncated) ----"
          python3 -m json.tool refresh_response.json
          echo "------------------------------------------------"
          echo "---- Account identifier (xoauth_yahoo_guid) ----"
          python3 -c "import json; d=json.load(open('refresh_response.json')); print(d.get('xoauth_yahoo_guid', 'NOT PRESENT in this response'))"
          echo "--------------------------------------------------"
          echo "This GUID is permanent per Yahoo account. Compare it against the GUID from"
          echo "the original smullins99 exchange (rerun this workflow after switching the"
          echo "stored refresh token) to confirm whether the two attempts are actually"
          echo "hitting two different Yahoo accounts."

      - name: Ask Yahoo who this token belongs to
        run: |
          ACCESS_TOKEN=$(python3 -c "import json; print(json.load(open('refresh_response.json')).get('access_token',''))")
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::No access_token in refresh response -- see above, refresh itself failed."
            exit 1
          fi
          echo "---- Yahoo userinfo response ----"
          curl -sL -w "\nHTTP_STATUS:%{http_code}\n" https://api.login.yahoo.com/openid/v1/userinfo \
            -H "Authorization: Bearer $ACCESS_TOKEN"
          echo "----------------------------------"
          echo "---- Fallback: basic Fantasy Sports game-list call ----"
          curl -sL -w "\nHTTP_STATUS:%{http_code}\n" "https://fantasysports.yahooapis.com/fantasy/v2/users;use_login=1?format=json" \
            -H "Authorization: Bearer $ACCESS_TOKEN"
          echo "---------------------------------------------------------"
          echo "A 200 status with an email/sub/guid above identifies the account. A 401/403 status means even identity lookups are being rejected for this token -- itself useful information for Yahoo."
