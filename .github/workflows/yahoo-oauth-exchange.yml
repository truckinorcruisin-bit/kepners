name: Yahoo OAuth Token Exchange

on:
  workflow_dispatch:
    inputs:
      verifier_code:
        description: 'Auth code from the ?code= param after approving on Yahoo'
        required: true
        type: string

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange auth code for tokens
        run: |
          curl -s -X POST https://api.login.yahoo.com/oauth2/get_token \
            -u "${{ secrets.YAHOO_CLIENT_ID }}:${{ secrets.YAHOO_CLIENT_SECRET }}" \
            -d "grant_type=authorization_code&redirect_uri=https://truckinorcruisin-bit.github.io/kepners&code=${{ github.event.inputs.verifier_code }}" \
            -o response.json
          echo "---- Yahoo response ----"
          cat response.json
          echo "-------------------------"

      # Manually copying a ~60-char token with tildes and a trailing hyphen
      # through phone -> log -> clipboard -> secret field has failed twice in a
      # row with "invalid_grant: Invalid refresh token" -- the exchange itself
      # was fine both times, only the transcription wasn't. Writing it straight
      # to the secret via GH_SECRETS_PAT (same mechanism the in-season pipeline
      # already uses for rotated tokens) removes that step entirely.
      - name: Extract refresh_token
        id: extract
        run: |
          TOKEN=$(python3 -c "import json; print(json.load(open('response.json'))['refresh_token'])")
          if [ -z "$TOKEN" ]; then
            echo "::error::No refresh_token in Yahoo's response -- check the JSON printed above for an error field."
            exit 1
          fi
          echo "found_token=true" >> "$GITHUB_OUTPUT"
          echo "$TOKEN" > refresh_token.txt

      - name: Write YAHOO_REFRESH_TOKEN secret
        if: steps.extract.outputs.found_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          gh secret set YAHOO_REFRESH_TOKEN --repo truckinorcruisin-bit/kepners < refresh_token.txt
          echo "YAHOO_REFRESH_TOKEN updated directly -- no copy/paste needed."
          rm -f refresh_token.txt
