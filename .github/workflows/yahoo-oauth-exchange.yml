name: Yahoo OAuth Token Exchange

on:
  workflow_dispatch:
    inputs:
      verifier_code:
        description: 'Verifier code shown on the Yahoo authorize page'
        required: true
        type: string

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange verifier code for tokens
        run: |
          curl -s -X POST https://api.login.yahoo.com/oauth2/get_token \
            -u "${{ secrets.YAHOO_CLIENT_ID }}:${{ secrets.YAHOO_CLIENT_SECRET }}" \
            -d "grant_type=authorization_code&redirect_uri=oob&code=${{ github.event.inputs.verifier_code }}" \
            -o response.json
          echo "---- Yahoo response ----"
          cat response.json
          echo "-------------------------"
          echo "Copy the refresh_token value above into the YAHOO_REFRESH_TOKEN secret."
