name: Run Full Pipeline

# Runs every other workflow in this repo in the correct dependency order, so
# you don't have to click "Run workflow" 12 times in the right sequence
# yourself. Each step triggers the ACTUAL existing workflow via the `gh` CLI
# (pre-installed on every GitHub-hosted runner -- no third-party action) and
# waits for it to finish before dependents start, so you still get each
# workflow's own history, log, and commit message in the Actions tab.
#
# REBUILT 2026-08 after the first version (using the third-party
# convictional/trigger-workflow-and-wait Docker action) failed with
# "Github token is required" on every step. That action is uncertified by
# GitHub and gives one generic error message regardless of cause, which made
# the real problem hard to see. This version uses `gh` directly via a
# checked-out helper script (.github/scripts/trigger-and-wait.sh), which
# gives specific, readable errors (auth failure vs. missing scope vs. bad
# workflow name), and adds a PREFLIGHT job that checks the token works
# before triggering anything else -- so a bad secret fails once, clearly,
# instead of cascading into 12 confusing failures.
#
# The script is invoked as `bash .github/scripts/trigger-and-wait.sh ...`
# rather than executed directly -- files added through GitHub's web file
# editor don't get the executable bit set (no chmod +x available from that
# interface), so calling it via bash explicitly avoids depending on file
# permissions at all.
#
# DEPENDENCY ORDER (confirmed against each script's real file reads, not
# assumed -- see the comment above each job below for the specific evidence):
#
#   PREFLIGHT -- verifies GH_SECRETS_PAT is present and can trigger workflows
#
#   STAGE 1 -- independent data pulls. Only Player Values has a real ordering
#   requirement (it must run after Draft Order so its internal Big Board
#   regen picks up fresh keepers); everything else here runs in PARALLEL --
#   verified against each script's actual file reads, not assumed.
#     - Update Kepners Draft Order   (Google Sheet, no secrets)
#     - Update Kepners Draft History (Yahoo -- see NOTE below, allowed to fail)
#     - Update Zimmer Draft History  (ESPN; also runs zimmer_analysis.py)
#     - Update Season Stats          (ESPN, current season)
#     - Update Weekly Stats          (ESPN, must match Season Stats' year --
#                                      so it waits on that one specifically)
#     - Update Player Values         (ESPN; also regenerates bigboard.json,
#                                      merging in Draft Order's fresh keepers
#                                      -- waits on Draft Order specifically)
#
#   STAGE 2 -- derived analyses, need Stage 1 outputs already committed
#     - Update Big Board Data   (belt-and-suspenders re-merge -- likely
#                                 redundant with Player Values' internal call,
#                                 kept anyway since it's cheap and removes any
#                                 timing doubt)
#     - Update Kepners Analysis (needs kepners_draft_history.json)
#     - Update Kepners Draft Grades (needs espn_season_stats AND
#                                     kepners_draft_history.json)
#     - Update Zimmer Draft Grades  (needs zimmer_draft_history.json AND
#                                     season/weekly stats for GRADED_YEARS =
#                                     2023-2025, which are historical and
#                                     already committed, not re-pulled here)
#     - Update Bid Calibration (needs zimmer_draft_history.json,
#                                espn_season_stats, and espn_player_values)
#
#   STAGE 3 -- final step, needs a fully WAR+bid-populated bigboard.json
#     - Run Roster Optimizer
#
#   DELIBERATELY EXCLUDED:
#     - pages-build-deployment: auto-triggered by every push, never run manually
#     - Parsing a pasted Yahoo draft-results export (parse_kepners_draft_txt.py):
#       needs a manually pasted text file, has no workflow_dispatch wrapper,
#       and can't run unattended -- do this one by hand when you have a fresh
#       export to paste.
#
# NOTE on Yahoo (Update Kepners Draft History): as of this writing, Yahoo API
# access is still pending approval, so this step may fail every run until
# that's resolved. It's marked continue-on-error so a Yahoo failure does NOT
# block the rest of the pipeline -- Kepners Analysis/Grades will just keep
# using whatever history is already committed until Yahoo access lands.
#
# REQUIRES: a repo secret GH_SECRETS_PAT with permission to trigger workflows
# (classic PAT: "repo" scope; fine-grained PAT: "Actions: write" +
# "Contents: write"). Must be a REPOSITORY secret (Settings > Secrets and
# variables > Actions > Repository secrets), NOT an Environment secret --
# environment secrets aren't visible to a job unless that job declares
# `environment:`, which none of these do.

on:
  workflow_dispatch:
    inputs:
      current_season:
        description: 'Current season year (Update Season Stats / Update Weekly Stats)'
        required: false
        default: '2026'
      grade_season:
        description: 'Past season to grade Kepners keepers for (Update Kepners Draft Grades)'
        required: false
        default: '2025'
      xlsx_path:
        description: 'Path to the Big Board Excel file (Update Big Board Data)'
        required: false
        default: 'data/FY26_BigBoard.xlsx'

env:
  GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
  REPO: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------- PREFLIGHT
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GH_SECRETS_PAT is present and can trigger workflows
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_SECRETS_PAT is empty or not set. Check Settings > Secrets and variables > Actions > Repository secrets in this repo -- it must be a REPOSITORY secret (not an Environment secret) named exactly GH_SECRETS_PAT."
            exit 1
          fi
          echo "Token is present. Verifying it can read this repo's workflows..."
          if ! gh api "repos/$REPO/actions/workflows" --jq '.total_count' > /dev/null; then
            echo "::error::GH_SECRETS_PAT exists but the API call failed -- it likely lacks 'repo' scope (classic PAT) or 'Actions: read/write' + 'Contents: read' permission (fine-grained PAT). Check the token's scope at github.com/settings/tokens (classic) or github.com/settings/personal-access-tokens (fine-grained)."
            exit 1
          fi
          echo "OK -- token can read and should be able to trigger workflows in $REPO."

  # ---------------------------------------------------------------- STAGE 1
  kepners-draft-order:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger and wait -- Update Kepners Draft Order
        run: bash .github/scripts/trigger-and-wait.sh update-kepners-draft-order.yml

  kepners-draft-history:
    needs: preflight
    runs-on: ubuntu-latest
    # Allowed to fail without blocking the rest of the pipeline -- Yahoo API
    # access is pending approval as of this writing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Trigger and wait -- Update Kepners Draft History
        run: bash .github/scripts/trigger-and-wait.sh update-kepners-history.yml

  zimmer-draft-history:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger and wait -- Update Zimmer Draft History
        run: bash .github/scripts/trigger-and-wait.sh update-zimmer-history.yml

  season-stats:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger and wait -- Update Season Stats
        run: bash .github/scripts/trigger-and-wait.sh update-season-stats.yml "year=${{ github.event.inputs.current_season }}"

  weekly-stats:
    needs: season-stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger and wait -- Update Weekly Stats
        run: bash .github/scripts/trigger-and-wait.sh update-weekly-stats.yml "year=${{ github.event.inputs.current_season }}"

  player-values:
    needs: [preflight, kepners-draft-order]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger and wait -- Update Player Values
        run: bash .github/scripts/trigger-and-wait.sh update-player-values.yml "year=${{ github.event.inputs.current_season }}"

  # ---------------------------------------------------------------- STAGE 2
  big-board:
    needs: [kepners-draft-order, player-values]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger and wait -- Update Big Board Data
        run: bash .github/scripts/trigger-and-wait.sh update-bigboard.yml "xlsx_path=${{ github.event.inputs.xlsx_path }}"

  kepners-analysis:
    needs: kepners-draft-history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger and wait -- Update Kepners Analysis
        run: bash .github/scripts/trigger-and-wait.sh update-kepners-analysis.yml

  kepners-draft-grades:
    needs: [season-stats, kepners-draft-history]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger and wait -- Update Kepners Draft Grades
        run: bash .github/scripts/trigger-and-wait.sh update-kepners-draft-grades.yml "season=${{ github.event.inputs.grade_season }}"

  zimmer-draft-grades:
    needs: [zimmer-draft-history, weekly-stats]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger and wait -- Update Zimmer Draft Grades
        run: bash .github/scripts/trigger-and-wait.sh update-draft-grades.yml

  bid-calibration:
    needs: [zimmer-draft-history, season-stats, player-values]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger and wait -- Update Bid Calibration
        run: bash .github/scripts/trigger-and-wait.sh update-bid-calibration.yml

  # ---------------------------------------------------------------- STAGE 3
  roster-optimizer:
    needs: big-board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger and wait -- Run Roster Optimizer
        run: bash .github/scripts/trigger-and-wait.sh update-roster-optimizer.yml
