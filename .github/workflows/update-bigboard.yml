name: Update Big Board Data

# Run manually from the Actions tab — click "Run workflow"
on:
  workflow_dispatch:
    inputs:
      xlsx_path:
        description: 'Path to the Big Board Excel file in this repo'
        required: false
        default: 'data/FY26_BigBoard.xlsx'

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Run converter
        run: python convert_bigboard.py "${{ github.event.inputs.xlsx_path }}" bigboard.json

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bigboard.json
          git diff --staged --quiet || git commit -m "Update bigboard.json from ${{ github.event.inputs.xlsx_path }}"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (likely another workflow pushed to main first) -- rebasing and retrying ($i/5)..."
            git pull --rebase origin main
          done
          echo "::error::git push failed after 5 retries. If this keeps happening, check for a genuine merge conflict that needs manual resolution."
          exit 1
