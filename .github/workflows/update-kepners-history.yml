name: Update Kepners Draft History

# Run manually from the Actions tab.
# Requires FOUR repo secrets (Settings > Secrets and variables > Actions):
#   YAHOO_CLIENT_ID, YAHOO_CLIENT_SECRET, YAHOO_REFRESH_TOKEN
#   GH_SECRETS_PAT -- a Personal Access Token (classic, "repo" scope, or fine-grained
#     with "Secrets: write" on this repo) used ONLY to write the rotated refresh
#     token back to YAHOO_REFRESH_TOKEN after each run. The default GITHUB_TOKEN
#     Actions provides cannot write repo secrets, so this extra PAT is required --
#     without it, Yahoo's refresh-token rotation will silently break the NEXT run.
# See yahoo_setup.py docstring for how to obtain the initial refresh token
# (one-time, done locally with a browser -- Yahoo's login step can't run in CI).
on:
  workflow_dispatch:

jobs:
  fetch-history:
    runs-on: ubuntu-latest
    env:
      YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
      YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
      YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Pull Kepners draft history from Yahoo
        id: yahoo_pull
        run: python yahoo_kepners_history.py

      - name: Persist rotated refresh token (if Yahoo issued a new one)
        if: steps.yahoo_pull.outputs.refresh_token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          gh secret set YAHOO_REFRESH_TOKEN --body "${{ steps.yahoo_pull.outputs.refresh_token }}" --repo "${{ github.repository }}"

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kepners_draft_history.json
          git diff --staged --quiet || git commit -m "Update Kepners draft history"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (likely another workflow pushed to main first) -- rebasing and retrying ($i/5)..."
            git pull --rebase origin main
          done
          echo "::error::git push failed after 5 retries. If this keeps happening, check for a genuine merge conflict that needs manual resolution."
          exit 1
