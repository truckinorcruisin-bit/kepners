name: Update Zimmer Draft History

# Run manually from the Actions tab.
# Requires three repo secrets (Settings > Secrets and variables > Actions):
#   ESPN_LEAGUE_ID, ESPN_S2, ESPN_SWID
# See espn_zimmer_history.py docstring for how to find these (browser cookies --
# no OAuth app or approval process needed, unlike Yahoo).
on:
  workflow_dispatch:

jobs:
  fetch-history:
    runs-on: ubuntu-latest
    env:
      ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install espn_api

      - name: Pull Zimmer draft history from ESPN
        run: python espn_zimmer_history.py

      - name: Build Zimmer analysis summary
        run: python zimmer_analysis.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zimmer_draft_history.json zimmer_analysis.json
          git diff --staged --quiet || git commit -m "Update Zimmer draft history + analysis"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (likely another workflow pushed to main first) -- rebasing and retrying ($i/5)..."
            git pull --rebase origin main
          done
          echo "::error::git push failed after 5 retries. If this keeps happening, check for a genuine merge conflict that needs manual resolution."
          exit 1
